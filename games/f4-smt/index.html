<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a1c">
<title>The Quiet Machine — The Hardest Factory Lessons</title>
<meta name="description" content="A free game: the factory's AOI passes 99.7% of boards. What is it not telling you? Tune the machine, audit its escapes, and read the yield report. From The Hardest Factory Lessons, Chapter 4.">
<link rel="stylesheet" href="../factory.css?v=1">
<link rel="stylesheet" href="../juice.css?v=2">
<style>
.aoi{position:relative;height:150px;border-radius:14px;overflow:hidden;background:linear-gradient(#1b2b2e 0 55%,#23363a 55% 100%);border:1px solid var(--rule)}
.aoi .gantry{position:absolute;left:0;right:0;top:10px;height:44px;border-radius:8px;background:#2f4247;border:2px solid #3b5359;display:flex;align-items:center;justify-content:center;gap:8px;font:900 11px var(--font);letter-spacing:.1em;color:var(--acc)}
.aoi .eye{font-size:22px;animation:jfloat 1.6s ease-in-out infinite}
.aoi .belt{position:absolute;left:0;right:0;bottom:16px;height:16px;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.bd{position:relative;aspect-ratio:1.5;border-radius:5px;background:#1f8a4c;border:2px solid #14633a;display:grid;place-items:center;font-size:11px;overflow:hidden;animation:scanin .35s ease both;animation-delay:calc(var(--i) * .09s)}
.bd:before{content:"";position:absolute;left:18%;top:28%;width:30%;height:34%;background:#1b1f23;border-radius:2px}
.bd:after{content:"";position:absolute;right:14%;top:20%;width:12%;height:55%;background:repeating-linear-gradient(#e8c547 0 2px,transparent 2px 5px);opacity:.8}
@keyframes scanin{0%{transform:scale(.6);opacity:0}50%{transform:scale(1.08);box-shadow:0 0 0 3px rgba(61,214,198,.7)}100%{transform:none;opacity:1}}
.bd.flag{background:#8a2c26;border-color:#ff5a4e}
.bd.flag.fc{background:#8a5a1f;border-color:#ff9f43}
.bd .m{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;z-index:2;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.bd.esc{box-shadow:0 0 0 2px #b388ff} .bd.esc .m{color:#e5d4ff}
.bd.audit{animation:none}
.set{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.set button{display:grid;gap:3px;justify-items:center;text-align:center;border:2px solid var(--rule);background:var(--panel2);border-radius:14px;padding:12px 6px;color:var(--ink);font:inherit;cursor:pointer;transition:transform .08s}
.set button:active{transform:scale(.94)} .set button i{font-style:normal;font-size:28px} .set button b{font-size:14px} .set button span{font-size:11px;color:var(--muted);line-height:1.3}
.set button.on{border-color:var(--acc);background:#16363a;transform:scale(1.04)}
.toggle{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;border:2px solid var(--rule);background:var(--panel2);border-radius:14px;padding:12px;color:var(--ink);font:inherit;cursor:pointer;width:100%}
.toggle i{font-style:normal;font-size:26px} .toggle b{font-size:14px} .toggle span{font-size:12px;color:var(--muted);display:block;line-height:1.3} .toggle em{font:800 12px var(--font);font-style:normal;color:var(--acc)}
.toggle.on{border-color:var(--acc);background:#16363a}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .stat3>div{background:#0e1718;border-radius:12px;padding:10px 6px;text-align:center;display:grid;gap:2px} .stat3 b{font-size:20px;font-variant-numeric:tabular-nums} .stat3 span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat3 b.bad{color:var(--red)} .stat3 b.good{color:var(--green)} .stat3 b.warn{color:var(--amber)}
.report{background:#f4efe3;color:#2a2418;border-radius:6px;padding:12px;display:grid;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.report .rh{font:900 10px var(--font);letter-spacing:.1em;text-transform:uppercase;color:#6b6252} .report .rv{display:flex;justify-content:space-between;font-size:14px} .report .rv b{font-size:16px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.bars2{display:grid;gap:8px}
.br{display:grid;gap:3px;font-size:12.5px;color:#d6e4e3} .br .t{display:flex;justify-content:space-between} .br .tr{height:10px;border-radius:5px;background:#0e1718;overflow:hidden;position:relative} .br .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;animation:fillb .8s cubic-bezier(.2,1.1,.4,1) both;transform-origin:left}
@keyframes fillb{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="../hhl.js?v=15"></script>
<script src="../juice.js?v=2"></script>
<script>
(function () {
'use strict';
var $app = document.getElementById('app');
var LOTS = 3, N = 24;

/* ---------- content ---------- */
// AOI catch probability by defect class and sensitivity; X-ray adds a second look at hidden joints
var CATCH = { loose:{ marginal:0.2, subtle:0 }, standard:{ marginal:0.85, subtle:0.1 }, strict:{ marginal:1, subtle:0.3 } };
var FALSE = { loose:0, standard:2, strict:6 };
var XRAY = 0.7;
var SET = {
  loose:    { ic:'🔇', name:'Quiet', sub:'The factory default. Few false calls, a fast line, a calm verify bench.' },
  standard: { ic:'🎚️', name:'Standard', sub:'Marginal fillets are called. A couple of false calls.' },
  strict:   { ic:'🔊', name:'Strict', sub:'Calls almost everything marginal, and some good boards. Slows the line.' }
};
var COST = { falseCall:2, strictLine:12, xray:15, audit:5, testRework:8, fieldMarginal:60, fieldSubtle:90 };
var NAMES = ['Meijie Technology', 'Hongcheng Electronics', 'Yuanda Intelligent', 'Dongyue Smart Manufacturing'];

var G = null;
var store = { get:function (k, d) { try { var v = localStorage.getItem('hhl.ch104.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set:function (k, v) { try { localStorage.setItem('hhl.ch104.' + k, JSON.stringify(v)); } catch (e) {} } };
function fmt(n) { return Number(n).toLocaleString('en'); }
function later(ms, fn) { setTimeout(function () { try { fn(); } catch (e) {} }, J.reduce ? 0 : ms); }
function el(h) { $app.innerHTML = h; window.scrollTo(0, 0); }
function $q(s) { return $app.querySelector(s); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function topbar(back) { return '<div class="top">' + (back ? '<a class="back" href="../">← Games</a>' : '<span></span>') + J.muteBtn() + '</div>'; }

function makeLot(k) {
  var idx = shuffle(Array.apply(null, Array(N)).map(function (_, i) { return i; })), b = [];
  for (var i = 0; i < N; i++) b.push({ t:'ok', u:Math.random(), u2:Math.random(), flag:false, fc:false, esc:false, test:false });
  var o = 3, m = 3, s = 2, p = 0;
  // the first hour of a run is its worst: lot 1 piles extra marginal defects into the first boards
  var firstHour = k === 0 ? [0, 1, 2, 3, 4, 5].slice(0, 3) : [];
  firstHour.forEach(function (i) { b[i].t = 'marginal'; });
  var free = idx.filter(function (i) { return firstHour.indexOf(i) < 0; });
  free.slice(0, o).forEach(function (i) { b[i].t = 'obvious'; });
  free.slice(o, o + m).forEach(function (i) { b[i].t = 'marginal'; });
  free.slice(o + m, o + m + s).forEach(function (i) { b[i].t = 'subtle'; });
  return b;
}
function newGame() {
  G = { name:pick(NAMES), lot:0, boards:[], setting:null, xray:false, audited:{}, lots:[], cost:[], phase:'title' };
}

/* ---------- screens ---------- */
function scene(label) {
  return '<div class="aoi"><div class="gantry"><span class="eye">👁️</span> AOI · ' + label + '</div><div class="belt j-belt"></div>' +
    '<div style="position:absolute;left:12px;bottom:34px;display:flex;gap:10px;font-size:22px" class="j-float">🟩🟩🟩</div><div style="position:absolute;right:12px;bottom:34px;font-size:30px">🧑‍🔧</div></div>';
}
function screenTitle() {
  el(topbar(true) + '<div class="card">' + scene('PASS RATE 99.7%') +
   '<h3>Chapter 4 · The Hardest Factory Lessons</h3><h1>The Quiet <span>Machine</span></h1>' +
   '<p>The SMT line is the most measurable place your product will ever pass through, and <b>none of its measurements protect you by default</b>. The AOI\'s silence may be tuning, not quality.</p>' +
   '<div class="plain"><b>In plain English:</b> a machine photographs every circuit board after soldering and flags bad ones. Flag too much and the line crawls. Flag too little and defects reach customers. The factory pays for the first mistake and you pay for the second. <b>Goal:</b> find the setting that protects you, and see what the yield report is hiding.</div>' +
   '<ul style="margin:0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.55"><li><b>Three production runs</b> of 24 boards. Set the AOI before each.</li><li><b>Add X-ray</b> for joints AOI cannot see.</li><li><b>Audit the escapes</b> to learn what the machine passed.</li></ul>' +
   '<button class="btn" data-a="start">Start the first run</button><p class="small" style="text-align:center">Best ' + fmt(store.get('best', 0)) + ' · The factory is fictional.</p></div>');
}

function screenBrief() {
  G.phase = 'brief';
  el(topbar(false) + '<div class="card"><h3>' + G.name + ' · weekly report</h3><h2>"Everything is green"</h2>' +
   '<div class="report"><div class="rh">Yield report · your product</div><div class="rv"><span>AOI pass rate</span><b>99.7%</b></div><div class="rv"><span>Final yield</span><b>99.4%</b></div><div class="rv"><span>Escape rate</span><b>not reported</b></div></div>' +
   '<p>"Final yield" is measured after rework. "AOI pass rate" depends entirely on thresholds you have never seen. The escape rate is a number most factories cannot produce, because measuring it means deliberately auditing what the machine passes, an activity with no daily constituency.</p>' +
   '<div class="note"><b>The incentive</b>False calls cost the factory today. False accepts cost the factory nothing, and cost <i>you</i> later. So every AOI program drifts toward quiet.</div>' +
   '<button class="btn" data-a="setup">Set up run 1</button></div>');
}

function screenSetup() {
  G.phase = 'setup'; var k = G.lot;
  el(topbar(false) + '<div class="card"><h3>Run ' + (k + 1) + ' of ' + LOTS + '</h3><h2>Set the machine</h2>' + scene('READY') +
   '<div class="set">' + ['loose', 'standard', 'strict'].map(function (s) { return '<button data-a="set" data-s="' + s + '" class="' + (G.setting === s ? 'on' : '') + '"><i>' + SET[s].ic + '</i><b>' + SET[s].name + '</b><span>' + SET[s].sub + '</span></button>'; }).join('') + '</div>' +
   '<button class="toggle' + (G.xray ? ' on' : '') + '" data-a="xray"><i>🩻</i><span><b>Add X-ray sampling</b>For BGAs and joints AOI physically cannot see: under shields, under packages, facing inward.</span><em>−€' + COST.xray + 'k</em></button>' +
   (k === 0 ? '<div class="note warn"><b>The first hour</b>The first boards off a changeover are the worst. Short runs are disproportionately built from the line\'s worst hours.</div>' : '') +
   '<button class="btn" data-a="run"' + (G.setting ? '' : ' disabled') + '>Run the lot</button></div>');
}

function runLot() {
  var k = G.lot, boards = makeLot(k), set = G.setting, xr = G.xray;
  boards.forEach(function (b) {
    if (b.t === 'obvious') b.flag = true;
    else if (b.t === 'marginal') b.flag = b.u < CATCH[set].marginal;
    else if (b.t === 'subtle') b.flag = b.u < CATCH[set].subtle || (xr && b.u2 < XRAY);
  });
  var good = boards.filter(function (b) { return b.t === 'ok'; });
  shuffle(good).slice(0, FALSE[set]).forEach(function (b) { b.flag = true; b.fc = true; });
  // the electrical test downstream catches some of what escaped
  boards.forEach(function (b) { if (!b.flag && b.t !== 'ok') { var p = b.t === 'marginal' ? 0.5 : 0.2; b.test = Math.random() < p; b.esc = !b.test; } });
  var c = { fc:good.filter(function (b) { return b.fc; }).length, caught:boards.filter(function (b) { return b.flag && !b.fc; }).length, test:boards.filter(function (b) { return b.test; }).length,
            escM:boards.filter(function (b) { return b.esc && b.t === 'marginal'; }).length, escS:boards.filter(function (b) { return b.esc && b.t === 'subtle'; }).length, set:set, xray:xr };
  var passed = N - boards.filter(function (b) { return b.flag; }).length;
  c.passRate = Math.round(1000 * passed / N) / 10;
  var cost = c.fc * COST.falseCall + (set === 'strict' ? COST.strictLine : 0) + (xr ? COST.xray : 0) + c.test * COST.testRework;
  G.lots.push({ boards:boards, c:c, cost:cost, audited:false }); G.cost.push(cost);
  screenRun();
}

function boardHtml(b, i, audit) {
  var cls = 'bd' + (b.flag ? ' flag' + (b.fc ? ' fc' : '') : '') + (audit && b.esc ? ' esc' : '') + (audit ? ' audit' : ''), m = '';
  if (b.flag) m = b.fc ? '?' : '✖'; else if (audit && b.esc) m = b.t === 'subtle' ? '◉' : '▲'; else if (!b.flag) m = '✓';
  return '<div class="' + cls + '" style="--i:' + i + '"><div class="m">' + m + '</div></div>';
}
function screenRun() {
  G.phase = 'run'; var L = G.lots[G.lot], c = L.c;
  el(topbar(false) + '<div class="card"><h3>Run ' + (G.lot + 1) + ' · ' + SET[c.set].name + (c.xray ? ' + X-ray' : '') + '</h3><h2>The line ran</h2>' + scene('SCANNING') +
   '<div class="grid" id="grid">' + L.boards.map(function (b, i) { return boardHtml(b, i, false); }).join('') + '</div>' +
   '<div class="legend"><span><i style="background:#8a2c26"></i>flagged ✖</span><span><i style="background:#8a5a1f"></i>false call ?</span><span><i style="background:#1f8a4c"></i>passed ✓</span></div>' +
   '<div class="report" id="rep" style="opacity:0"><div class="rh">What the factory would report</div><div class="rv"><span>AOI pass rate</span><b>' + c.passRate + '%</b></div></div>' +
   '<div class="stat3" id="st3" style="opacity:0"><div><b class="good">' + c.caught + '</b><span>caught by AOI</span></div><div><b class="warn">' + c.fc + '</b><span>false calls</span></div><div><b class="bad">' + c.test + '</b><span>failed at test</span></div></div>' +
   '<p class="small" id="exp" style="opacity:0">The false calls went to the verify bench. The boards that failed at test were defects the AOI passed. Quiet does not mean clean: some defects pass both machines, and you will not hear about them until a customer does.</p>' +
   '<button class="btn" data-a="audit" id="b1" style="opacity:0">🔍 Escape audit · −€' + COST.audit + 'k</button><button class="btn ghost" data-a="skip" id="b2" style="opacity:0">Skip the audit</button></div>');
  J.sfx('belt');
  var dur = J.reduce ? 0 : N * 90 + 400;
  var iv = J.reduce ? null : setInterval(function () { J.sfx('tick'); }, 180); later(N * 90, function () { if (iv) clearInterval(iv); });
  later(dur, function () {
    ['rep', 'st3', 'exp', 'b1', 'b2'].forEach(function (id) { var e = $q('#' + id); if (e) { e.style.transition = 'opacity .4s'; e.style.opacity = 1; } });
    if (c.fc > 3) { J.sfx('bad'); J.hit($q('#grid'), 'bad', 'small'); } else J.sfx('ok');
  });
}

function screenAudit() {
  var L = G.lots[G.lot], c = L.c; L.audited = true; L.cost += COST.audit; G.cost[G.cost.length - 1] = L.cost;
  var escs = L.boards.filter(function (b) { return b.esc; }), hid = L.boards.filter(function (b) { return b.esc && b.t === 'subtle'; }).length, mar = L.boards.filter(function (b) { return b.esc && b.t === 'marginal'; }).length;
  el(topbar(false) + '<div class="card"><h3>Run ' + (G.lot + 1) + ' · escape audit</h3><h2>What the machine passed</h2>' + scene('AUDIT') +
   '<div class="grid">' + L.boards.map(function (b, i) { return boardHtml(b, 0, true); }).join('') + '</div>' +
   '<div class="legend"><span><i style="background:#1f8a4c;box-shadow:0 0 0 2px #b388ff"></i>▲ marginal escape</span><span><i style="background:#1f8a4c;box-shadow:0 0 0 2px #b388ff"></i>◉ hidden-joint escape</span></div>' +
   '<div class="stat3"><div><b class="' + (escs.length ? 'bad' : 'good') + '">' + escs.length + '</b><span>escapes</span></div><div><b class="warn">' + mar + '</b><span>marginal</span></div><div><b class="warn">' + hid + '</b><span>hidden joint</span></div></div>' +
   '<div class="note ' + (escs.length ? 'bad' : 'good') + '"><b>' + (escs.length ? 'The AOI said 99%+. This is what it passed.' : 'A clean run') + '</b>' + (escs.length ? (hid ? 'Hidden-joint defects are beyond what the AOI can judge: shields, tall neighbours and joints facing inward shift the burden to X-ray, test, or nobody. ' : '') + (mar ? 'Marginal fillets were taught to the model as acceptable. ' : '') + 'None of this was in the weekly report.' : 'At this setting, nothing got past both inspections in this run.') + '</div>' +
   '<button class="btn" data-a="next">' + (G.lot + 1 >= LOTS ? 'Fast-forward to the field' : 'Next run') + '</button></div>');
  J.sfx('scan'); later(500, function () { if (escs.length) { J.sfx('alarm'); J.hit($q('.grid'), 'bad', escs.length > 2 ? 'big' : 'med'); } else { J.sfx('good'); J.confetti(); } });
}

/* ---------- field + result ---------- */
function screenField() {
  G.phase = 'field';
  var escM = 0, escS = 0; G.lots.forEach(function (L) { escM += L.c.escM; escS += L.c.escS; });
  var fc = escM * COST.fieldMarginal + escS * COST.fieldSubtle; G.fieldCost = fc; G.escM = escM; G.escS = escS;
  el(topbar(false) + '<div class="card"><h3>Eleven months later</h3><h2>' + (escM + escS ? 'The returns arrive' : 'A quiet year, honestly') + '</h2>' +
   '<div class="aoi ' + (escM + escS ? 'j-siren' : '') + '" id="stg"><div class="gantry" style="color:' + (escM + escS ? 'var(--red)' : 'var(--green)') + '">FIELD RETURNS</div><div style="position:absolute;inset:0;display:grid;place-items:center;padding-top:38px" class="big-ic ' + (escM + escS ? 'j-drop' : '') + '">' + (escM + escS ? '📦↩️' : '😌') + '</div></div>' +
   '<p>' + (escM + escS ? escM + ' marginal-joint and ' + escS + ' hidden-joint escapes failed in customers\' hands. Intermittent, unreproducible, and expensive.' : 'No defect that mattered got through both inspections.') + '</p>' +
   '<div class="cost" id="cst">−€0k</div><button class="btn" data-a="result">See the result</button></div>');
  if (fc) { J.sfx('alarm'); J.hit($q('#stg'), 'bad', fc >= 150 ? 'big' : 'med'); J.count($q('#cst'), 0, fc, 900, function (n) { return '−€' + Math.round(n) + 'k'; }); } else { J.sfx('good'); }
}
function score() {
  var costs = 0; G.cost.forEach(function (c) { costs += c; }); costs += G.fieldCost || 0;
  return { total:Math.max(0, Math.round(1000 - costs * 1.2)), costs:costs };
}
function screenResult() {
  G.phase = 'result';
  var sc = score(), best = store.get('best', 0), nb = sc.total > best;
  if (nb) store.set('best', sc.total);
  try { HHL.submit(104, sc.total); } catch (e) {}
  var stamp = sc.total >= 700 ? 'pass' : sc.total >= 400 ? 'warn' : 'fail';
  var txt = sc.total >= 700 ? 'THE MACHINE WAS HEARD' : sc.total >= 400 ? 'TOO QUIET' : 'SILENCE WAS EXPENSIVE';
  var rows = G.lots.map(function (L, i) { var c = L.c; return '<div class="br"><div class="t"><b>Run ' + (i + 1) + ' · ' + SET[c.set].name + (c.xray ? ' + X-ray' : '') + '</b><span>reported pass ' + c.passRate + '% · ' + (c.escM + c.escS) + ' escaped · ' + (L.audited ? 'audited' : 'not audited') + '</span></div><div class="tr"><i style="width:' + Math.min(100, Math.round(100 * L.cost / 60)) + '%;background:var(--amber)"></i></div></div>'; }).join('');
  var unaud = G.lots.filter(function (L) { return !L.audited; }).length;
  el(topbar(false) + '<div class="card"><h3>Year-end result</h3><div class="stamp ' + stamp + '" id="stp">' + txt + '</div><div class="bigs" id="bigs">0</div>' +
   (nb ? '<p style="text-align:center;color:var(--acc);font-weight:800" class="j-pulse">New best!</p>' : '<p class="small" style="text-align:center">Best ' + fmt(Math.max(best, sc.total)) + '</p>') +
   '<div class="lines" id="led"><div><span>Line and verify costs</span><em class="neg">−€' + (sc.costs - G.fieldCost) + 'k</em></div><div><span>Field returns</span><em class="neg">−€' + G.fieldCost + 'k</em></div><div><span>Total cost</span><em class="neg">−€' + sc.costs + 'k</em></div></div>' +
   '<h3>Run by run (bars: line cost)</h3><div class="bars2">' + rows + '</div>' +
   '<div class="note warn"><b>What the report hid</b>Every run would have reported an AOI pass rate above 87% and, after rework, a comfortable final yield. ' + (G.escM + G.escS) + ' defect' + ((G.escM + G.escS) === 1 ? '' : 's') + ' escaped into the field. ' + (unaud ? unaud + ' of the runs were never audited, so you flew blind on them.' : 'You audited every run, so you knew.') + '</div>' +
   '<div class="lesson">Demand the primary data: first-pass yield by stage, rework by defect and location, and an escape audit that is dated and has a number. And remember that half of every yield number was set months earlier, at your layout review.</div>' +
   HHL.next(104) +
   '<div class="row"><button class="btn" data-a="again">Run another line</button><button class="btn ghost" data-a="menu">Menu</button></div></div>');
  J.stamp($q('#stp'), stamp); J.count($q('#bigs'), 0, sc.total, 1200);
  later(1300, function () { if (stamp === 'pass') { J.confetti(); J.sfx('win'); } else J.sfx(stamp === 'warn' ? 'ok' : 'lose'); });
  J.stagger($app.querySelectorAll('#led div, .br'), 60);
}

/* ---------- events ---------- */
