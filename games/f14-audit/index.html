<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a1c">
<title>The Audit — The Hardest Factory Lessons</title>
<meta name="description" content="A free game: two days to audit a factory. Pull the evidence, read the reluctance map, spot the staged areas, then decide whether to qualify it. From The Hardest Factory Lessons, Chapter 14.">
<style>
:root{
  --bg:#101a1c; --ink:#eaf3f2; --muted:#93a9a8; --panel:#182427; --panel2:#1e2e31; --rule:#2c4043;
  --acc:#3dd6c6; --red:#ff5a4e; --green:#3ddc84; --amber:#ff9f43; --gold:#f5c518;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 28px)}
#app{width:min(480px,100%);margin:0 auto;display:grid;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{color:var(--muted);text-decoration:none;font:600 14px/1 var(--font);padding:10px 8px;margin-left:-8px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:20px 18px;display:grid;gap:13px;animation:pop .28s ease both}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
h1{margin:0;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.01em} h1 span{color:var(--acc)}
h2{margin:0;font-size:22px;font-weight:800}
h3{margin:0;font:700 11px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.45} p b,li b{color:var(--ink);font-weight:600}
.small{font-size:12.5px} .plain{border-left:3px solid var(--rule);padding:2px 0 2px 10px;font-size:13px;color:#cfdddc}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 16px;font:800 16px/1.1 var(--font);background:var(--acc);color:#07201d;width:100%;min-height:50px;cursor:pointer}
.btn:active{transform:scale(.97)} .btn:disabled{opacity:.35;pointer-events:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:700}
.btn.sm{padding:10px 12px;min-height:40px;font-size:14px;border-radius:11px}
.row{display:flex;gap:10px} .row>*{flex:1}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:10px 12px}
.hud b{font-size:14px} .bar{height:8px;background:#0e1718;border-radius:6px;overflow:hidden} .bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.hud span{font:700 12px/1 var(--font);color:var(--muted);font-variant-numeric:tabular-nums}
.areas{display:grid;gap:8px}
.area{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:12px;text-align:left;color:var(--ink);font:inherit;width:100%;cursor:pointer}
.area:active{transform:scale(.985)} .area.locked{opacity:.55}
.area .n{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font:800 13px var(--font);color:var(--acc)}
.area .t b{display:block;font-size:15px} .area .t span{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font:700 10px/1 var(--font);letter-spacing:.05em;text-transform:uppercase;padding:4px 6px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.tag.w{color:var(--acc)} .tag.d{color:var(--gold)} .tag.p{color:#b9a1ff}
.chip{display:inline-block;font:800 11px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:7px}
.chip.sec{background:rgba(61,220,132,.16);color:var(--green)} .chip.hr{background:rgba(255,159,67,.16);color:var(--amber)} .chip.mt{background:rgba(255,90,78,.16);color:var(--red)}
.claim{background:var(--panel2);border-radius:12px;padding:12px;font-style:italic;color:#d6e4e3;font-size:14px}
.obs{background:#0e1718;border-radius:12px;padding:12px;font-size:14px;color:#d6e4e3;line-height:1.45}
.act{display:grid;gap:8px}
.act button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--rule);background:var(--panel2);border-radius:13px;padding:12px;color:var(--ink);font:inherit;cursor:pointer}
.act button:active{transform:scale(.985)} .act button:disabled{opacity:.4;pointer-events:none}
.act button b{font-size:15px} .act button span{font-size:12px;color:var(--muted);grid-column:1} .act button em{grid-row:1/3;grid-column:2;font:800 13px var(--font);color:var(--acc);font-style:normal;align-self:center}
.pick{display:grid;gap:8px}
.pick button{display:grid;gap:3px;text-align:left;border:1px solid var(--rule);background:var(--panel2);border-radius:13px;padding:12px;color:var(--ink);font:inherit;cursor:pointer}
.pick button.on{border-color:var(--acc);background:#16363a} .pick button b{font-size:15px} .pick button span{font-size:12.5px;color:var(--muted);line-height:1.35}
.note{display:grid;gap:3px;background:#0e1718;border-radius:12px;padding:11px 12px;font-size:13.5px;line-height:1.4;color:#d6e4e3}
.note b{color:var(--acc);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.note.warn b{color:var(--amber)} .note.bad b{color:var(--red)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.seg button{border:1px solid var(--rule);background:var(--panel2);color:var(--muted);border-radius:9px;padding:9px 2px;font:700 12px var(--font);cursor:pointer}
.seg button.on{color:#07201d;border-color:transparent} .seg button.on[data-r=V]{background:var(--green)} .seg button.on[data-r=C]{background:var(--amber)} .seg button.on[data-r=F]{background:var(--red)} .seg button.on[data-r=N]{background:#8aa0a0}
.rate{display:grid;gap:7px;padding:10px 0;border-top:1px solid var(--rule)} .rate:first-of-type{border-top:0}
.rate .h{display:flex;justify-content:space-between;align-items:center;gap:8px} .rate .h b{font-size:14px}
.check{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--rule);font-size:14px;color:#d6e4e3;cursor:pointer}
.check i{width:22px;height:22px;border:2px solid var(--rule);border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:14px;color:transparent}
.check.on i{border-color:var(--red);background:var(--red);color:#fff}
.big{font:900 56px/1 var(--font);text-align:center;color:var(--acc);font-variant-numeric:tabular-nums}
.stamp{justify-self:center;font:900 24px/1 var(--font);letter-spacing:.06em;padding:8px 14px;border:4px solid currentColor;border-radius:8px;transform:rotate(-4deg)}
.stamp.pass{color:var(--green)} .stamp.fail{color:var(--red)} .stamp.warn{color:var(--amber)}
.lines{display:grid;gap:6px} .lines div{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#d6e4e3;padding:7px 0;border-top:1px solid var(--rule)} .lines div:first-child{border-top:0}
.lines em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums} .lines em.pos{color:var(--green)} .lines em.neg{color:var(--red)}
.lesson{background:#0e1718;border-radius:12px;padding:12px;color:#e3efee;font-size:14.5px;line-height:1.5}
.reveal{display:grid;gap:4px;padding:9px 0;border-top:1px solid var(--rule);font-size:13.5px;color:#d6e4e3} .reveal b{font-size:14px}
.tabs{display:flex;gap:6px} .tabs button{flex:1}
a{color:var(--acc)}
</style>
</head>
<body>
<div id="app"></div>
<script src="../hhl.js?v=9"></script>
<script>
(function () {
'use strict';
var $app = document.getElementById('app');
var HOURS_PER_DAY = 8, DAYS = 2;

/* ---------- content ---------- */
// state of an area: solid (real), paper (records exist, unused), staged (hollow behind a showcase), mess (honest but poor), fake (falsified)
var AREAS = [
 { id:'dock', name:'Dock & Receiving', ch:'Ch. 2', role:'the IQC inspector', gate:null,
   claim:'"Every lot is inspected on arrival. We reject on sight."',
   good:'A clean dock. A quarantine cage with yellow tape and tagged reels, forklifts parked in their lanes.',
   bad:'Pallets sit outside under an awning. Uncoated metal parts rust on the dock, and the quarantine cage is being used as a shelf.',
   drill:'Five-minute MSD audit', what:'The dry-cabinet log',
   d:{ solid:'Floor-life stickers match the log, and one correction is initialled.', mess:'Three reels are past floor life. They are tagged and quarantined, which is the honest part.', fake:'A sticker says a reel was opened an hour ago. The log says last Tuesday.' },
   thu:'The extinguisher is back in a cupboard, pallets are outside again, and the log stopped on the day you left.' },
 { id:'warehouse', name:'Warehouse', ch:'Ch. 3', role:'a picker', gate:'flow',
   claim:'"FIFO, fully scanned. Nothing is ever lost."',
   good:'Tidy aisles, labelled locations, a barcode on every shelf.',
   bad:'Piles of reels in the aisles, a shelf of unlabelled boxes, a forklift stuck behind a stack.',
   drill:'Ten-location count', what:'The location count',
   d:{ solid:'Nine of ten match. The tenth moved an hour ago and was already corrected in the system.', mess:'Four of ten are wrong. The system puts stock in locations that are empty.', fake:'Ten of ten match, and every shelf is in datecode order, newest at the front. Someone rearranged it last night.' },
   thu:'Datecodes are mixed again, new reels are stacked in front of old ones, and the humidity sensor now hangs by the AC vent.' },
 { id:'smt', name:'SMT line', ch:'Ch. 4', role:'a line operator', gate:null, driller:'live',
   claim:'"99.8% first-pass yield. The AOI catches everything."',
   good:'Placement machines ticking, a green number above the line, a calm operator at the feeder.',
   bad:'The line runs, but three feeders are taped over and an operator hand-places parts at one corner.',
   drill:'Yield report vs the live AOI screen', what:'The yield report',
   d:{ solid:'The report matches the AOI screens, with first-pass and after-rework yield side by side.', mess:'The report only shows after-rework yield. First-pass is 91%, and they tell you so.', fake:'The report was printed this morning. The AOI screen runs a different program from the one in the record.' },
   thu:'A different AOI program is loaded and the paste log has three missed entries. The green number is the same.' },
 { id:'molding', name:'Molding shop', sub:'subcontractor', ch:'Ch. 5', role:'the molding supervisor', gate:'sub',
   claim:'"Your tool is safe with our partner. That is their business."',
   good:'Presses running, and your tool carries your ownership plate on the base.',
   bad:'Presses are idle, and a tool with no ownership plate sits on the floor next to a part with flash.',
   drill:'Shot counter vs the maintenance log', what:'The shot-count record',
   d:{ solid:'The counter reads 41,200 and the log shows the last clean at 40,000.', mess:'The counter is well past the last logged maintenance. They admit it is overdue.', fake:'The log shows a perfect clean every 10,000 shots in one handwriting. The counter says otherwise.' },
   thu:'The tool is on the floor again, 30,000 shots have run since your visit, and no maintenance was done.' },
 { id:'battery', name:'Battery pack line', ch:'Ch. 6', role:'the pack-line lead', gate:null,
   claim:'"Cells come from approved suppliers only. Safe, always."',
   good:'A steel charging rack, extinguishers at the door, a sensor logging the aging room.',
   bad:'Aging racks are crowded, labels are peeling, and cells are stacked past the rack\'s marking.',
   drill:'Aging-rack census vs the records', what:'The aging record',
   d:{ solid:'The rack census matches the record, down to the cell lot.', mess:'Two racks are not in the record. They explain, and re-log them in front of you.', fake:'The record shows every rack aged 24 hours. Two racks were loaded this morning.' },
   thu:'The aging room is "being renovated" and the door is padlocked. The racks you saw are not there.' },
 { id:'assembly', name:'Assembly lines', ch:'Ch. 7–9', role:'a line supervisor', gate:null,
   claim:'"Every operator is trained. Every station has an instruction."',
   good:'Operators work in a steady rhythm, instructions are at each station, and WIP stays low.',
   bad:'WIP piles up before one station, and operators follow memory, not the sheets.',
   drill:'Skill matrix vs the people at the station', what:'The skill matrix',
   d:{ solid:'The two operators you pick match the matrix, hire dates and certifications included.', mess:'Half the operators at the station joined last month. The matrix does not say so, but they do.', fake:'Training records were signed in one pen on one date for six months of sessions.' },
   thu:'There is no instruction at the station, and new operators learn from their neighbour.' },
 { id:'test', name:'Test stations', ch:'Ch. 10', role:'the test engineer', gate:null,
   claim:'"Every unit is tested at 100% coverage."',
   good:'Racks of fixtures run in sequence, and a screen shows a 99.6% pass rate.',
   bad:'A fixture cable is held with tape, and the retest counter is high.',
   drill:'Fixture log, golden-unit trend and a known-bad unit', what:'The fixture log',
   d:{ solid:'The known-bad unit is caught at once, and the golden trend has a visible dip with a note beside it.', mess:'The known-bad unit passes the first time and fails on the retest. The counter is high, but honest.', fake:'The golden-unit trend is a perfectly flat line, and the known-bad unit never reaches the station.' },
   thu:'The retest counter has been reset to zero and the program version changed on Monday.' },
 { id:'quality', name:'Quality office', ch:'Ch. 11', role:'the quality manager', gate:null, driller:'records', talker:'qm',
   claim:'"We have the full ISO system. CAPA closes every root cause."',
   good:'Certificate plaques in the lobby, a tidy office, binders in a row.',
   bad:'A small office, a whiteboard of open 8Ds, and a stack of unsigned holds.',
   drill:'Walk one CAPA from the 8D to the station', what:'The CAPA record',
   d:{ solid:'The 8D names a root cause (a fixture wear limit), and the station has the fix.', mess:'The 8D says "operator retrained" and the fix is not at the station. They know it and say so.', fake:'The 8D is dated yesterday for a problem from March, and the fix photo is from a different station.' },
   thu:'The hold register is empty again at month-end, and the quality manager is "travelling".' },
 { id:'packing', name:'Packing & finished goods', ch:'Ch. 12', role:'the shipping lead', gate:'flow',
   claim:'"Scan gates on every box. Nothing leaves unchecked."',
   good:'Clean packing stations, scan gates, and a labelled finished-goods area.',
   bad:'Pallets sit in the aisle for weeks, and older stock is stacked behind the new.',
   drill:'Serial-to-shipment drill', what:'The shipment record',
   d:{ solid:'A serial from last month is found in seconds, to the pallet.', mess:'The serial takes forty minutes. The pallet is in the aisle, and they say so.', fake:'The serial is found instantly, but the ship date is a Sunday and the carton label is from a later revision.' },
   thu:'The pre-ship staging area is empty, and two label versions are on the shelf.' }
];
var BYID = {}; AREAS.forEach(function (a) { BYID[a.id] = a; });

var GEN = {
  paper:  function (a) { return a.what + ' exists, but it is filled in in blocks and nobody on the floor consults it. It took an hour to find.'; },
  staged: function (a) { return a.what + ' is immaculate and instantly at hand. The binder tabs are still stiff. Someone prepared this last night.'; },
  solid:  function (a) { return a.what + ' is current to this morning, with a coffee ring on the page. ' + a.d.solid; },
  mess:   function (a) { return a.what + ' is behind. It is messy, but nothing has been rewritten to impress you. ' + a.d.mess; },
  fake:   function (a) { return a.what + ' is complete for months, and contradicts what you can see. ' + a.d.fake; }
};
var LATENCY = { solid:'sec', mess:'sec', staged:'sec', paper:'hr', fake:'mt' };
var LATLABEL = { sec:'Answered in seconds', hr:'Took an hour', mt:'Needed a meeting' };
var TALK = {
  solid:  'tells you the last thing they rejected, who signed it, and what happened at month-end. There is detail, and a small complaint.',
  paper:  'describes the procedure fluently. Asked for the last exception, they have to think. No example comes.',
  staged: 'answers in a polished loop. Your escort\'s translation of a long answer is one short sentence.',
  mess:   'is frank about what is broken and what they have asked for. Nobody has listened yet.',
  fake:   'glances at the escort before every answer. The translation delay is longer than the sentence deserved.'
};
var THU_GEN = { solid:'Exactly as on your first visit. The discipline is still there on a random Thursday.', paper:'Same as before: the records exist, and nobody uses them.', mess:'Same mess, same honesty. What you saw was the real state.', fake:'The paperwork is still immaculate, and still in the same pen.' };

var NAMES = ['Lianxing Precision', 'Rui Tai Electronics', 'Dongyue Smart Manufacturing', 'Meijie Technology', 'Hongcheng Electronics', 'Yuanda Intelligent'];
// archetypes: area states, desk-phase findings, truth
var ARCH = [
 { key:'showcase', verdict:'decline', red:'falsified',
   why:'A showcase factory. Great lobby, staged areas, and falsified quality records. A factory that falsifies small things under audit will falsify large things under production pressure.',
   st:{ dock:'paper', warehouse:'mess', smt:'staged', molding:'paper', battery:'staged', assembly:'staged', test:'staged', quality:'fake', packing:'paper' },
   desk:{ entity:['The operating company and the quoting company are different names, but a disclosed group structure. Fine.','ok'], fin:['Credit signals look normal. They want 40% upfront, which is common.','ok'], refs:['Only references the factory nominated. Everyone confirms they are good. Nobody has a recovery story.','warn'] },
   friction:{ records:'"Those records are confidential."', qm:'Every conversation with the account manager present.', live:'"The changeover schedule is not fixed that week."', flow:'Annotated: all areas ready.', sub:'Annotated: "our partner site is arranged".' } },
 { key:'modest', verdict:'conditions', red:null,
   why:'A modest, honest factory. Plain building, real systems, and a couple of untidy areas that need contract conditions. A modest factory whose Thursday matches its showcase is a good marriage.',
   st:{ dock:'solid', warehouse:'mess', smt:'solid', molding:'solid', battery:'solid', assembly:'solid', test:'solid', quality:'paper', packing:'mess' },
   desk:{ entity:['A holding company in front of the operating factory, disclosed and understood.','ok'], fin:['Pays its suppliers in 60 days. Utilisation is high.','ok'], refs:['Two customers you found yourself. Both tell a real recovery story: a quality escape, disclosed early, contained.','ok'] },
   friction:{ flow:'Annotated: all areas available.', records:'Annotated: five documents arranged.', qm:'Annotated: the quality manager is free on Tuesday.', live:'Annotated: changeover on Tuesday morning.', sub:'Annotated: molder visit arranged.' } },
 { key:'spiky', verdict:'conditions', red:null,
   why:'A spiky factory: excellent SMT and test, chaotic warehouse and shipping. Honest, but the unglamorous areas predict Part Three better than the showcase does. Proceed, with conditions written into the contract.',
   st:{ dock:'paper', warehouse:'mess', smt:'solid', molding:'paper', battery:'solid', assembly:'paper', test:'solid', quality:'paper', packing:'mess' },
   desk:{ entity:['A single entity, assets on the balance sheet, no pledges.','ok'], fin:['Slightly slow payer to distributors (90 days), but stable.','ok'], refs:['One reference is glowing. One says shipping labels were wrong twice and they fixed it.','ok'] },
   friction:{ flow:'"The warehouse is being reorganised."', records:'Annotated: five documents arranged.', qm:'Annotated.', live:'Annotated: changeover Tuesday.', sub:'Annotated.' } },
 { key:'hollow', verdict:'decline', red:null,
   why:'A hollow factory. Half the building is dark, suppliers are paid in 120 days, and the systems exist only on paper. Your tooling would sit behind a bankruptcy administrator\'s fence.',
   st:{ dock:'paper', warehouse:'paper', smt:'paper', molding:'paper', battery:'mess', assembly:'mess', test:'paper', quality:'paper', packing:'mess' },
   desk:{ entity:['Entity is three years old; the factory claims fifteen years of heritage. There may be a story.','warn'], fin:['A supplier is suing for unpaid invoices. They ask for 70% upfront. Distributors say they pay in 120 days.','bad'], refs:['Two customers, both long gone. Nobody picks up.','warn'] },
   friction:{ flow:'Annotated.', records:'Annotated.', qm:'Annotated.', live:'Annotated.', sub:'Annotated.' }, dark:true },
 { key:'closed', verdict:'decline', red:'sub',
   why:'A closed-door factory. The building is good, but the CM will not disclose or open its subcontractors. That is a control position over your visibility into where your product is made.',
   st:{ dock:'solid', warehouse:'paper', smt:'solid', molding:'closed', battery:'solid', assembly:'solid', test:'solid', quality:'solid', packing:'paper' },
   desk:{ entity:['A clean group structure, disclosed.','ok'], fin:['Strong. Pays suppliers in 45 days.','ok'], refs:['Good references. One mentions "we never saw the molder".','warn'] },
   friction:{ flow:'Annotated.', records:'Annotated.', qm:'Annotated.', live:'Annotated.', sub:'"Our suppliers are our business."' } }
];

var DEMANDS = [
 { id:'flow', name:'Walk every area, in flow order', sub:'Opens the warehouse and shipping, which the tour usually skips.' },
 { id:'records', name:'The five quality records, on request', sub:'Needed to run the CAPA drill in the quality office.' },
 { id:'qm', name:'The quality manager, without sales', sub:'Lets you talk to the quality manager alone.' },
 { id:'live', name:'A live changeover and a timed traceability drill', sub:'Needed for the SMT yield check and for pulling a thread.' },
 { id:'sub', name:'Disclose every subcontractor and arrange visits', sub:'Needed to visit the molder, who holds your tool.' }
];
var DESK = [
 { id:'entity', name:'The entity', sub:'Who owns the assets, who signs the contract, who holds your tooling.' },
 { id:'fin', name:'The finances', sub:'Credit signals, litigation, payment terms, utilisation.' },
 { id:'refs', name:'The references', sub:'Ask about the recovery story, not about how good they are.' }
];
var REDS = [
 { id:'falsified', name:'Falsified records, of any kind' },
 { id:'power', name:'Quality without power (holds never held, QM bonused on shipments)' },
 { id:'sub', name:'Refusal of subcontractor disclosure or access' },
 { id:'refs', name:'Refusal of reference checks' },
 { id:'safety', name:'Battery or safety disqualifiers' },
 { id:'labour', name:'Child or forced labour, EHS floor violations' }
];

/* ---------- state ---------- */
var G = null;
var store = { get:function (k, d) { try { var v = localStorage.getItem('hhl.ch114.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set:function (k, v) { try { localStorage.setItem('hhl.ch114.' + k, JSON.stringify(v)); } catch (e) {} } };
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function fmt(n) { return Number(n).toLocaleString('en'); }
function el(h) { $app.innerHTML = h; window.scrollTo(0, 0); }

function newGame() {
  var arch = pick(ARCH);
  G = { arch:arch, name:pick(NAMES), hours:DAYS * HOURS_PER_DAY, used:0, day:1, today:0, desk:[], agenda:[], seen:{}, notes:[], thu:0, thuDone:{},
        rating:{}, reds:{}, verdict:null, area:null, threads:0, phase:'title' };
  AREAS.forEach(function (a) { G.seen[a.id] = { walk:false, drill:false, talk:false, thu:false }; });
}
function state(a) { var s = G.arch.st[a.id]; return s === 'closed' ? 'closed' : s; }
function unlocked(a) {
  if (a.gate === 'flow') return G.agenda.indexOf('flow') >= 0;
  if (a.gate === 'sub') return G.agenda.indexOf('sub') >= 0;
  return true;
}
function canDrill(a) { return !a.driller || G.agenda.indexOf(a.driller) >= 0; }
function canTalk(a) { return !a.talker || G.agenda.indexOf(a.talker) >= 0; }
function spend(h) { G.used += h; G.today += h; }
function left() { return G.hours - G.used; }
function addNote(area, kind, text, lat) { G.notes.push({ area:area, kind:kind, text:text, lat:lat || null }); }

/* ---------- screens ---------- */
function screenTitle() {
  G.phase = 'title';
  el('<div class="top"><a class="back" href="../">← Games</a></div>' +
   '<div class="card"><h3>Chapter 14 · The Hardest Factory Lessons</h3><h1>The <span>Audit</span></h1>' +

  var stampTxt = arch.verdict === G.verdict ? 'RIGHT CALL' : (stamp === 'fail' ? (arch.verdict === 'decline' ? 'WRONG CALL' : 'LOST A GOOD ONE') : 'CLOSE');
  var truth = AREAS.map(function (a) { var st = state(a), r = G.rating[a.id];
    var T = { solid:'Real', paper:'Records exist, nobody uses them', staged:'Staged: hollow behind the showcase', mess:'Messy but honest', fake:'Falsified records', closed:'Refused access to the molder' }[st];
    var tag = st === 'staged' ? (G.seen[a.id].thu ? ' (you caught it on Thursday)' : G.thu ? '' : ' (only a second visit would show it)') : '';
    return '<div class="reveal"><b>' + a.name + ' · ' + T + '</b><span class="small">You: ' + RATINGS.filter(function (x) { return x[0] === r; })[0][1] + (G.seen[a.id].drill ? '' : ', no drill') + tag + '</span></div>'; }).join('');
  var missed = '';
  if (arch.red === 'sub' && G.agenda.indexOf('sub') < 0) missed = '<div class="note bad"><b>What you missed</b>You never asked for subcontractor disclosure, so the refusal never surfaced. The factory was hiding where your tool would live. Ask in the agenda.</div>';
  if (arch.key === 'hollow' && G.desk.indexOf('fin') < 0) missed = '<div class="note bad"><b>What you missed</b>The finances were the story: a supplier suing for unpaid invoices and 120-day payment terms. Desk work disqualifies more candidates than site visits do.</div>';
  el('<div class="card"><h3>Report submitted</h3><div class="stamp ' + stamp + '">' + stampTxt + '</div><div class="big">' + fmt(sc.total) + '</div>' +
   (nb ? '<p style="text-align:center;color:var(--acc);font-weight:800">New best!</p>' : '<p class="small" style="text-align:center">Best ' + fmt(Math.max(best, sc.total)) + '</p>') +
   '<div class="lines">' + sc.rows.map(function (r) { return '<div><span>' + r[0] + '</span><em class="' + (r[1] >= 0 ? 'pos' : 'neg') + '">' + (r[1] >= 0 ? '+' : '') + r[1] + '</em></div>'; }).join('') + '</div>' +
   '<div class="lesson"><b>What this factory was.</b> ' + arch.why + '</div>' + missed +
   '<h3>What was really there</h3>' + truth +
   HHL.next(114) +
   '<div class="row"><button class="btn" data-a="again">Audit another</button><button class="btn ghost" data-a="menu">Menu</button></div></div>');
}

});
