<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Critical Path">
<meta name="theme-color" content="#14181c">
<title>Critical Path</title>
<style>
:root{
  --bg:#14181c; --ink:#eef2f4; --muted:#93a1ab; --panel:#1d2329; --rule:#2d363e;
  --acc:#3ddc84; --red:#ff5a4e; --amber:#f5c518;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.hudbtns{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);display:flex;gap:6px;z-index:5}
.hudbtns[hidden]{display:none}
.hudbtns button{width:44px;height:44px;border-radius:12px;border:1px solid var(--rule);background:rgba(29,35,41,.85);color:var(--ink);font:600 16px/1 var(--font);display:grid;place-items:center;padding:0;transition:transform .08s}
.hudbtns button:active{transform:scale(.88)}
#ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px);background:rgba(10,13,16,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow-y:auto;touch-action:pan-y}
#ov[hidden]{display:none}
.card{width:min(440px,100%);background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:22px 20px 20px;display:grid;gap:14px;animation:pop .32s cubic-bezier(.2,1.4,.4,1) both;margin:auto}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
.card h1{margin:0;font-size:36px;line-height:1.02;letter-spacing:-.01em;font-weight:800}
.card h1 span{color:var(--acc)}
.card h2{margin:0;font-size:23px;font-weight:800;line-height:1.15}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.card p b{color:var(--ink);font-weight:600}
.card p i{color:var(--ink)}
.card a{color:var(--acc)}
.eyebrow{font:700 11px/1.3 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:calc(env(safe-area-inset-left,0px) + 8px);z-index:11;color:var(--muted)!important;text-decoration:none;font:600 14px/1 var(--font);padding:15px 10px;min-height:44px}
.preview{width:100%;height:auto;border-radius:10px;background:#161b20;display:block}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 18px;min-height:50px;font:800 17px/1 var(--font);background:var(--acc);color:#0f1a14;width:100%;transition:transform .08s,filter .08s}
.btn:active{transform:scale(.96);filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:700}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.small{font-size:12.5px!important}
.stamp{justify-self:center;font:900 30px/1 var(--font);letter-spacing:.06em;padding:8px 16px;border:4px solid currentColor;border-radius:8px;transform:rotate(-6deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) .12s both}
.stamp.pass{color:var(--acc)} .stamp.fail{color:var(--red)}
@keyframes stamp{0%{transform:scale(2.6) rotate(-14deg);opacity:0}60%{transform:scale(.9) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#161b20;border-radius:10px;padding:10px 8px;text-align:center;display:grid;gap:3px}
.stat b{font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lesson{border-left:3px solid var(--acc);padding:6px 0 6px 12px;font-size:14px!important;color:var(--ink)!important}
.lesson.warn{border-color:var(--red)}
.big{font:900 46px/1 var(--font);font-variant-numeric:tabular-nums;text-align:center}
.newbest{color:var(--acc);text-align:center;font-weight:800;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.weeks div{background:#161b20;border-radius:8px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted);line-height:1.25}
.weeks div.on{background:#173826;color:var(--acc);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
#ov{padding-top:calc(env(safe-area-inset-top,0px) + 48px) !important}
</style>
</head>
<body>
<canvas id="game"></canvas>

</div>

<script src="../hhl.js?v=10"></script>
<script>
'use strict';
(function () {
// ---------- utilities ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('hhl.ch3.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hhl.ch3.' + k, JSON.stringify(v)); } catch (e) {} }
};
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pickOne = a => a[(Math.random() * a.length) | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const FONT = '-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif';
const F = (w, s) => w + ' ' + s + 'px ' + FONT;
const $ = id => document.getElementById(id);
const BG = '#14181c', PANEL = '#1d2329', RULE = '#2d363e', INK = '#eef2f4', MUTED = '#93a1ab';
const ACC = '#3ddc84', RED = '#ff5a4e', AMBER = '#f5c518';
const fmtK = e => e >= 1e6 ? '€' + (e / 1e6).toFixed(1).replace('.0', '') + 'm' : '€' + Math.round(e / 1000) + 'k';

// ---------- crash guard ----------
let crashed = false;
function crash(msg) {
  if (crashed) return; crashed = true;
  try {
    const ov = $('ov'); ov.hidden = false;
    ov.innerHTML = '<div class="card"><div class="eyebrow">Programme halted</div><h2>Something went wrong</h2><p class="small">' +
      String(msg).replace(/[<>&]/g, '') + '</p><button class="btn" onclick="location.reload()">Restart</button></div>';
  } catch (e) {}
}
window.addEventListener('error', e => crash(e.message || 'Unknown error'));
window.addEventListener('unhandledrejection', e => crash((e.reason && e.reason.message) || 'Unknown error'));

// ---------- sound ----------
const Sfx = {
  ctx: null, master: null, noiseBuf: null, muted: store.get('muted', false),
  unlock() {
    try {
      if (!this.ctx) {

        this.ctx = new AC();
        this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.5;
        this.master.connect(this.ctx.destination);
        const len = Math.floor(this.ctx.sampleRate * 0.5);
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const s = this.ctx.createBufferSource(); s.buffer = this.ctx.createBuffer(1, 1, 22050); s.connect(this.ctx.destination); s.start(0);
      }
      if (this.ctx.state !== 'running') this.ctx.resume();
    } catch (e) {}
  },
  setMuted(m) { this.muted = m; store.set('muted', m); try { if (this.master) this.master.gain.value = m ? 0 : 0.5; } catch (e) {} },
  ok() { return this.ctx && !this.muted && this.ctx.state === 'running'; },
  tone(f, dur, type, vol, slide, delay) {
    if (!this.ok()) return;
    try {

      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  },
  noise(dur, vol, freq, delay) {
    if (!this.ok()) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
      const g = this.ctx.createGain(); g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.03);
    } catch (e) {}
  },
  click() { this.tone(900, 0.04, 'square', 0.05); },
  place(n) { const f = 392 * Math.pow(2, (n * 3) / 12); this.tone(f, 0.1, 'triangle', 0.13); this.tone(f * 2, 0.06, 'sine', 0.05, null, 0.04); this.noise(0.04, 0.1, 3000); },
  unplace() { this.tone(520, 0.1, 'triangle', 0.1, 300); },
  flag() { this.tone(330, 0.09, 'square', 0.08); this.tone(660, 0.08, 'triangle', 0.08, null, 0.05); this.noise(0.05, 0.08, 2500); },
  unflag() { this.tone(260, 0.08, 'triangle', 0.08, 200); },
  mark(i) { const f = 523 * Math.pow(2, (i % 8) / 12); this.tone(f, 0.1, 'triangle', 0.12); this.tone(f * 1.5, 0.08, 'sine', 0.06, null, 0.04); },
  step(up) { this.tone(up ? 760 : 520, 0.05, 'square', 0.06); },
  stamp() { this.noise(0.14, 0.32, 500); this.tone(120, 0.18, 'sine', 0.3, 60); },
  good(i) { const f = 587 * Math.pow(2, Math.min(i, 14) / 12); this.tone(f, 0.1, 'triangle', 0.12); this.tone(f * 2, 0.07, 'sine', 0.05, null, 0.03); },
  quiet() { this.tone(1400, 0.025, 'sine', 0.03); },
  bad() { this.tone(170, 0.24, 'sawtooth', 0.13, 75); this.noise(0.1, 0.12, 700); },
  perfect() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.12, null, i * 0.06)); this.noise(0.3, 0.06, 6000, 0.3); },
  pip() { this.noise(0.45, 0.32, 900); this.tone(90, 0.5, 'sine', 0.32, 40); this.tone(240, 0.3, 'square', 0.07, 110, 0.05); },
  intro() { this.tone(330, 0.16, 'square', 0.09); this.tone(494, 0.26, 'square', 0.09, null, 0.14); },
  gate() { [392, 523, 659].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.12, null, i * 0.1)); },
  win() { [392, 523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, 0.28, 'triangle', 0.12, null, i * 0.11)); this.noise(0.5, 0.06, 6000, 0.7); },
  over() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.3, 'square', 0.09, null, i * 0.16)); },
  nope() { this.tone(200, 0.12, 'square', 0.07, 150); }
};

// ---------- canvas + layout ----------
const cvs = $('game'), ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;
const SAFE = { t: 0, r: 0, b: 0, l: 0 };
const L = {};
let layDirty = true, LAY = null;
function readSafe() {
  try {
    const cs = getComputedStyle($('safe'));
    SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.r = parseFloat(cs.paddingRight) || 0;
    SAFE.b = parseFloat(cs.paddingBottom) || 0; SAFE.l = parseFloat(cs.paddingLeft) || 0;
  } catch (e) {}
}
function resize() {
  readSafe();
  const vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth); H = Math.round(vv ? vv.height : window.innerHeight);
  if (W < 10 || H < 10) { W = window.innerWidth; H = window.innerHeight; }
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  L.hudTop = SAFE.t + 8; L.hudH = 62;
  L.contentTop = L.hudTop + L.hudH;
  layDirty = true;
}
let resizeTimer = 0;
function scheduleResize() { resize(); clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 250); }
window.addEventListener('resize', scheduleResize);
window.addEventListener('orientationchange', () => setTimeout(resize, 300));
if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);

// text wrapping (cached)
const wrapCache = new Map();
function wrap(text, maxW, font) {
  const key = font + '|' + Math.round(maxW) + '|' + text;
  const hit = wrapCache.get(key); if (hit) return hit;
  ctx.font = font;
  const words = String(text).split(' '), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (cur && ctx.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  if (wrapCache.size > 900) wrapCache.clear();
  wrapCache.set(key, lines);
  return lines;
}
function rr(c, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function lines(arr, x, y, lh, color, font, align) {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  for (let i = 0; i < arr.length; i++) ctx.fillText(arr[i], x, y + i * lh);
}

// ---------- chapter content ----------
const WEEKS = [
  { key: 'Week 1', name: 'Business Plan Alignment', doc: 'PRD' },
  { key: 'Week 2', name: 'Technical Requirements', doc: 'TRD' },
  { key: 'Week 3', name: 'Initial Planning', doc: 'Critical path' },
  { key: 'Week 4', name: 'Kickoff Meeting', doc: 'Plan and sign-off' }
];
const LV_DEFS = [
  { type: 'req', opts: 2, week: 0 },
  { type: 'req', opts: 3, week: 0 },
  { type: 'spec', rows: 6, issues: 2, week: 1 },
  { type: 'spec', rows: 7, issues: 3, tbd: true, week: 1 },
  { type: 'path', net: 'A', tri: 1, week: 2 },
  { type: 'path', net: 'B', tri: 2, week: 2 },
  { type: 'plan', week: 3 },
  { type: 'path', net: 'C', tri: 2, week: 3 }
];
const CATS = [
  { k: 'subj', label: 'SUBJECT + SHALL', name: 'Subject' },
  { k: 'perf', label: 'PERFORMANCE LEVEL', name: 'Performance' },
  { k: 'cond', label: 'CONDITION', name: 'Condition' },
  { k: 'test', label: 'TEST CRITERION', name: 'Test' }
];
const REQS = [
  { poor: 'The device shall have good battery life.',
    subj: [['The device shall'], ['The device should', '“Should” is a wish. A requirement says shall.']],
    perf: [['run at least 48 hours per charge'], ['have excellent battery life', '“Excellent” is a descriptor, not a number.'], ['last a long time per charge', '“A long time” cannot be measured.']],
    cond: [['at 10% active / 90% sleep, 25°C'], ['in normal everyday use', 'Whose normal? Name the duty cycle and temperature.'], ['at room temperature', '“Room temperature” is a descriptor. Give the number.']],
    test: [['verified by rundown test on 5 units'], ['to the customer’s satisfaction', 'No test can be designed for that.'], ['as agreed in design review', 'Two engineers will agree on two different things.']] },
  { poor: 'The display shall be easy to read.',
    subj: [['The display shall'], ['The display will', '“Will” is a forecast, not a commitment.']],
    perf: [['be legible up to 60° off-axis'], ['be easy to read', 'An aspiration. Nobody can test “easy”.'], ['be clear at wide angles', '“Wide” is not a number.']],
    cond: [['under ambient light up to 10,000 lux'], ['in most lighting', '“Most lighting” is not a test condition.'], ['outdoors on a bright day', 'How bright? Give the lux.']],
    test: [['checked by a viewing panel in a light booth'], ['as judged by the design team', 'The designers are not the test.'], ['confirmed in the investor demo', 'A demo is not a test criterion.']] },
  { poor: 'The device shall connect to the app quickly.',
    subj: [['The device shall'], ['The device may', '“May” makes it optional.']],
    perf: [['connect over BLE within 3 s in 95% of tries'], ['connect to the app quickly', '“Quickly” means something different to every engineer.'], ['connect without noticeable delay', 'Noticeable to whom? Give seconds.']],
    cond: [['after waking from sleep'], ['when the signal is good', '“Good signal” is undefined.'], ['under typical conditions', '“Typical” is not a condition.']],
    test: [['measured over 200 timed connection attempts'], ['verified in a demo', 'One demo proves nothing about 95%.'], ['if users do not complain', 'Complaints arrive after you ship.']] },
  { poor: 'The product shall be durable.',
    subj: [['The product shall'], ['The product should', '“Should” is a wish. A requirement says shall.']],
    perf: [['survive a 1.5 m drop with no loss of function'], ['be durable', 'An aspiration, not a requirement.'], ['survive normal drops', '“Normal” is not a height.']],
    cond: [['onto concrete, in any orientation'], ['if handled with reasonable care', 'Customers will not.'], ['onto typical floors', 'Name the surface.']],
    test: [['drop-tested on every face, then function-checked'], ['as reviewed by marketing', 'A review is not a test.'], ['on a best-effort basis', 'Best effort cannot pass or fail.']] },
  { poor: 'The product shall measure temperature.',
    subj: [['The product shall'], ['The product will', '“Will” is a forecast, not a commitment.']],
    perf: [['measure ambient temperature to ±0.5°C'], ['measure temperature accurately', '“Accurately” has no tolerance.'], ['give a sensible reading', 'Sensible is not a specification.']],
    cond: [['from −20°C to +70°C at 95% confidence'], ['in typical rooms', 'Kitchens, garages and lofts are all “rooms”.'], ['across normal conditions', '“Normal” is not a range.']],
    test: [['checked against a reference in a climate chamber'], ['compared with a phone weather app', 'That is not a calibrated reference.'], ['spot-checked by engineering', 'Spot checks are not a criterion.']] },
  { poor: 'The system shall be reliable.',
    subj: [['The system shall'], ['The system should', '“Should” is a wish. A requirement says shall.']],
    perf: [['achieve a field failure rate below 1%'], ['be reliable', 'An aspiration. It cannot be tested.'], ['rarely fail', '“Rarely” is not a rate.']],
    cond: [['in the first 12 months, whole installed base'], ['over its lifetime', 'An unbounded period cannot be measured.'], ['in normal use', 'Whose normal use?']],
    test: [['tracked monthly from field-return data'], ['if support tickets stay low', '“Low” is not a threshold.'], ['per engineering judgement', 'Judgement varies by engineer.']] }
];
const IFACES = [
  { id: 'IF-01', name: 'Sensor bus', a: 'Hardware', b: 'Firmware', rows: [
    ['Physical connector', '6-pin FPC, 0.5 mm pitch', '6-pin FPC, 1.0 mm pitch', 'Two connector pitches. The cable will not fit.'],
    ['Pin assignment', 'Pin 3 SDA, pin 4 SCL', 'Pin 3 SCL, pin 4 SDA', 'SDA and SCL swapped between the teams.'],
    ['Signal levels', '1.8 V logic', '3.3 V logic', '1.8 V on one side, 3.3 V on the other.'],
    ['Current drive', '4 mA max per pin', '20 mA per pin', 'Firmware expects five times the drive.'],
    ['Timing', 'I²C at 400 kHz', 'I²C at 1 MHz', 'The bus speeds do not match.'],
    ['Protocol', 'I²C, address 0x48', 'I²C, address 0x49', 'Firmware talks to the wrong address.'],
    ['Data format', '16-bit, little-endian', '16-bit, big-endian', 'Byte order differs. Every reading is garbage.'],
    ['Error handling', 'NACK: 3 retries, then fault', 'NACK: ignore, carry on', 'No agreed error handling.']] },
  { id: 'IF-07', name: 'Firmware to app data model', a: 'Firmware', b: 'UX / app', rows: [
    ['Data structures', 'State struct v2, 12 fields', 'State struct v1, 9 fields', 'Two versions of the data model.'],
    ['Event model', 'Push on change', 'App polls every 5 s', 'One side pushes, the other polls.'],
    ['Command interface', 'JSON over BLE GATT', 'Binary TLV over BLE GATT', 'Two command formats.'],
    ['Units', 'Temperature in 0.1°C', 'Temperature in °F', 'The units differ.'],
    ['Update rate', '1 Hz while app is open', '10 Hz while app is open', 'Update rates differ by ten times.'],
    ['Error states', 'Codes E01 to E12', 'Free-text messages', 'No shared error model.'],
    ['Battery level', 'Percent, 0 to 100', 'Millivolts', 'Percent on one side, millivolts on the other.']] },
  { id: 'IF-12', name: 'Enclosure to main PCB', a: 'Mechanical', b: 'Hardware', rows: [

// ---------- update ----------
function update(dt) {
  S.t += dt;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; if (p.rot != null) p.rot += (p.vr || 0) * dt;
  }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.life += dt; if (f.life >= f.max) floats.splice(i, 1); }
  shake *= Math.pow(0.0015, dt); if (shake < 0.2) shake = 0;
  flash = Math.max(0, flash - dt * 1.6);
  S.scorePunch = Math.max(0, S.scorePunch - dt * 4);
  S.shownScore += (S.score - S.shownScore) * Math.min(1, dt * 8); if (Math.abs(S.score - S.shownScore) < 0.5) S.shownScore = S.score;
  for (let i = 0; i < 3; i++) S.confBreak[i] = Math.max(0, S.confBreak[i] - dt * 1.5);
  if (S.press) { S.press.t += dt; if (S.press.t > 0.25) S.press = null; }

  if (S.mode === 'intro') { S.introT += dt; S.slideT += dt; if (S.introT >= INTRO) S.mode = 'play'; }
  else if (S.mode === 'play') { S.slideT += dt; updLevel(dt); }
  else if (S.mode === 'out') { S.outT += dt; if (S.outT >= 0.3) proceed(); }
}
function updLevel(dt) {
  const lv = S.lv; if (!lv) return;
  lv.wob = Math.max(0, lv.wob - dt * 3);
  if (lv.type === 'req') lv.chips.forEach((ch, i) => {
    if (ch.anim) {
      ch.anim.t += dt / 0.3;
      if (ch.anim.t >= 1) {
        if (ch.anim.land && ch.placed && LAY) { ch.sq = 1; const r = toScreen(slotInner(ch.cat)); burst(r.x + r.w / 2, r.y + r.h / 2, [ACC, '#ffffff'], 8, 160); }
        ch.anim = null;
      }
    }
    ch.sq = Math.max(0, ch.sq - dt * 4);
  });
  if (lv.anim) for (let i = 0; i < lv.anim.length; i++) lv.anim[i] = Math.max(0, lv.anim[i] - dt * 4);
  if (lv.type === 'plan') lv.phases.forEach(p => { p.disp += (p.val - p.disp) * Math.min(1, dt * 12); p.punch = p.punch > 0 ? Math.max(0, p.punch - dt * 4) : Math.min(0, p.punch + dt * 4); });
  if (lv.stage === 'reveal') {
    lv.revT += dt;
    while (lv.revI < lv.res.length) {
      const it = lv.res[lv.revI], step = it.quiet ? 0.1 : 0.24;
      if (lv.revT < step) break;
      lv.revT -= step; revealItem(it, lv.revI); lv.revI++;
    }
    if (lv.revI >= lv.res.length && lv.revT > 0.45) {
      if (lv.type === 'path' && lv.tri.length) { lv.stage = 'triage'; lv.triI = 0; lv.triFb = null; Sfx.intro(); }
      else finalize();
    }
  } else if (lv.stage === 'triage' && lv.triFb) {
    lv.triFb.t += dt;
    if (lv.triFb.t > 2.3) { lv.triFb = null; lv.triI++; if (lv.triI >= lv.tri.length) finalize(); else Sfx.intro(); }
  }
}

function drawParticles() {
