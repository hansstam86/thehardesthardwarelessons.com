<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Three Plates">
<meta name="theme-color" content="#14181c">
<title>Three Plates</title>
<style>
:root{
  --bg:#14181c; --ink:#eef2f4; --muted:#93a1ab; --panel:#1d2329; --rule:#2d363e;
  --acc:#b388ff; --red:#ff5a4e; --green:#3ddc84;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.hudbtns{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);display:flex;gap:6px;z-index:5}
.hudbtns button{width:44px;height:44px;border-radius:12px;border:1px solid var(--rule);background:rgba(29,35,41,.85);color:var(--ink);font:600 16px/1 var(--font);display:grid;place-items:center;padding:0;transition:transform .08s}
.hudbtns button:active{transform:scale(.88)}
#back{position:fixed;z-index:12;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 12px);color:var(--muted);text-decoration:none;font:700 14px/1 var(--font);padding:12px 10px;border-radius:10px;background:rgba(29,35,41,.7)}
#back:active{transform:scale(.94)}
#ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 58px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px);background:rgba(10,13,16,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow-y:auto;touch-action:pan-y}
#ov[hidden]{display:none}
.card{width:min(460px,100%);background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:22px 20px 20px;display:grid;gap:13px;animation:pop .32s cubic-bezier(.2,1.4,.4,1) both;margin:auto}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
.card h1{margin:0;font-size:36px;line-height:1.02;letter-spacing:-.01em;font-weight:800}
.card h1 span{color:var(--acc)}
.card h2{margin:0;font-size:23px;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.card p b{color:var(--ink);font-weight:600}
.card a{color:var(--acc)}
.eyebrow{font:700 11px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.from{font-size:13px!important;font-style:italic}
.preview{width:100%;height:auto;border-radius:12px;background:#161b20}
.btn{appearance:none;border:0;border-radius:14px;padding:16px 18px;min-height:50px;font:800 17px/1 var(--font);background:var(--acc);color:#15121c;width:100%;transition:transform .08s,filter .08s}
.btn:active{transform:scale(.96);filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:700}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.small{font-size:12.5px!important}
.stamp{justify-self:center;font:900 28px/1 var(--font);letter-spacing:.06em;padding:8px 16px;border:4px solid currentColor;border-radius:8px;transform:rotate(-6deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) .12s both}
.stamp.pass{color:var(--green)} .stamp.fail{color:var(--red)} .stamp.warn{color:#ffb86b}
@keyframes stamp{0%{transform:scale(2.6) rotate(-14deg);opacity:0}60%{transform:scale(.9) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#161b20;border-radius:10px;padding:10px 8px;text-align:center;display:grid;gap:3px}
.stat b{font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lesson{border-left:3px solid var(--acc);padding:6px 0 6px 12px;font-size:14px!important;color:var(--ink)!important}
.picks{display:grid;gap:8px}
.pick{appearance:none;text-align:left;border:1px solid var(--rule);background:#161b20;color:var(--ink);border-radius:12px;padding:12px 14px;min-height:54px;display:grid;gap:4px;transition:transform .08s,border-color .15s;font-family:var(--font)}
.pick:active{transform:scale(.97);border-color:var(--acc)}
.pick b{font-size:16px}
.pick span{font-size:13px;color:var(--muted);line-height:1.35}
.crit{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.crit div{background:#1d2329;border-radius:6px;padding:5px 2px;text-align:center;font-size:9.5px;color:var(--muted);line-height:1.25}
.crit div i{display:block;font-style:normal;color:var(--acc);font-size:11px;letter-spacing:-1px}
.crit div.lo i{color:#ff8a80}
.ck{display:grid;gap:3px;font-size:12.5px;line-height:1.3}
.ck h4{margin:6px 0 2px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ck div{display:grid;grid-template-columns:18px 1fr;gap:6px;color:#c8d2d9;animation:pop .3s ease-out both}
.ck div.y b{color:var(--green)} .ck div.n b{color:var(--red)} .ck div.q b{color:var(--muted)}
.lines{display:grid;gap:4px;font-size:13px}
.lines div{display:flex;justify-content:space-between;gap:10px;color:#c8d2d9;border-bottom:1px solid #252c33;padding:3px 0}
.lines div em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700}
.lines .plus em{color:var(--green)} .lines .minus em{color:var(--red)}
.blame{display:grid;gap:5px;font-size:12.5px;color:#ffb3ad;line-height:1.35}
.blame div{background:#221a1d;border-radius:8px;padding:7px 10px}
.blame div b{color:var(--ink)}
.big{font:900 46px/1 var(--font);font-variant-numeric:tabular-nums;text-align:center}
.newbest{color:var(--acc);text-align:center;font-weight:800;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.hudbtns[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<a id="back" href="../">← Games</a>
<div class="hudbtns" id="hudbtns" hidden>
  <button id="btnMute" aria-label="Sound on or off">♪</button>
  <button id="btnPause" aria-label="Pause">❚❚</button>
</div>
<div id="ov"></div>

<script src="../hhl.js?v=5"></script>
<script>
'use strict';
(function () {
// ---------- utilities ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('hhl.ch2.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hhl.ch2.' + k, JSON.stringify(v)); } catch (e) {} }
};
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const FONT = '-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif';
const ACC = '#b388ff';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
const eur = k => '€' + Math.round(k).toLocaleString('en') + 'k';

// ---------- crash guard ----------
let crashed = false;
function crash(msg) {
  if (crashed) return; crashed = true;
  try {
    const ov = $('ov'); ov.hidden = false;
    ov.innerHTML = '<div class="card"><div class="eyebrow">Bench fire</div><h2>Something went wrong</h2><p class="small">' +
      String(msg).replace(/[<>&]/g, '') + '</p><button class="btn" onclick="location.reload()">Restart</button></div>';
  } catch (e) {}
}
window.addEventListener('error', e => crash(e.message || 'Unknown error'));
window.addEventListener('unhandledrejection', e => crash((e.reason && e.reason.message) || 'Unknown error'));

// ---------- sound ----------
const Sfx = {
  ctx: null, master: null, noiseBuf: null, muted: store.get('muted', false),
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.5;
        this.master.connect(this.ctx.destination);
        const len = Math.floor(this.ctx.sampleRate * 0.6);
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const s = this.ctx.createBufferSource(); s.buffer = this.ctx.createBuffer(1, 1, 22050); s.connect(this.ctx.destination); s.start(0);
      }
      if (this.ctx.state !== 'running') this.ctx.resume();
    } catch (e) {}
  },
  setMuted(m) { this.muted = m; store.set('muted', m); try { if (this.master) this.master.gain.value = m ? 0 : 0.5; } catch (e) {} },
  ok() { return this.ctx && !this.muted && this.ctx.state === 'running'; },
  tone(f, dur, type, vol, slide, delay) {
    if (!this.ok()) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  },
  noise(dur, vol, freq, delay) {
    if (!this.ok()) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
      const g = this.ctx.createGain(); g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.03);
    } catch (e) {}
  },
  spin(s) { this.tone(260 + s * 300, 0.14, 'triangle', 0.1, 620 + s * 600); this.noise(0.09, 0.07, 3200); },
  waste() { this.tone(320, 0.1, 'square', 0.05, 240); },
  retire() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.16, 'triangle', 0.12, null, i * 0.05)); this.noise(0.18, 0.05, 6000, 0.18); },
  trap() { this.noise(0.4, 0.1, 2600); this.noise(0.3, 0.07, 3200, 0.12); this.tone(196, 0.45, 'sine', 0.09, 147, 0.2); },
  miss() { this.tone(392, 0.28, 'sawtooth', 0.1, 165); },
  stall() { this.noise(0.55, 0.4, 1400); this.tone(130, 0.45, 'sine', 0.32, 45); this.tone(1700, 0.22, 'triangle', 0.07, 600, 0.04); },
  warn() { this.tone(880, 0.06, 'square', 0.05); this.tone(660, 0.08, 'square', 0.05, null, 0.08); },
  clashOk() { this.tone(587, 0.12, 'triangle', 0.11); this.tone(880, 0.2, 'triangle', 0.11, null, 0.08); },
  clashBad() { this.tone(110, 0.4, 'sawtooth', 0.13, 70); this.noise(0.2, 0.1, 500); },
  rip() { this.noise(0.14, 0.22, 5200); this.tone(520, 0.07, 'square', 0.05, 220); },
  build() { [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.24, 'square', 0.09, null, i * 0.09)); this.noise(0.5, 0.07, 6000, 0.45); },
  valid() { this.tone(784, 0.12, 'triangle', 0.12); this.tone(1175, 0.22, 'triangle', 0.12, null, 0.1); },
  alarm() { for (let i = 0; i < 3; i++) this.tone(740, 0.12, 'square', 0.09, 520, i * 0.18); },
  click() { this.tone(900, 0.04, 'square', 0.05); },
  phase() { this.tone(330, 0.18, 'square', 0.1); this.tone(494, 0.3, 'square', 0.1, null, 0.16); },
  gate() { [392, 523, 659].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.12, null, i * 0.1)); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.12, null, i * 0.1)); },
  over() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.3, 'square', 0.1, null, i * 0.16)); },
  tick() { this.tone(1200, 0.03, 'square', 0.04); }
};

// ---------- canvas + layout ----------
const cvs = $('game'), ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;
const SAFE = { t: 0, r: 0, b: 0, l: 0 };
const L = {};
function readSafe() {
  try {
    const cs = getComputedStyle($('safe'));
    SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.r = parseFloat(cs.paddingRight) || 0;
    SAFE.b = parseFloat(cs.paddingBottom) || 0; SAFE.l = parseFloat(cs.paddingLeft) || 0;
  } catch (e) {}
}
function resize() {
  readSafe();
  const vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth); H = Math.round(vv ? vv.height : window.innerHeight);
  if (W < 10 || H < 10) { W = window.innerWidth; H = window.innerHeight; }
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  L.hudTop = SAFE.t + 8; L.hudH = 56;
  L.ganttY = L.hudTop + L.hudH; L.ganttH = 12;
  L.regY = L.ganttY + L.ganttH + 10; L.regH = 24;
  L.btnH = clamp(H * 0.068, 46, 58);
  L.btnY = H - SAFE.b - 10 - L.btnH;
  L.barsH = 44; L.barsY = L.btnY - 8 - L.barsH;
  L.floorY = L.barsY - 6;
  L.areaTop = L.regY + L.regH + 8;
  const usableW = Math.min(W - SAFE.l - SAFE.r - 16, 620);
  L.left = (W - usableW) / 2;
  L.colW = usableW / 3;
  const avail = Math.max(80, L.floorY - L.areaTop);
  L.plateR = clamp(Math.min(L.colW * 0.42, avail * 0.16), 26, 62);
  L.plateY = L.areaTop + avail * 0.56;
  L.pillH = clamp(avail * 0.1, 36, 46);
  L.pillW = Math.min(L.colW - 8, 150);
}
let resizeTimer = 0;
function scheduleResize() { resize(); clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 250); }
window.addEventListener('resize', scheduleResize);
window.addEventListener('orientationchange', () => setTimeout(resize, 300));
if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);

// ---------- book data ----------
const SPW = 2.6;            // seconds of play per programme week
const BURN = 9;             // team burn, €k per week
const SPIN_COST = 1;        // €k per attention spent on a stream
const START_BUDGET = 760;   // €k prototyping budget
const WEEK_CAP = 52, P1_DEADLINE = 36;
const STREAMS = [
  { key: 'looks', name: 'Looks Like', short: 'LOOKS LIKE', col: '#ffb86b', q: 'Is the form factor right?', honest: 'Mech + mfg review', trap: 'Polish for investors',
    trapHow: 'Polished it for investors instead of a mech and mfg review' },
  { key: 'works', name: 'Works Like', short: 'WORKS LIKE', col: '#4fc3f7', q: 'Does the technology perform?', honest: 'Test worst case', trap: 'Test room temp',
    trapHow: 'Tested at the comfortable centre, not at the boundaries' },
  { key: 'feels', name: 'Feels Like', short: 'FEELS LIKE', col: '#ff80c0', q: 'Is the UX right?', honest: '5 real users', trap: 'Ask the team',
    trapHow: 'Asked the internal team instead of representative users' }
];
const RISK_POOL = [
  { s: 0, name: 'PCB may not fit the enclosure', cat: 'Manufacturing', cost: 60, item: 0 },
  { s: 0, name: 'Assembly needs special tools', cat: 'Manufacturing', cost: 35, item: 2 },
  { s: 0, name: 'Soft-touch finish may not mould', cat: 'Manufacturing', cost: 30, item: 3 },
  { s: 0, name: 'Logo placement blocks a vent', cat: 'Manufacturing', cost: 25, item: 4 },
  { s: 1, name: 'Wi-Fi range in a busy home', cat: 'Technical', cost: 45, item: 7 },
  { s: 1, name: 'Battery at 5 °C, half charged', cat: 'Technical', cost: 55, item: 8 },
  { s: 1, name: 'Thermal under sustained load', cat: 'Technical', cost: 50, item: 9 },
  { s: 1, name: 'Platform goes on allocation', cat: 'Supply Chain', cost: 70, item: 7, cond: p => p.sc <= 3 },
  { s: 1, name: 'Radio fails CE and FCC', cat: 'Regulatory', cost: 65, item: 7, cond: p => p.cert <= 3 },
  { s: 2, name: 'Users miss the power button', cat: 'User Experience', cost: 80, item: 12 },
  { s: 2, name: 'Onboarding loses new users', cat: 'User Experience', cost: 45, item: 11 },
  { s: 2, name: 'Error states confuse people', cat: 'User Experience', cost: 40, item: 13 }
];
const PLATFORMS = [
  { name: 'Newest AI SoC', tag: 'Fastest chip on the market. Launched last month. Thin docs.', fit: 5, sc: 2, eco: 2, up: 5, cert: 1 },
  { name: 'Proven Wi-Fi module', tag: 'Pre-certified module, big community, a bit less headroom.', fit: 3, sc: 4, eco: 5, up: 3, cert: 5 },
  { name: 'Last year\'s MCU', tag: 'Cheap, everywhere in stock, but a dead end for version 2.', fit: 3, sc: 5, eco: 3, up: 1, cert: 3 }
];
const CRIT = [['fit', 'Fit', 0.30], ['sc', 'Supply', 0.25], ['eco', 'Software', 0.20], ['up', 'Upgrade', 0.15], ['cert', 'Certs', 0.10]];
const weighted = p => CRIT.reduce((a, c) => a + p[c[0]] * c[2], 0);
const CLASHES = [
  { a: 0, b: 1, name: 'PCB vs enclosure' }, { a: 0, b: 1, name: 'Heat sink vs ID' },
  { a: 1, b: 2, name: 'Display size vs UI' }, { a: 0, b: 2, name: 'Button placement vs ID' }
];
const CREEP = ['NFC?', 'a camera?', 'voice control?', 'a 2nd colour?', 'an app store?', 'GPS?', 'a subscription?'];
const CHECK = [
  ['Form', 'Form factor fits all electronics with thermal clearance'],
  ['Form', 'External interfaces sized and placed for the target user'],
  ['Form', 'Assembly works without special tools or force'],
  ['Form', 'Surface finish fits the manufacturing process'],
  ['Form', 'Brand colour, texture and markings feasible in production'],
  ['Function', 'All functional requirements tested'],
  ['Function', 'Performance tested at the spec boundaries, not nominal'],
  ['Function', 'All key risks from the register tested and recorded'],
  ['Function', 'Battery life meets needs under realistic duty cycles'],
  ['Function', 'Thermal within limits under worst-case conditions'],
  ['Feel', 'User testing with representative users, not the team'],
  ['Feel', 'All primary use cases observed'],
  ['Feel', 'Critical usability issues addressed or have a path'],
  ['Feel', 'Error states tested with representative users'],
  ['Integration', 'Findings documented with severity and owners'],
  ['Integration', 'Critical findings have resolution paths before P2'],
  ['Integration', 'Functional definition updated after P1']
];
const LES = {
  platform: 'Score all five criteria out loud: functional fit, supply chain health, software ecosystem, upgrade path, certification history. The platform that solves today\'s problem can create tomorrow\'s.',
  def: 'Teams that skip the functional definition to move faster spend more time in prototyping, not less. Without it, every "can we just add" is an argument.',
  streams: 'Looks Like, Works Like and Feels Like are three simultaneous investigations, not three phases. Run them in parallel and their clashes show up early, while they are still cheap.',
  worst: 'Test the Works Like prototype at the boundaries of the operating envelope, not at its comfortable centre.',
  users: 'Five unprimed representative users are worth more than fifty rounds of internal team feedback.',
  looks: 'A Looks Like prototype polished for investors answers the marketing questions and leaves the engineering ones open.',
  p1: 'P1\'s job is to find problems, not to demonstrate success. A prototype that passes a demo is not ready for DFM handoff.',
  iter: 'The number of iterations is set by the quality of the P1 review. Confidence is not validation data.',
  dfm: 'The most damaging thing at a DFM handoff is optimism. Hidden risks do not go away. They move into a phase where they cost more.',
  money: 'Judge every prototype activity by its return on risk reduction. Spinning a plate that is already spinning is low-return spend.',
  final: '"Not the discipline of building an impressive prototype. The discipline of building an honest one."'
};

// ---------- state ----------
const S = {
  mode: 'title', paused: false, t: 0, best: store.get('best', 0), tutorial: !store.get('tutDone', false),
  round: 'streams', roundT: 0, roundLen: 0, introT: 0, week: 0, budget: START_BUDGET,
  score: 0, shownScore: 0, scorePunch: 0, plat: null, platIdx: -1, def: false,
  plates: [], risks: [], issues: [], tests: [null, null, null], clash: null, clashTimer: 0, noteTimer: 0,
  fixGap: [0, 0, 0], alloc: false, allocWeek: 14, gantt: [], hints: [], hintSeen: {}, review: '', p2review: '', handoff: '',

function update(dt) {

  for (const p of S.plates) { p.punch = Math.max(0, p.punch - dt * 4); p.ang += (1 + p.s * 12) * dt; }

  if (S.mode === 'intro') { S.introT += dt; if (S.introT > 1.6) { S.mode = 'play'; hint('spin', 'Tap a plate to keep it spinning', 'plate', 2); } return; }
  if (S.mode !== 'play') return;

  const streams = S.round === 'streams';

    p.driftT -= dt; if (p.driftT <= 0) { p.driftT = rand(1.5, 3.5); p.target = rand(0.75, 1.4); }
    p.drift += (p.target - p.drift) * Math.min(1, dt * 0.8);
    const avg = (S.plates[0].prog + S.plates[1].prog + S.plates[2].prog) / 3;

  [26, 36, 52].forEach(w => { ctx.fillRect(X(w) - 0.5, y - 2, 1, h + 4); });

function drawRegister() {

  if (!list.length) return;
  const x0 = SAFE.l + 12, x1 = W - SAFE.r - 12, y = L.regY + 4, h = L.regH - 4;
  ctx.fillStyle = '#7f8c96'; ctx.font = '800 9px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const label = S.round === 'streams' ? 'RISK REGISTER' : 'P1 FINDINGS';
  ctx.fillText(label, x0, y + h / 2);

  for (let k = 0; k < n; k++) {

    if (S.round === 'streams') {
      if (it.state === 'active') { stroke = STREAMS[it.s].col; txt = '#eef2f4'; }
      else if (it.state === 'retired') { fill = ACC; stroke = ACC; txt = '#15121c'; t = '✓'; }
      else if (it.state === 'hidden') { fill = '#2a1d22'; stroke = '#6b3a3a'; txt = '#ff8a80'; t = '?'; }
    } else if (it.fixed) { fill = ACC; stroke = ACC; txt = '#15121c'; t = '✓'; }

}
function drawButton() {

  ctx.save(); ctx.translate(b.x + b.w / 2, b.y + b.h / 2); ctx.scale(s, s);
  if (on && streams) { ctx.shadowColor = ACC; ctx.shadowBlur = 14 + Math.sin(S.t * 6) * 6; }
  ctx.fillStyle = on ? (streams ? ACC : '#2a2140') : '#20262d'; rr(ctx, -b.w / 2, -b.h / 2, b.w, b.h, 14); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = on ? ACC : '#2d363e'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    ctx.fillText(on ? 'BUILD P1' : 'BUILD P1 at 60% each', 0, -7);
    ctx.font = '700 10.5px ' + FONT;

  } else {

    ctx.fillStyle = '#eef2f4'; ctx.font = '900 16px ' + FONT;
    ctx.fillText('REVIEW ' + S.round + ' NOW', 0, -7);
    ctx.fillStyle = '#c8d2d9'; ctx.font = '700 10.5px ' + FONT;
    ctx.fillText(left + ' week' + (left === 1 ? '' : 's') + ' of build left', 0, 12);
    // progress of the round

}
function drawBanner() {

// ---------- main loop ----------
let last = performance.now();

resize();
showTitle();
requestAnimationFrame(frame);
})();
