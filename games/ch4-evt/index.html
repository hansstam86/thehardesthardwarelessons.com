<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="War Room">
<meta name="theme-color" content="#14181c">
<title>EVT War Room</title>
<style>
:root{
  --bg:#14181c; --ink:#eef2f4; --muted:#93a1ab; --panel:#1d2329; --rule:#2d363e;
  --yellow:#f5c518; --red:#ff5a4e; --green:#3ddc84; --orange:#ff9f43;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.hudbtns{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);display:flex;gap:6px;z-index:5}
.hudbtns[hidden]{display:none}
.hudbtns button{width:44px;height:44px;border-radius:12px;border:1px solid var(--rule);background:rgba(29,35,41,.85);color:var(--ink);font:600 16px/1 var(--font);display:grid;place-items:center;padding:0;transition:transform .08s}
.hudbtns button:active{transform:scale(.88)}
#ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px);background:rgba(10,13,16,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow-y:auto;touch-action:pan-y}
#ov[hidden]{display:none}
.card{width:min(460px,100%);background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:22px 20px 20px;display:grid;gap:14px;animation:pop .32s cubic-bezier(.2,1.4,.4,1) both;margin:auto}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
.card h1{margin:0;font-size:36px;line-height:1.02;letter-spacing:-.01em;font-weight:800}
.card h1 span{color:var(--yellow)}
.card h2{margin:0;font-size:24px;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.card p b{color:var(--ink);font-weight:600}
.eyebrow{font:700 11px/1.3 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.from{font-size:13px!important}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 18px;min-height:48px;font:800 17px/1 var(--font);background:var(--yellow);color:#15181b;width:100%;transition:transform .08s,filter .08s}
.btn:active{transform:scale(.96);filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:700}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.small{font-size:12.5px!important}
.center{text-align:center}
.stamp{justify-self:center;text-align:center;font:900 28px/1 var(--font);letter-spacing:.06em;padding:8px 16px;border:4px solid currentColor;border-radius:8px;transform:rotate(-6deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) .12s both}
.stamp.pass{color:var(--green)} .stamp.fail{color:var(--red)} .stamp.warn{color:var(--orange)}
@keyframes stamp{0%{transform:scale(2.6) rotate(-14deg);opacity:0}60%{transform:scale(.9) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.verdict{text-align:center;color:var(--ink)!important;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#161b20;border-radius:10px;padding:10px 6px;text-align:center;display:grid;gap:3px}
.stat b{font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lesson{border-left:3px solid var(--yellow);padding:6px 0 6px 12px;font-size:14px!important;color:var(--ink)!important}
.lesson.red{border-color:var(--red)}
.big{font:900 46px/1 var(--font);font-variant-numeric:tabular-nums;text-align:center}
.newbest{color:var(--yellow);text-align:center;font-weight:800;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.sect{font:800 11px/1 var(--font)!important;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)!important}
.sev{display:grid;gap:6px}
.sev div{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center;font-size:13.5px;color:var(--muted);line-height:1.3}
.sev b{font:900 9.5px/1 var(--font);letter-spacing:.02em;padding:5px 0;border-radius:5px;color:#15181b;text-align:center}
.teams{display:grid;gap:8px}
.tm{background:#161b20;border-radius:10px;padding:9px 10px;border-left:3px solid var(--c)}
.tm h3{margin:0 0 5px;font-size:13px;display:flex;justify-content:space-between;color:var(--c)}
.tm h3 span{color:var(--muted);font-weight:700}
.tm ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.tm li{font-size:12px;line-height:1.3;color:var(--muted);display:grid;grid-template-columns:16px 1fr;gap:4px;animation:fin .3s ease-out both}
@keyframes fin{from{opacity:0;transform:translateX(-8px)}}
.tm li i{font-style:normal;font-weight:900}
.tm li.ok i{color:var(--green)} .tm li.warn i{color:var(--orange)} .tm li.fail i{color:var(--red)}
.tm li.fail,.tm li.warn{color:var(--ink)}
.tm li small{display:block;color:#7f8c96;font-size:11px}
.items{display:grid;gap:6px}
.it{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;font-size:12.5px;color:var(--ink);line-height:1.3}
.it small{display:block;color:var(--muted);font-size:11px}
.chip{font:900 9.5px/1 var(--font);letter-spacing:.05em;padding:4px 0;border-radius:5px;color:#15181b;text-align:center}
.chip.hold{background:var(--red)} .chip.cond{background:var(--orange)} .chip.go{background:var(--green)}
a{color:var(--yellow)}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:calc(env(safe-area-inset-left,0px) + 8px);z-index:11;color:var(--ink);text-decoration:none;font:700 14px/1 var(--font);padding:0 12px;min-height:44px;border-radius:10px;display:flex;align-items:center;background:rgba(29,35,41,.7);border:1px solid var(--rule)}
.back:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
#ov{padding-top:calc(env(safe-area-inset-top,0px) + 48px) !important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<div class="hudbtns" id="hudbtns" hidden>
  <button id="btnMute" aria-label="Sound on or off">♪</button>
  <button id="btnPause" aria-label="Pause">❚❚</button>
</div>
<div id="ov"></div>

<script src="../hhl.js?v=14"></script>
<script>
'use strict';
(function () {
// ---------- utilities ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('hhl.ch4.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hhl.ch4.' + k, JSON.stringify(v)); } catch (e) {} }
};
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const FONT = '-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

// ---------- crash guard ----------
let crashed = false;
function crash(msg) {
  if (crashed) return; crashed = true;
  try {
    const ov = $('ov'); ov.hidden = false;
    ov.innerHTML = '<div class="card"><div class="eyebrow">War room offline</div><h2>Something went wrong</h2><p class="small">' +
      String(msg).replace(/[<>&]/g, '') + '</p><button class="btn" onclick="location.reload()">Restart</button></div>';
  } catch (e) {}
}
window.addEventListener('error', e => crash(e.message || 'Unknown error'));
window.addEventListener('unhandledrejection', e => crash((e.reason && e.reason.message) || 'Unknown error'));
const guard = fn => function (e) { try { return fn(e); } catch (err) { crash(err && err.message ? err.message : err); } };

// ---------- sound ----------
const Sfx = {
  ctx: null, master: null, noiseBuf: null, muted: store.get('muted', false),
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.5;
        this.master.connect(this.ctx.destination);
        const len = Math.floor(this.ctx.sampleRate * 0.5);
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const s = this.ctx.createBufferSource(); s.buffer = this.ctx.createBuffer(1, 1, 22050); s.connect(this.ctx.destination); s.start(0);
      }
      if (this.ctx.state !== 'running') this.ctx.resume();
    } catch (e) {}
  },
  setMuted(m) { this.muted = m; store.set('muted', m); try { if (this.master) this.master.gain.value = m ? 0 : 0.5; } catch (e) {} },
  ok() { return this.ctx && !this.muted && this.ctx.state === 'running'; },
  tone(f, dur, type, vol, slide, delay) {
    if (!this.ok()) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  },
  noise(dur, vol, freq, delay) {
    if (!this.ok()) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
      const g = this.ctx.createGain(); g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.03);
    } catch (e) {}
  },
  pick() { this.tone(620, 0.05, 'triangle', 0.09, 820); },
  drop(team, combo) { const f = [523, 587, 659, 784, 880][team] || 440; const k = Math.pow(2, Math.min(combo, 12) / 24); this.tone(f * k, 0.11, 'square', 0.1); this.tone(f * k * 1.5, 0.12, 'triangle', 0.08, null, 0.04); this.noise(0.05, 0.1, 3500); },
  half() { this.tone(660, 0.08, 'triangle', 0.1); this.tone(880, 0.06, 'triangle', 0.06, null, 0.05); },
  log() { this.noise(0.12, 0.12, 2600); this.tone(440, 0.08, 'sine', 0.08); },
  wrong() { this.tone(160, 0.22, 'sawtooth', 0.14, 70); this.noise(0.08, 0.1, 600); },
  full() { this.tone(260, 0.08, 'square', 0.08); this.tone(260, 0.08, 'square', 0.08, null, 0.11); },
  resolve() { this.tone(988, 0.08, 'triangle', 0.07); this.tone(1319, 0.12, 'triangle', 0.07, null, 0.06); },
  escalate() { this.tone(880, 0.18, 'sawtooth', 0.09, 440); },
  slip() { this.noise(0.45, 0.35, 900); this.tone(90, 0.5, 'sine', 0.35, 40); this.tone(220, 0.35, 'square', 0.08, 110, 0.05); },
  boom() { this.noise(0.35, 0.3, 700); this.tone(140, 0.4, 'square', 0.12, 60); this.tone(1200, 0.08, 'square', 0.06, null, 0.02); },
  review() { [392, 494, 587, 784].forEach((f, i) => this.tone(f, 0.24, 'triangle', 0.11, null, i * 0.06)); this.noise(0.3, 0.06, 5000, 0.2); },
  spotted() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.12, null, i * 0.05)); },
  lost() { this.tone(500, 0.4, 'sine', 0.12, 140); },
  click() { this.tone(900, 0.04, 'square', 0.05); },
  intro() { this.tone(330, 0.18, 'square', 0.1); this.tone(494, 0.3, 'square', 0.1, null, 0.16); },
  week() { this.tone(1200, 0.03, 'square', 0.05); this.tone(1600, 0.04, 'square', 0.04, null, 0.05); },
  tick() { this.tone(1200, 0.03, 'square', 0.04); },
  meeting() { this.tone(196, 1.1, 'sine', 0.3); this.tone(294, 1.0, 'sine', 0.14, null, 0.02); this.noise(0.6, 0.08, 400); },
  pass() { [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.28, 'triangle', 0.12, null, i * 0.09)); },
  cond() { [392, 523, 659, 587].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.11, null, i * 0.1)); },
  hold() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.3, 'square', 0.1, null, i * 0.16)); }
};

// ---------- canvas + layout ----------
const cvs = $('game'), ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;
const SAFE = { t: 0, r: 0, b: 0, l: 0 };
const L = { docks: [] };
function readSafe() {
  try {
    const cs = getComputedStyle($('safe'));
    SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.r = parseFloat(cs.paddingRight) || 0;
    SAFE.b = parseFloat(cs.paddingBottom) || 0; SAFE.l = parseFloat(cs.paddingLeft) || 0;
  } catch (e) {}
}
function resize() {
  readSafe();
  const vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth); H = Math.round(vv ? vv.height : window.innerHeight);
  if (W < 10 || H < 10) { W = window.innerWidth; H = window.innerHeight; }
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  const padL = 12 + SAFE.l, padR = 12 + SAFE.r, top = SAFE.t + 8, bottom = H - SAFE.b - 8;
  L.portrait = H >= W * 0.9;
  L.docks = [];
  const gapD = 8;
  if (L.portrait) {
    const w = W - padL - padR;
    L.hud = { x: padL, y: top, w: w - 104, h: 46, scoreX: W / 2 };
    L.gantt = { x: padL, y: top + 52, w, lane: 6, gap: 3 };
    L.gantt.h = 5 * L.gantt.lane + 4 * L.gantt.gap;
    L.bar = { x: padL, y: L.gantt.y + L.gantt.h + 10, w, h: 44 };
    const dockH = clamp(H * 0.08, 54, 72), dw = (w - 2 * gapD) / 3;
    const dy = bottom - 2 * dockH - gapD;
    for (let i = 0; i < 6; i++) L.docks.push({ x: padL + (i % 3) * (dw + gapD), y: dy + Math.floor(i / 3) * (dockH + gapD), w: dw, h: dockH });
    const iy = L.bar.y + L.bar.h + 6;
    L.inbox = { x: padL, y: iy, w, h: Math.max(140, dy - 10 - iy) };
  } else {
    const lw = Math.round((W - padL - padR) * 0.54);
    L.bar = { x: padL, y: top, w: lw, h: 44 };
    L.inbox = { x: padL, y: top + 50, w: lw, h: Math.max(140, bottom - (top + 50)) };
    const rx = padL + lw + 14, rw = W - padR - rx;
    L.hud = { x: rx, y: top, w: rw - 104, h: 46, scoreX: rx + Math.max(90, (rw - 104) * 0.62) };
    L.gantt = { x: rx, y: top + 54, w: rw, lane: 6, gap: 3 };
    L.gantt.h = 5 * L.gantt.lane + 4 * L.gantt.gap;
    const dy0 = L.gantt.y + L.gantt.h + 12;
    const dockH = clamp((bottom - dy0 - gapD) / 2, 44, 86), dw = (rw - 2 * gapD) / 3;
    for (let i = 0; i < 6; i++) L.docks.push({ x: rx + (i % 3) * (dw + gapD), y: dy0 + Math.floor(i / 3) * (dockH + gapD), w: dw, h: dockH });
  }
  L.rowGap = 6;
  L.rowH = clamp((L.inbox.h - (CAP_INBOX - 1) * L.rowGap) / CAP_INBOX, 30, 66);
  const rbw = Math.min(196, L.bar.w * 0.56);
  L.review = { x: L.bar.x + L.bar.w - rbw, y: L.bar.y, w: rbw, h: L.bar.h };
}
let resizeTimer = 0;
function scheduleResize() { resize(); clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 250); }
window.addEventListener('resize', scheduleResize);
window.addEventListener('orientationchange', () => setTimeout(resize, 300));
if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);

// ---------- game data (from Chapter 4) ----------
const WEEK = 14, WEEKS = 12, END = WEEK * WEEKS, CAP_INBOX = 7, CAP_TEAM = 4, BUFFER = 4, LOG = 5;
const TEAMS = [
  { k: 'SW', name: 'Software', up: 'SOFTWARE', color: '#5ab0ff', stages: [[0, 3, 'Top Level Design'], [3, 5, 'Detailed Design'], [5, 9, 'Code + unit tests'], [9, 12, 'Integration tests']] },
  { k: 'TEST', name: 'Testing', up: 'TESTING', color: '#b48cff', stages: [[0, 3, 'Testing design'], [3, 6, 'Test cases'], [6, 10, 'Function tests'], [10, 12, 'System tests']] },
  { k: 'HW', name: 'Hardware', up: 'HARDWARE', color: '#3ddc84', stages: [[0, 3, 'Circuit design'], [3, 5, 'Layout'], [5, 8, 'Sample run'], [8, 12, 'EVT validation']] },
  { k: 'MECH', name: 'Mechanical', up: 'MECHANICAL', color: '#2fd3c8', stages: [[0, 6, 'Design'], [6, 12, 'Mockup']] },
  { k: 'MFG', name: 'Manufacturing', up: 'MANUFACTURING', color: '#ff7eb6', stages: [[0, 6, 'Planning'], [6, 12, 'Productivity review']] }
];
const SEV = [
  { k: 'CRIT', name: 'Critical', color: '#ff5a4e', fuse: 9, work: 5.5, pts: 60, res: 100 },
  { k: 'HIGH', name: 'High', color: '#ff9f43', fuse: 13, work: 4.5, pts: 45, res: 70 },
  { k: 'MED', name: 'Medium', color: '#f5c518', fuse: 18, work: 3.6, pts: 30, res: 40 },
  { k: 'LOW', name: 'Low', color: '#93a1ab', fuse: 0, work: 2.5, pts: 25, res: 15 }
];
// EVT exit criteria by team (reference section of the chapter)
const CRIT = [
  ['Top Level Design: SW, CSC and UI specs approved', 'Design Spec, Integration Test Plan and API Spec done', 'All modules coded, inspected and unit tested', 'Integration Test Report above 90% on critical functions', 'No open Critical defects, under 5 open High with plans'],
  ['Test Mandatory List reviewed by all teams', 'Coverage analysis: over 95% of PRD requirements have a test', 'All test equipment acquired or booked', 'IEEE, Function and System Test Plans complete', 'Function and System Test Reports and Bug Report complete'],
  ['Schematic complete, reviewed and released', 'Post-simulation passed: signal and power integrity', 'DFM review: all findings addressed or accepted', 'Sample run complete: boards built and evaluated', 'EVT validation: HW Test Report passes every item', 'MTBF prediction complete'],
  ['Thermal simulation: every part within its rating', 'Assembly analysis: every step works at production pace', 'PCB outline confirmed and agreed with Hardware', 'Mockup verified: fit, assembly and thermal interface', 'Mockup assembled by a production assembler'],
  ['DFM Requirements delivered to Hardware and Mechanical', 'New Parts Review complete, with development plans', 'ICT coverage target met or gap accepted', 'Manufacturability Evaluation and DFM Review Report done', 'Production Test Plan complete']
];
// s: severity 0..3, o: owner teams, c: [team, exit criterion], w: weeks, h: hidden second team, b: what it becomes if nobody tells them
const ISSUES = [
  { t: 'CSC spec: module interfaces still undefined', s: 1, o: [0], c: [0, 0], w: [1, 4] },
  { t: 'UI spec: LED states disagree with the app', s: 2, o: [0], c: [0, 0], w: [1, 5] },
  { t: 'Coding started before the architecture was done', s: 1, o: [0], c: [0, 0], w: [2, 6] },
  { t: 'API spec lists no error conditions', s: 2, o: [0], c: [0, 1], w: [3, 7] },
  { t: 'Code inspection skipped on the BLE module', s: 2, o: [0], c: [0, 2], w: [5, 9] },
  { t: 'Unit test mocks don\'t match the real module', s: 2, o: [0], c: [0, 2], w: [5, 10] },
  { t: 'Firmware hangs on wake from sleep', s: 0, o: [0], c: [0, 3], w: [8, 12] },

function evaluate() {
  for (const p of S.pend.splice(0)) S.dvt.push(p.iss);
  const items = [];
  for (const iss of S.issues) {
    if (iss.state === 'done' || iss.state === 'logged') continue;
    const owned = iss.state === 'queued';
    const where = iss.state === 'lost' ? 'lost in an email thread' : owned ? 'still open with ' + iss.teams.map(tn).join(' + ') : iss.assigned.length ? 'only half routed, ' + iss.teams.filter(t => !iss.assigned.includes(t)).map(tn).join(' + ') + ' never told' : 'no owner, never routed';
    let cat, why;
    if (iss.sev === 0) { cat = 'hold'; why = iss.origin ? 'Silent change from week ' + iss.origin.week + ' never reached ' + TEAMS[iss.origin.tpl.h].name + '. Surfaced in integration, ' + (owned ? 'too late to fix' : where) : owned ? 'Critical, routed in week ' + iss.qWeek + ', not fixed by the gate' : 'Critical, ' + where; }
    else if (iss.sev === 1) { cat = owned ? 'cond' : 'hold'; why = owned ? 'High: owner and plan, ' + where : 'High with no plan: ' + where; }
    else if (iss.sev === 2) { cat = owned ? 'go' : 'cond'; why = owned ? 'Medium, owned by ' + iss.teams.map(tn).join(' + ') : 'Medium: ' + where; }
    else { cat = 'go'; why = 'Low, ' + (iss.state === 'lost' ? 'lost but harmless' : 'documented'); }

  const rank = { go: 0, cond: 1, hold: 2 };
  const crit = CRIT.map(list => list.map(txt => ({ txt, st: 0, why: '' })));
  for (const it of items) {
    const c = crit[it.iss.crit[0]][it.iss.crit[1]], r = rank[it.cat];
    if (r > c.st) { c.st = r; c.why = it.iss.text; }
  }
  const sw = items.filter(it => it.iss.teams.includes(0));

  else if (swHigh >= 5 || rule5) { c4.st = 2; c4.why = highOwned + ' open High issues across the programme'; }

}
function endMeeting() {

function update(dt) {
  S.t += dt;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; if (p.rot != null) p.rot += (p.vr || 0) * dt;
  }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.life += dt; if (f.life >= f.max) floats.splice(i, 1); }
  shake *= Math.pow(0.0015, dt); if (shake < 0.2) shake = 0;
  flash = Math.max(0, flash - dt * 1.6);
  S.scorePunch = Math.max(0, S.scorePunch - dt * 4); S.comboPunch = Math.max(0, S.comboPunch - dt * 4);
  S.shownScore += (S.score - S.shownScore) * Math.min(1, dt * 9); if (Math.abs(S.score - S.shownScore) < 0.5) S.shownScore = S.score;
  for (let d = 0; d < 6; d++) { S.dockBump[d] = Math.max(0, S.dockBump[d] - dt * 3.5); S.dockShake[d] = Math.max(0, S.dockShake[d] - dt * 3); }
  S.reviewPulse = Math.max(0, S.reviewPulse - dt * 1.5); S.reviewWob = Math.max(0, S.reviewWob - dt * 4); S.slipFlash = Math.max(0, S.slipFlash - dt);
  if (S.sweep >= 0) { S.sweep += dt * 1.4; if (S.sweep > 1.25) S.sweep = -1; }
  for (let i = S.flyers.length - 1; i >= 0; i--) {
    const f = S.flyers[i]; f.t += dt;
    if (f.t >= f.dur) { S.flyers.splice(i, 1); S.dockBump[f.d] = 1; const c = dockCenter(f.d); burst(c.x, c.y, [f.d === LOG ? '#93a1ab' : TEAMS[f.d].color, '#ffffff'], 8, 180); }
  }
  for (let i = S.ghosts.length - 1; i >= 0; i--) {
    const g = S.ghosts[i]; g.life += dt; g.vy += 900 * dt; g.x += g.vx * dt; g.y += g.vy * dt; g.rot += g.vr * dt;
    if (g.life > 1.4 || g.y > H + 100) S.ghosts.splice(i, 1);
  }
  S.inbox.forEach((iss, i) => {
    iss.ry += (i - iss.ry) * Math.min(1, dt * 12);
    if (Math.abs(i - iss.ry) < 0.002) iss.ry = i;
    iss.vX += (-260 * iss.offX - 20 * iss.vX) * dt; iss.offX += iss.vX * dt;
    iss.vY += (-260 * iss.offY - 20 * iss.vY) * dt; iss.offY += iss.vY * dt;

      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - k * 0.6) + p.size * easeOutCubic(1 - k), 0, 7); ctx.stroke();

    }

    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + k * 0.6), 0, 7); ctx.fill(); }
  }

}
function drawFloats() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats) {
    const k = f.life / f.max, pop = k < 0.15 ? easeOutBack(k / 0.15) : 1;
    ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    ctx.font = '900 ' + Math.round(f.size * (0.7 + 0.3 * pop)) + 'px ' + FONT;
    const y = f.y - easeOutCubic(k) * 40;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,12,14,.85)'; ctx.strokeText(f.text, f.x, y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, y);
  }
  ctx.globalAlpha = 1;
}
function bubble(x, y, text, below) {
  ctx.font = '700 13px ' + FONT;
  const tw = ctx.measureText(text).width, w = Math.min(W - 16, tw + 20), h = 28;
  let bx = clamp(x - w / 2, 8, W - w - 8), by = below ? y + 10 : y - h - 10;
  by += Math.sin(S.t * 6) * 3;
  ctx.fillStyle = '#f5c518'; rr(ctx, bx, by, w, h, 8); ctx.fill();
  ctx.beginPath(); const tx = clamp(x, bx + 12, bx + w - 12);
  if (below) { ctx.moveTo(tx - 7, by); ctx.lineTo(tx, by - 7); ctx.lineTo(tx + 7, by); } else { ctx.moveTo(tx - 7, by + h); ctx.lineTo(tx, by + h + 7); ctx.lineTo(tx + 7, by + h); }
  ctx.fill();
  ctx.fillStyle = '#15181b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; fitFont(text, '700', 13, w - 12, 9); ctx.fillText(text, bx + w / 2, by + h / 2 + 1);
}
function drawHints() {
  if (S.mode !== 'play') return;
  for (const h of S.hints) {
    if (h.kind === 'iss') { if (S.drag && S.drag.iss === h.iss) continue; const p = cardPos(h.iss); bubble(p.x + p.w * 0.6, p.y + p.h, h.text, true); }
    else if (h.kind === 'review') bubble(L.review.x + L.review.w / 2, L.review.y + L.review.h, h.text, true);
    else if (h.kind === 'dock') { const r = L.docks[h.d]; bubble(r.x + r.w / 2, r.y, h.text, false); }
    else if (h.kind === 'center') bubble(W / 2, L.inbox.y + L.inbox.h / 2, h.text, false);

}
function drawHud() {
  if (S.mode === 'title' || !S.st) return;
  const hd = L.hud, top = hd.y;
  ctx.fillStyle = '#f5c518'; rr(ctx, hd.x, top + 2, 84, 26, 7); ctx.fill();
  ctx.fillStyle = '#15181b'; ctx.font = '900 13px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('WEEK ' + S.week, hd.x + 42, top + 15.5);
  // buffer pips
  ctx.textAlign = 'left'; ctx.fillStyle = '#93a1ab'; ctx.font = '600 10px ' + FONT;
  ctx.fillText('buffer', hd.x + 1, top + 39);
  for (let i = 0; i < BUFFER; i++) {
    const on = i < S.buffer, px = hd.x + 36 + i * 12;
    ctx.fillStyle = on ? '#3ddc84' : '#ff5a4e'; ctx.globalAlpha = on ? 1 : 0.55 + S.slipFlash * 0.45;
    rr(ctx, px, top + 34, 9, 9, 2); ctx.fill(); ctx.globalAlpha = 1;
  }
  const sp = 1 + S.scorePunch * 0.25;
  ctx.save(); ctx.translate(hd.scoreX, top + 16); ctx.scale(sp, sp);
  ctx.fillStyle = '#eef2f4'; ctx.font = '900 26px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText(Math.round(S.shownScore).toLocaleString('en'), 0, 0); ctx.restore();
  if (S.combo >= 2) {
    const cp = 1 + S.comboPunch * 0.35, m = mult();
    ctx.save(); ctx.translate(hd.scoreX, top + 39); ctx.scale(cp, cp);
    ctx.fillStyle = m >= 2 ? '#f5c518' : m > 1 ? '#3ddc84' : '#93a1ab'; ctx.font = '800 12px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('COMBO ' + S.combo + (m > 1 ? '  ×' + m : ''), 0, 0); ctx.restore();
  }
}
function drawBanner(big, small, k) {
  const inT = clamp(k / 0.25, 0, 1), outT = clamp((k - 0.78) / 0.22, 0, 1);
  const x = W / 2 + (1 - easeOutBack(inT)) * -W + easeOutCubic(outT) * W;
  ctx.fillStyle = 'rgba(10,12,14,' + (0.6 * (1 - outT)) + ')'; ctx.fillRect(0, H / 2 - 62, W, 124);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f5c518'; fitFont(big, '900', 60, W - 32, 24); ctx.fillText(big, x, H / 2 - 12);
  ctx.fillStyle = '#eef2f4'; ctx.font = '700 15px ' + FONT; ctx.fillText(small, x, H / 2 + 32);
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  try {
    let dt = (now - last) / 1000; last = now;
    if (!(dt >= 0)) dt = 0; dt = Math.min(dt, 0.05);
    if (!S.paused && !crashed) {
      if (hitstop > 0) hitstop -= dt; else update(dt);

  } catch (e) { crash(e && e.message ? e.message : e); return; }

}
window.__evt = { S, L, rowRect, cardPos, dockRect, trueOwners, TEAMS, LOG, CAP_TEAM }; // read-only hook for automated tests
resize();
resetRun(); S.st = null;
showTitle();
requestAnimationFrame(frame);
})();
