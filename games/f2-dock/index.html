<title>The Dock — The Hardest Factory Lessons</title>

<style>
:root{
  --bg:#101a1c; --ink:#eaf3f2; --muted:#93a9a8; --panel:#182427; --panel2:#1e2e31; --rule:#2c4043;
  --acc:#3dd6c6; --red:#ff5a4e; --green:#3ddc84; --amber:#ff9f43; --gold:#f5c518;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 28px);overflow-x:hidden}
#app{width:min(480px,100%);margin:0 auto;display:grid;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center}
.back{color:var(--muted);text-decoration:none;font:600 14px/1 var(--font);padding:10px 8px;margin-left:-8px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:18px 16px;display:grid;gap:12px;animation:pop .22s ease both}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
h1{margin:0;font-size:36px;line-height:1.02;font-weight:900;letter-spacing:-.01em} h1 span{color:var(--acc)}
h2{margin:0;font-size:22px;font-weight:800}
h3{margin:0;font:700 11px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.45} p b,li b{color:var(--ink);font-weight:600}
.small{font-size:12.5px} .plain{border-left:3px solid var(--rule);padding:2px 0 2px 10px;font-size:13px;color:#cfdddc}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 16px;font:800 16px/1.1 var(--font);background:var(--acc);color:#07201d;width:100%;min-height:50px;cursor:pointer;box-shadow:0 4px 0 #1f8f85;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f8f85} .btn:disabled{opacity:.35;pointer-events:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:700;box-shadow:none}
.btn.sm{padding:10px 12px;min-height:40px;font-size:14px;border-radius:11px}
.btn.warn{background:var(--amber);box-shadow:0 4px 0 #b86a1d}
.row{display:flex;gap:10px} .row>*{flex:1}
.hud{margin-right:50px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;position:sticky;top:6px;z-index:5}
.hud b{font-size:14px} .pips{display:flex;gap:5px}
.pip{width:100%;max-width:34px;height:14px;border-radius:4px;background:var(--acc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:background .15s,transform .15s}
.pip.off{background:#0e1718;box-shadow:none;transform:scaleY(.7)}
.hud span{font:800 12px/1 var(--font);color:var(--muted)}
.stage{position:relative;height:190px;border-radius:14px;overflow:hidden;background:linear-gradient(#1b2b2e 0 62%,#23363a 62% 100%);border:1px solid var(--rule)}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:38%;background:repeating-linear-gradient(90deg,#26393d 0 26px,#2b4146 26px 52px)}
.stage .door{position:absolute;right:14px;top:16px;width:92px;height:84px;border-radius:6px;background:repeating-linear-gradient(#2f4247 0 8px,#273a3e 8px 16px);border:2px solid #3b5359}
.truck{position:absolute;left:0;bottom:30px;width:200px}
.crate{position:relative;display:grid;place-items:center}
.crate .body{width:128px;height:104px;border-radius:10px;border:4px solid #7a5230;background:repeating-linear-gradient(90deg,#a9753f 0 22px,#9a6a38 22px 24px);display:grid;place-items:center;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.crate .win{width:78px;height:78px;border-radius:10px;background:#101a1c;display:grid;place-items:center;border:2px solid #6b4a2b}
.crate .qty{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--ink);color:#101a1c;font:900 11px var(--font);padding:4px 8px;border-radius:7px;white-space:nowrap}
.mini{display:grid;place-items:center;width:52px;height:46px;background:#101a1c;border-radius:8px;border:2px solid #6b4a2b}
.belt{position:relative;height:16px;border-radius:6px;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font:800 10px/1 var(--font);letter-spacing:.05em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.tag.hot{color:var(--red)} .tag.warn{color:var(--amber)} .tag.ok{color:var(--green)} .tag.star{color:var(--gold)}
.lots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lotc{position:relative;display:grid;gap:8px;justify-items:center;text-align:center;background:var(--panel2);border:1px solid var(--rule);border-radius:16px;padding:14px 8px 12px;color:var(--ink);font:inherit;cursor:pointer;animation:jdrop .4s cubic-bezier(.2,1.3,.4,1) both;transition:transform .06s}
.lotc:active{transform:scale(.95)} .lotc b{font-size:13.5px;line-height:1.2} .lotc span{font-size:11px;color:var(--muted)}
.lotc .st{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;background:#0e1718;color:var(--muted)}
.lotc.done{opacity:.72} .lotc.done .st{background:var(--green);color:#07201d} .lotc.q .st{background:var(--amber);color:#07201d}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{display:grid;gap:3px;justify-items:center;text-align:center;border:1px solid var(--rule);background:var(--panel2);border-radius:14px;padding:12px 6px;color:var(--ink);font:inherit;cursor:pointer;transition:transform .06s}
.tool:active{transform:scale(.93)} .tool:disabled{opacity:.35;pointer-events:none}
.tool i{font-style:normal;font-size:26px;line-height:1} .tool b{font-size:13px} .tool span{font-size:11px;color:var(--muted)} .tool em{font:900 12px var(--font);font-style:normal;color:var(--acc)}
.tool.used{opacity:.5;border-style:dashed}
.find{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;background:#0e1718;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.4;color:#d6e4e3;animation:jrise .3s cubic-bezier(.2,1.2,.4,1) .2s both}
.find i{font-style:normal;font-size:22px;line-height:1;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--panel2)}
.find b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.find.found{box-shadow:inset 3px 0 0 var(--red)} .find.found b{color:var(--red)} .find.sus{box-shadow:inset 3px 0 0 var(--amber)} .find.sus b{color:var(--amber)} .find.clean{box-shadow:inset 3px 0 0 var(--green)} .find.clean b{color:var(--green)}
.find.old{animation:none}
.note{display:grid;gap:3px;background:#0e1718;border-radius:12px;padding:11px 12px;font-size:13.5px;line-height:1.4;color:#d6e4e3}
.note b{color:var(--acc);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.note.warn b{color:var(--amber)} .note.bad b{color:var(--red)} .note.good b{color:var(--green)}
.pressure{background:#2b1f12;border:1px solid #5a3b17;border-radius:12px;padding:11px 12px;font-size:13.5px;color:#ffd9a8;line-height:1.4}
.meter{height:12px;background:#0e1718;border-radius:8px;overflow:hidden;margin-top:8px} .meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--amber),var(--red));transform-origin:left;animation:fillm 1.6s ease-out both}
@keyframes fillm{from{transform:scaleX(.15)}to{transform:scaleX(1)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:grid;gap:3px;justify-items:center;text-align:center;border:1px solid var(--rule);background:var(--panel2);border-radius:14px;padding:14px 8px;color:var(--ink);font:inherit;cursor:pointer;min-height:112px;transition:transform .06s}
.opt:active{transform:scale(.93)} .opt:disabled{opacity:.35;pointer-events:none}
.opt i{font-style:normal;font-size:30px;line-height:1} .opt b{font-size:14px} .opt span{font-size:11px;color:var(--muted);line-height:1.3} .opt em{font:900 13px var(--font);font-style:normal;color:var(--acc)}
.pick{display:grid;gap:8px}
.pick button{display:grid;grid-template-columns:40px 1fr;gap:2px 12px;text-align:left;border:1px solid var(--rule);background:var(--panel2);border-radius:14px;padding:12px;color:var(--ink);font:inherit;cursor:pointer;transition:transform .1s,border-color .15s}
.pick button i{grid-row:1/3;font-style:normal;font-size:28px;align-self:center;text-align:center}
.pick button.on{border-color:var(--acc);background:#16363a;transform:scale(1.02)} .pick button b{font-size:15px} .pick button span{font-size:12.5px;color:var(--muted);line-height:1.35}
.slots{display:flex;gap:10px;justify-content:center}
.slot{width:64px;height:64px;border-radius:14px;border:2px dashed var(--rule);display:grid;place-items:center;font-size:30px;background:#0e1718}
.slot.on{border:2px solid var(--acc);background:#16363a}
.big{font:900 64px/1 var(--font);text-align:center;color:var(--acc);font-variant-numeric:tabular-nums}
.stamp{justify-self:center;font:900 24px/1 var(--font);letter-spacing:.06em;padding:8px 14px;border:4px solid currentColor;border-radius:8px;transform:rotate(-4deg)}
.stamp.pass{color:var(--green)} .stamp.fail{color:var(--red)} .stamp.warn{color:var(--amber)}
.lines{display:grid;gap:6px} .lines div{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#d6e4e3;padding:7px 0;border-top:1px solid var(--rule)} .lines div:first-child{border-top:0}
.lines em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums} .lines em.pos{color:var(--green)} .lines em.neg{color:var(--red)}
.reveal{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--rule);font-size:13.5px;color:#d6e4e3} .reveal b{font-size:14px;display:block}
.cost{font:900 34px var(--font);font-variant-numeric:tabular-nums;color:var(--red);text-align:center}
.clock{width:84px;height:84px}
.hand{transform-origin:50px 50px;animation:jspin 6s linear infinite}
a{color:var(--acc)}
.fxl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.glass{position:absolute;top:28%;left:0;width:64px;height:64px;animation:jsweep .5s ease-in-out both}
.glass svg{width:100%;height:100%}
.xray{position:absolute;inset:0;background:radial-gradient(circle,rgba(120,200,255,.55),rgba(20,60,120,.65));mix-blend-mode:screen;animation:xr .5s ease-in-out both}
@keyframes xr{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.probe{position:absolute;top:0;width:3px;height:44%;background:#e8e8e8;animation:pr .5s ease-in-out both}
.probe.b{background:#ff5a4e}
@keyframes pr{0%{transform:translateY(-100%)}35%{transform:translateY(0)}65%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.wave{position:absolute;left:8%;right:8%;bottom:14%;height:36px;opacity:0;animation:wv .5s ease-in-out both}
@keyframes wv{40%{opacity:0}55%,90%{opacity:1}100%{opacity:0}}
.gauge{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;opacity:0;animation:wv .5s ease-in-out both}
.needle{transform-origin:50px 50px;animation:nd .5s ease-out both}
@keyframes nd{from{transform:rotate(-80deg)}to{transform:rotate(var(--to,20deg))}}
.j-scanbeam i{animation-duration:.5s !important}
.cage{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(255,159,67,.65) 14px 17px);animation:jdrop .35s ease-out both;border-radius:10px}
</style>

function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function has(id) { return G.spec.indexOf(id) >= 0; }
function riskOf(p) { return (p.broker ? 3 : 0) + (p.latent ? 2 : 0) + (p.esc === 'safety' ? 3 : p.esc === 'scrap' ? 1 : 0) + (p.custom ? 1 : 0); }

function newGame() {
  var must = ['cells', 'caps', 'flash', 'enclosure', 'pcb'], rest = shuffle(PARTS.filter(function (p) { return must.indexOf(p.id) < 0; }).map(function (p) { return p.id; }));
  var broker = rest.filter(function (id) { return PBY[id].broker; })[0]; var ids = must.concat([broker]);
  rest.filter(function (id) { return id !== broker; }).slice(0, DAYS * PER_DAY - ids.length).forEach(function (id) { ids.push(id); });
  var lots, tries = 0;
  do {
    lots = ids.map(function (id) {
      var p = PBY[id], r = riskOf(p), pr = r >= 5 ? .8 : r >= 3 ? .5 : r >= 1 ? .25 : .12, bad = Math.random() < pr;
      return { p:p, defect: bad ? p.defects[Math.floor(Math.random() * p.defects.length)] : null, status:null, log:[], hoursSpent:0, decision:null };
    });
    var n = lots.filter(function (l) { return l.defect; }).length; tries++;
    if (n >= 5 && n <= 8) break;
  } while (tries < 50);
  lots = shuffle(lots);

}
function dayLots() { return G.lots.slice(G.day * PER_DAY, G.day * PER_DAY + PER_DAY); }

function findHtml(x, last) {

  return '<div class="find ' + (x.res === 'found' ? 'found' : x.res === 'inconclusive' ? 'sus' : 'clean') + (last ? '' : ' old') + '"><i>' + MBY[x.m].ic + '</i><div><b>' + MBY[x.m].name + ' · ' + (x.res === 'found' ? 'finding' : x.res === 'inconclusive' ? 'suspicious' : 'nothing found') + '</b>' + x.text + '</div></div>';

function effectHtml(m) {

  if (m === 'auth') return '<div class="fxl"><div class="xray"></div><div class="j-scanbeam v"><i></i></div></div>';
  if (m === 'floor') return '<div class="fxl"><svg class="gauge" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#0e1718" stroke="#3dd6c6" stroke-width="4"/><path d="M14 66A40 40 0 0 1 86 66" stroke="#2c4043" stroke-width="8" fill="none"/><g class="needle" style="--to:' + (Math.random() < .5 ? 40 : -10) + 'deg"><rect x="48" y="14" width="4" height="38" rx="2" fill="#ff9f43"/></g><circle cx="50" cy="50" r="5" fill="#fff"/></svg></div>';

function screenLot(i, justDid) {

function detect(m, l) {
  var d = l.defect, p = l.p;
  function ok(t) { return { res:'clean', text:t }; }
  if (!d) return ok(m === 'visual' ? 'Documents in order, markings consistent.' : m === 'electrical' ? 'Sample measures within the datasheet.' : m === 'auth' ? 'The parts are what the label says.' : 'Every reel is inside its floor life.');
  if (m === 'visual') {
    if (d.type === 'cosmetic') return { res:'found', text:d.text };
    if (d.type === 'wrongrev' && p.custom) return has('spec') ? { res:'found', text:d.text + ' Checked against your drawing at your revision.' } : ok('Checked against the supplier\'s own drawing. It passes. Nobody told them which document counts.');
    if (d.type === 'counterfeit') return { res:'inconclusive', text:'Date codes look plausible, but the package texture is slightly off and the certificate of conformance is missing. Escalate.' };
    return ok('Documents in order, markings consistent.');
  }
  if (m === 'electrical') {
    if (d.type === 'parametric') return { res:'found', text:d.text };
    if (d.type === 'counterfeit') return { res:'found', text:'The sample is off the datasheet. ' + d.text };
    if (d.type === 'wrongrev' && p.semi) return { res:'found', text:d.text };
    return ok('Sample measures within the datasheet.');
  }
  if (m === 'auth') {
    if (d.type === 'counterfeit' || d.type === 'wrongrev') return { res:'found', text:d.text };
    if (d.type === 'parametric') return { res:'inconclusive', text:'The die looks genuine, but the sample shows odd behaviour. Measure it.' };
    return ok('The parts are what the label says.');
  }
  if (m === 'floor') {
    if (d.type === 'msd') return { res:'found', text: has('msd') ? 'The log shows the exposure budget used up. ' + d.text : 'Nobody can say how long this reel has been out. The cabinet shows 40%. ' + d.text };
    return ok('Every reel is inside its floor life.');
  }
  return ok('');
}

function doInspect(m) {

  G.hours -= h; l.hoursSpent += h;

function screenMrb() {

   '<button class="opt" data-a="disp" data-v="uai"><i>✅</i><b>Use as is</b><span>Release with the deviation documented' + (has('trace') ? ' and fenced' : ', no traceability') + '</span><em>€0</em></button></div></div>');

function FEELV() { return J.FEEL.vibe.small; }
function doDisp(v) {

   '<div class="note"><b>' + label + '</b>' + msg + '</div><button class="btn" data-a="day">Back to the dock</button></div>');
  var st = $q('#stage');
  if (v === 'scrap') J.hit(st, 'bad', 'med'); else if (v === 'uai') { J.hit(st, 'neutral', 'small'); J.sfx('stamp'); } else if (v === 'sort') { J.hit(st, 'neutral', 'small'); } else J.flash('#ff9f43', 200, 0.12);

var FIELD = {
  parametric:'Intermittent failures grow month by month. Warranty returns climb, and nothing reproduces on the bench.',
  counterfeit:'Remarked and re-topped parts fail under load. The failure analysis ends in a lab report you did not want.',
  msd:'Ghost failures that pass every test: hidden delamination from moisture, showing up in the field months later.',
  wrongrev:'The units that shipped do not match the drawing. Some do not even assemble, and the ones that do fail early.',
  cosmetic:'Assembly stripped screws and hand-sorting. Annoying and cheap.'
};
function buildEvents() {
  G.events = [];
  G.lots.forEach(function (l) {
    if (!l.defect || !l.defect.harm) return;
    var escaped = (l.status === 'released') || l.useasis || l.escapes;
    if (!escaped) return;
    var cost = ESC[l.p.esc]; if (l.p.esc === 'safety' && l.defect.type === 'counterfeit') cost = 300;
    G.events.push({ l:l, cost:cost, how: l.status === 'released' ? 'shelved without a finding' : l.useasis ? 'used as is' : 'sorted' });
  });
}
function screenLater() {
  G.phase = 'later'; buildEvents(); G.ei = 0;
  var months = ''; for (var m = 1; m <= 11; m++) months += '<span class="tag" style="animation:jrise .25s ' + (m * 0.08) + 's both">M' + m + '</span>';
  el('<div class="card"><h3>Eleven months later</h3><h2>What came back</h2><div class="tags" style="justify-content:center">' + months + '</div><p>' + (G.events.length ? 'Not everything you shelved was good. The field reports start to arrive.' : 'A quiet year. Every defect that mattered was stopped at the dock.') + '</p><button class="btn" data-a="nextev">' + (G.events.length ? 'Open the reports' : 'Take the supplier\'s call') + '</button></div>');
  J.sfx('belt');
}
function nextEvent() {
  if (G.ei >= G.events.length) return screenRecall();
  var e = G.events[G.ei++]; ledger('Field failures: ' + e.l.p.name + ' (' + e.how + ')', e.cost);
  el('<div class="card"><h3>Field report ' + G.ei + ' of ' + G.events.length + ' · ' + e.l.p.name + '</h3><h2>' + (e.l.defect.type === 'counterfeit' ? 'Counterfeit parts in the field' : e.l.defect.type === 'msd' ? 'Moisture damage' : e.l.defect.type === 'wrongrev' ? 'Wrong revision shipped' : 'A latent defect blooms') + '</h2>' +
   '<div class="stage j-siren" id="stage"><div class="floor"></div><div style="position:absolute;inset:0;display:grid;place-items:center;padding-bottom:20px"><div class="j-drop">' + icon(e.l.p.id, 84) + '</div></div><div class="j-blink" style="position:absolute;top:10px;right:14px;font-size:34px">⚠️</div></div>' +
   '<div class="note bad"><b>What happened</b>' + FIELD[e.l.defect.type] + '</div>' +
   '<div class="note"><b>How it got through</b>The lot was ' + e.how + '. ' + e.l.defect.text + '</div>' +
   '<div class="cost" id="cst">−€0k</div><button class="btn" data-a="nextev">' + (G.ei >= G.events.length ? 'Take the supplier\'s call' : 'Next report') + '</button></div>');
  J.sfx('alarm'); J.hit($q('#stage'), 'bad', 'big');
  J.count($q('#cst'), 0, e.cost, 800, function (n) { return '−€' + Math.round(n) + 'k'; });
}
function screenRecall() {
  G.phase = 'recall';
  var harmful = G.events.length > 0;
  var bad = harmful ? G.events[0].l : (G.lots.filter(function (l) { return !l.defect; })[0] || G.lots[0]);
  var cost, txt;
  if (has('trace')) { cost = harmful ? 40 : 0; txt = harmful ? 'You give them the serial range from your records. 4,200 units are affected, and the retrieval is scoped to them.' : 'You run the genealogy: no shipped units contain the lot. Five minutes, and the call is over.'; }
  else { cost = harmful ? 400 : 100; txt = harmful ? 'There is no traceability. The recall that could have been four thousand units becomes every unit shipped in six months.' : 'You cannot prove which units contain it, so you screen six months of shipments to be safe.'; }
  ledger('Supplier recall call: ' + bad.p.name, cost);
  el('<div class="card"><h3>Month 11 · ' + bad.p.sup + ' calls</h3><h2>"Lots from March to May have a latent defect"</h2>' +
   '<div class="stage" id="stage"><div class="floor"></div><div style="position:absolute;inset:0;display:grid;place-items:center;padding-bottom:20px"><div class="j-float" id="ph" style="font-size:64px">📞</div></div></div>' +
   '<p>Which of your shipped units contain them? Everything about how that gets answered was decided at the receiving dock, months ago, by people who did not know they were deciding it.</p>' +
   '<div class="note ' + (has('trace') ? 'good' : 'bad') + '"><b>' + (has('trace') ? 'Traceability in place' : 'No traceability') + '</b>' + txt + '</div>' +
   '<div class="cost" id="cst" style="' + (cost ? '' : 'color:var(--green)') + '">€0k</div><button class="btn" data-a="result">See the result</button></div>');
  J.sfx('phone'); later(300, function () { J.wiggle($q('#ph')); }); later(700, function () { J.wiggle($q('#ph')); });
  later(900, function () {
    if (cost) J.hit($q('#stage'), 'bad', cost >= 100 ? 'big' : 'med'); else J.hit($q('#ph'), 'good', 'med');
    J.count($q('#cst'), 0, cost, 800, function (n) { return cost ? '−€' + Math.round(n) + 'k' : '€0k'; });
  });
}

function score() {
  var costs = 0, rows = []; G.ledger.forEach(function (x) { costs += x.cost; });
  var base = Math.max(0, Math.round(1000 - costs * 0.75));
  rows.push(['Total cost of poor quality: €' + costs + 'k', base]);
  var total = base, pen = 0;
  var bySup = {}; G.lots.forEach(function (l) { if (l.sorted) bySup[l.p.sup] = (bySup[l.p.sup] || 0) + 1; });
  Object.keys(bySup).forEach(function (s) { if (bySup[s] > 1) pen += 20; });
  if (pen) { rows.push(['Same supplier sorted repeatedly (absorbing its problem)', -pen]); total -= pen; }
  return { rows:rows, total:Math.max(0, total), costs:costs };
}

function screenResult() {
  G.phase = 'result';
  var sc = score(), best = store.get('best', 0), nb = sc.total > best;
  if (nb) store.set('best', sc.total);
  try { HHL.submit(102, sc.total); } catch (e) {}
  var stamp = sc.total >= 750 ? 'pass' : sc.total >= 450 ? 'warn' : 'fail';
  var txt = sc.total >= 750 ? 'DOCK UNDER CONTROL' : sc.total >= 450 ? 'SOME GOT THROUGH' : 'THE DOOR WAS OPEN';
  var T = { counterfeit:'Counterfeit', parametric:'Latent parametric defect', msd:'Moisture damage', wrongrev:'Wrong revision', cosmetic:'Cosmetic' };
  var truth = G.lots.map(function (l) {
    var how = l.status === 'released' ? 'shelved' : ({ rtv:'returned', scrap:'scrapped', sort:'sorted', uai:'used as is', overridden:'released by their MRB' }[l.decision] || 'quarantined');
    var what = l.defect ? T[l.defect.type] + (l.defect.harm ? '' : ' (harmless)') : 'Good';
    var used = l.log.length ? l.log.map(function (x) { return MBY[x.m].name.split(' ')[0].toLowerCase(); }).join(' + ') : 'no inspection';
    return '<div class="reveal"><span class="mini" style="width:44px;height:40px">' + icon(l.p.id, 32) + '</span><span><b>' + l.p.name + ' · ' + what + '</b><span class="small">You: ' + used + ' → ' + how + '</span></span></div>'; }).join('');
  var lessons = [];
  if (!has('spec')) lessons.push('Without an inspection specification you could not see which parts were critical, and custom parts were checked against the supplier\'s own drawing.');
  if (!has('mrb')) lessons.push('Without a written approval rule, their board released ' + G.overrides + ' failed lot(s) as-is. It carries the schedule pressure, not your field-failure liability.');
  if (!has('channel')) lessons.push('Without channel control, a broker buy can arrive labelled as authorised distribution. A purchasing desk filling a shortage quietly is not hypothetical. It is a Tuesday.');
  if (!has('trace')) lessons.push('Without traceability, a recall covers everything shipped in six months. Traceability is built at the dock or not at all.');
  if (!has('msd')) lessons.push('Without floor-life logs, nobody could say how long the reels had been open. A disciplined factory answers in seconds.');
  el('<div class="card"><h3>Year-end result</h3><div class="stamp ' + stamp + '" id="stp">' + txt + '</div><div class="big" id="bigs">0</div>' +
   (nb ? '<p style="text-align:center;color:var(--acc);font-weight:800" class="j-pulse">New best!</p>' : '<p class="small" style="text-align:center">Best ' + fmt(Math.max(best, sc.total)) + '</p>') +
   '<div class="lines">' + sc.rows.map(function (r) { return '<div><span>' + r[0] + '</span><em class="' + (r[1] >= 0 ? 'pos' : 'neg') + '">' + (r[1] >= 0 ? '+' : '') + r[1] + '</em></div>'; }).join('') + '</div>' +
   '<h3>Where the money went</h3><div class="lines" id="led">' + (G.ledger.length ? G.ledger.map(function (x) { return '<div><span>' + x.label + '</span><em class="neg">−€' + x.cost + 'k</em></div>'; }).join('') : '<div><span>Nothing</span><em>€0</em></div>') + '</div>' +
   (lessons.length ? '<div class="note warn"><b>What the missing paperwork cost</b>' + lessons.join('<br><br>') + '</div>' : '') +
   '<h3>What was really in each lot</h3><div id="tru">' + truth + '</div>' +
   HHL.next(102) +
   '<div class="row"><button class="btn" data-a="again">Run another shift</button><button class="btn ghost" data-a="menu">Menu</button></div></div>');
  J.stamp($q('#stp'), stamp); J.count($q('#bigs'), 0, sc.total, 1200);
  later(1300, function () { if (stamp === 'pass') { J.confetti(); J.sfx('win'); } else J.sfx(stamp === 'warn' ? 'ok' : 'lose'); });
  J.stagger($app.querySelectorAll('#led div, #tru .reveal'), 50);
}

/* ---------- events ---------- */
$app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  var a = b.dataset.a, id = b.dataset.id;
  switch (a) {
    case 'start': newGame(); screenSpec(); break;
    case 'spec': { var i = G.spec.indexOf(id); if (i >= 0) G.spec.splice(i, 1); else if (G.spec.length < 3) { G.spec.push(id); J.sfx('select'); } screenSpec(); if (i < 0) { var sl = $app.querySelectorAll('.slot.on'); if (sl.length) { J.pop(sl[sl.length - 1], 1.3); J.burstAt(sl[sl.length - 1], { n:10, pal:'acc', speed:160 }); } } break; }
    case 'day': G.overridesToday = G.overridesToday || 0; screenDay(); break;
    case 'lot': screenLot(Number(b.dataset.i)); break;
    case 'insp': doInspect(b.dataset.m); break;
    case 'shelve': doShelve(); break;
    case 'mrb': doMrb(); break;
    case 'disp': doDisp(b.dataset.v); break;
    case 'recap': screenRecap(); break;
    case 'nextday': G.day++; G.hours = HOURS; G.overridesToday = 0; screenDay(); break;
    case 'later': screenLater(); break;
    case 'nextev': nextEvent(); break;
    case 'result': screenResult(); break;
    case 'again': newGame(); screenSpec(); break;
    case 'menu': screenTitle(); break;
  }
});
newGame(); screenTitle();
window.__f2 = { G:function () { return G; }, score:score, PARTS:PARTS, detect:detect };
})();
</script>
</body>
