<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a1c">
<title>Watch the Hands — The Hardest Factory Lessons</title>
<meta name="description" content="A free game: the line report says every station is at takt. Watch the operators' hands to find the design flaws hiding in the assembly, and fix them while the tooling is still cheap. From The Hardest Factory Lessons, Chapter 9.">
<link rel="stylesheet" href="../factory.css?v=1">
<link rel="stylesheet" href="../juice.css?v=2">
<style>
.still .card{animation:none}
.bench{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(#1b2b2e 0 62%,#23363a 62% 100%);border:1px solid var(--rule)}
.bench svg{display:block;width:100%;height:auto}
.bench .lbl{position:absolute;left:10px;top:8px;font:900 10px var(--font);letter-spacing:.12em;color:var(--acc)}
.pts{display:flex;gap:6px;align-items:center;justify-content:space-between;background:#0e1718;border-radius:12px;padding:10px 12px}
.pts .pp{display:flex;gap:6px} .pts .pp i{width:22px;height:22px;border-radius:50%;background:var(--acc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:transform .15s,background .15s} .pts .pp i.off{background:#1d2a2c;box-shadow:none;transform:scale(.7)}
.pts b{font-size:13px} .pts span{font:700 12px var(--font);color:var(--muted)}
.stn{display:grid;gap:8px;border:1px solid var(--rule);background:var(--panel2);border-radius:14px;padding:12px}
.stn.seen{border-color:#2f6f69} .stn.fixed{border-color:var(--green)}
.stn .h{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center}
.stn .n{width:30px;height:30px;border-radius:50%;background:#0e1718;border:2px solid var(--rule);display:grid;place-items:center;font:800 13px var(--font);color:var(--acc)}
.stn .h b{font-size:15px} .stn .h .rp{font:700 11px var(--font);color:var(--muted);text-align:right;line-height:1.35;font-variant-numeric:tabular-nums}
.stn .rp em{font-style:normal;color:var(--amber)}
.watch{position:relative;border-radius:10px;overflow:hidden;background:#0e1718;height:84px}
.watch svg{display:block;width:100%;height:100%}
.hand{position:absolute;font-size:26px;left:18%;top:26px;animation:hand 1.1s ease-in-out var(--n,1) both;transform-origin:50% 100%}
@keyframes hand{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(52px,-8px) rotate(-14deg)}45%{transform:translate(44px,10px) rotate(8deg)}60%{transform:translate(6px,-4px) rotate(0)}100%{transform:translate(0,0) rotate(0)}}
.watch .tt{position:absolute;right:8px;top:6px;font:900 11px var(--font);background:#1d2a2c;border-radius:6px;padding:3px 7px;color:var(--ink);font-variant-numeric:tabular-nums}
.watch .tt.bad{color:var(--red)} .watch .tt.ok{color:var(--green)}
.watch .rt{position:absolute;left:8px;bottom:6px;font:800 10px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fx button{display:grid;gap:2px;justify-items:center;text-align:center;border:2px solid var(--rule);background:#14201f;border-radius:12px;padding:9px 4px;color:var(--ink);font:inherit;cursor:pointer;transition:transform .08s}
.fx button:active{transform:scale(.94)} .fx button i{font-style:normal;font-size:20px} .fx button b{font-size:12px} .fx button span{font:800 11px var(--font);color:var(--acc)} .fx button:disabled{opacity:.35;pointer-events:none}
.fx button.on{border-color:var(--acc);background:#16363a}
.watchbtn{appearance:none;border:1px dashed var(--acc);background:transparent;color:var(--acc);border-radius:12px;padding:12px;font:800 14px var(--font);cursor:pointer;width:100%}
.watchbtn:active{transform:scale(.97)} .watchbtn:disabled{opacity:.35;pointer-events:none}
.tag{display:inline-block;font:800 10px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:#0e1718;color:var(--muted);margin-right:4px}
.tag.g{color:var(--green)} .tag.a{color:var(--amber)} .tag.r{color:var(--red)}
.report{background:#f4efe3;color:#2a2418;border-radius:6px;padding:12px;display:grid;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.report .rh{font:900 10px var(--font);letter-spacing:.1em;text-transform:uppercase;color:#6b6252} .report .rv{display:flex;justify-content:space-between;font-size:14px} .report .rv b{font-size:16px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .stat3>div{background:#0e1718;border-radius:12px;padding:10px 6px;text-align:center;display:grid;gap:2px} .stat3 b{font-size:20px;font-variant-numeric:tabular-nums} .stat3 span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat3 b.bad{color:var(--red)} .stat3 b.good{color:var(--green)} .stat3 b.warn{color:var(--amber)}
.bars2{display:grid;gap:8px}
.br{display:grid;gap:3px;font-size:12.5px;color:#d6e4e3} .br .t{display:flex;justify-content:space-between;gap:8px} .br .tr{height:10px;border-radius:5px;background:#0e1718;overflow:hidden;position:relative} .br .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;animation:fillb .8s cubic-bezier(.2,1.1,.4,1) both;transform-origin:left}
@keyframes fillb{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tl{display:flex;align-items:center;gap:0;padding:4px 2px}
.tl .n{padding:6px 10px;border-radius:999px;background:#0e1718;border:2px solid var(--rule);font:800 11px var(--font);color:var(--muted);white-space:nowrap}
.tl .n.cur{border-color:var(--gold);color:var(--gold)} .tl .n.done{background:var(--acc);border-color:var(--acc);color:#07201d}
.tl .l{height:3px;flex:1;background:var(--rule)} .tl .l.done{background:var(--acc)}
</style>

<body>
<div id="app"></div>
<script src="../hhl.js?v=17"></script>
<script src="../juice.js?v=2"></script>
<script>
(function () {
'use strict';
var $app = document.getElementById('app');

/* SIM:BEGIN */
/* ---------- the line model ----------
   Five real design-on-the-line problems plus one decoy (a slow new hire) make up six stations.
   Each problem costs time (cyc, seconds per unit) and quality (def, % of units reworked or scrapped).
   Three kinds of fix: change the design (permanent, cheap before tooling release, 8x after), build a jig, or retrain.
   Over the three-year run an unfixed problem costs (cyc + 4 * def) * 3 thousand euros. */
var TAKT = 30, YEARS = 3, POST = 8, DELAY = 6, DEFW = 4, TRAIN_DECAY = 0.6;
var PROB = {
  load:   { order:1, st:'Frame load', ic:'🧩', cyc:4, def:2.5, d:3, j:2, e:{ d:1, j:0.8, t:0.2 },
            watch:'No pins or edges to locate the frame. Each unit is nudged by eye, set down, checked, nudged again.', rt:'re-seats the frame 3 times', why:'Missing locating features' },
  flex:   { order:2, st:'Flex cable and screw', ic:'🔩', cyc:6, def:3, d:4, j:3, e:{ d:1, j:0.5, t:0.1 },
            watch:'The screw sits under the flex cable. Every unit: lift the cable with a fingernail, drive the screw, fold the cable back.', rt:'lifts the cable every time', why:'A screw hidden under the flex' },
  conn:   { order:3, st:'Battery connector', ic:'🔌', cyc:2, def:5, d:2, j:2, e:{ d:1, j:0.3, t:0.4 },
            watch:'The connector fits either way round. The operator squints at the pin-1 mark, and now and then plugs it in reversed.', rt:'checks the mark by eye', why:'A connector that fits both ways' },
  tape:   { order:4, st:'Display adhesive', ic:'🩹', cyc:5, def:1.5, d:1.5, j:2, e:{ d:1, j:0.3, t:0.1 },
            watch:'The tape liner has no pull tab. The operator picks at a corner with a fingernail, then a tweezer, on every unit.', rt:'picks at the liner', why:'No pull tab on the adhesive liner' },
  stack:  { order:5, st:'Button fit', ic:'🔘', cyc:3, def:5, d:6, j:3, e:{ d:1, j:0.4, t:0 },
            watch:'The buttons rub or rattle. The operator presses, bends and shims the frame by feel until it feels right.', rt:'adjusts by feel', why:'A tolerance stack-up in the button area' },
  screws: { order:6, st:'Fastening', ic:'🪛', cyc:5, def:1, d:4, j:3, e:{ d:0.9, j:0.7, t:0.2 },
            watch:'Tiny screws in a deep boss. The magnetic bit loses one every few units, and the operator hunts for it on the bench.', rt:'hunts for dropped screws', why:'Small screws in a deep boss' },
  snap:   { order:7, st:'Back cover', ic:'🧷', cyc:4, def:4, d:5, j:3, e:{ d:1, j:0.6, t:0.2 },
            watch:'The snap-fit is too stiff for fingers. The operator pries it shut with the handle of a screwdriver and leaves scratches.', rt:'pries the cover on', why:'A snap-fit that is too stiff' },
  label:  { order:8, st:'Label and pack', ic:'🏷️', cyc:2, def:3, d:2, j:2, e:{ d:1, j:1, t:0.3 },
            watch:'The label goes on a curved surface and wrinkles. The operator peels it off and tries again.', rt:'peels and re-applies', why:'A label area that is not flat' }
};
var DECOY = { order:9, st:'Final check', ic:'🧑‍🎓', cyc:4, def:0.5, d:3, j:2, e:{ d:0, j:0.1, t:1 }, decoy:true,
              watch:'No wasted motion. Hands go to the right place first time, but slowly: the operator joined three weeks ago.', rt:'is new on the job', why:'A new hire who has not been trained yet' };
var FIX = {
  d:{ ic:'📐', name:'Design', },
  j:{ ic:'🛠️', name:'Jig' },
  t:{ ic:'🎓', name:'Train' }
};
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function makeLine() {
  var ids = shuffle(Object.keys(PROB)).slice(0, 5), L = ids.map(function (k) { return { k:k, p:PROB[k] }; });
  L.push({ k:'decoy', p:DECOY });
  L.sort(function (a, b) { return a.p.order - b.p.order; });
  L.forEach(function (s, i) {
    s.i = i; s.fixes = []; s.sel = null; s.seen = false;
    s.repC = Math.round((26 + s.p.cyc * 0.5 + (Math.random() * 3 - 1.5)) * 10) / 10;
    s.repF = Math.round((99.4 - s.p.def * 0.5 + (Math.random() * 0.6 - 0.3)) * 10) / 10;
  });
  return L;
}
function price(p, f, phase) { return f === 'd' ? (phase === 'ramp' ? p.d * POST : p.d) : f === 'j' ? p.j : 0.5; }
function remain(s, mode) {
  var r = 1; s.fixes.forEach(function (x) { r *= 1 - s.p.e[x.f] * (x.f === 't' && mode === 'year' ? TRAIN_DECAY : 1); });
  return r;
}
function loss(s) { return remain(s, 'year') * (s.p.cyc + s.p.def * DEFW) * YEARS; }
function actual(s) {
  var r = remain(s, 'ramp');
  return { cyc:Math.round((26 + s.p.cyc * r) * 10) / 10, fpy:Math.round((99.3 - s.p.def * r * 0.5) * 10) / 10 };
}
function applySel(L, phase) {
  var c = 0, anyD = false;
  L.forEach(function (s) { if (s.sel) { c += price(s.p, s.sel, phase); if (s.sel === 'd' && phase === 'ramp') anyD = true; s.fixes.push({ f:s.sel, ph:phase }); s.sel = null; } });
  return { cost:c + (anyD ? DELAY : 0) };
}
function scoreOf(G) {
  var l = 0; G.line.forEach(function (s) { l += loss(s); });
  var c = G.cost.pilot + G.cost.ramp + l;
  return { fix:G.cost.pilot + G.cost.ramp, loss:l, costs:c, total:Math.max(0, Math.round(1000 - c * 3.0)) };
}
/* SIM:END */

/* ---------- content ---------- */
var NAMES = ['Hongtai Electronics', 'Dongyue Smart Manufacturing', 'Xinlong Technology', 'Meijie Intelligent'];
var G = null;
var store = { get:function (k, d) { try { var v = localStorage.getItem('hhl.ch109.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set:function (k, v) { try { localStorage.setItem('hhl.ch109.' + k, JSON.stringify(v)); } catch (e) {} } };
function fmt(n) { return Number(n).toLocaleString('en'); }
function later(ms, fn) { setTimeout(function () { try { fn(); } catch (e) {} }, J.reduce ? 0 : ms); }
function el(h, keep) { $app.classList.toggle('still', !!keep); $app.innerHTML = h; if (!keep) window.scrollTo(0, 0); }
function $q(s) { return $app.querySelector(s); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function topbar(back) { return '<div class="top">' + (back ? '<a class="back" href="../">← Games</a>' : '<span></span>') + J.muteBtn() + '</div>'; }
function k$(n) { return '€' + (Math.round(n * 10) / 10) + 'k'; }
function newGame() { G = { name:pick(NAMES), line:makeLine(), phase:'title', slots:0, cost:{ pilot:0, ramp:0 } }; }

/* ---------- visuals ---------- */
function benchSvg() {
  return '<div class="bench"><div class="lbl">ASSEMBLY LINE · TAKT ' + TAKT + ' s</div><svg viewBox="0 0 300 112" aria-hidden="true">' +
    '<rect x="0" y="84" width="300" height="28" fill="#2c4043"/>' +
    [20, 70, 120, 170, 220].map(function (x, i) { return '<rect x="' + x + '" y="62" width="40" height="22" rx="3" fill="#3b5359"/><rect x="' + (x + 8) + '" y="54" width="24" height="8" rx="2" fill="#1f8a4c"/><text x="' + (x + 20) + '" y="78" font-size="9" text-anchor="middle" fill="#93a9a8" font-family="sans-serif">' + (i + 1) + '</text>'; }).join('') +
    '<g font-size="20"><text x="30" y="44">🧑</text><text x="80" y="44">🧑</text><text x="130" y="44">🧑</text><text x="180" y="44">🧑</text><text x="230" y="44">🧑</text></g>' +
    '<rect x="266" y="62" width="26" height="22" rx="3" fill="#8a5a1f"/><text x="279" y="58" font-size="11" text-anchor="middle" fill="#ffd9a8" font-family="sans-serif">📦</text>' +
    '</svg></div>';
}
function watchSvg(s) {
  var a = actual(s);
  var retries = s.p.decoy ? 0 : Math.max(2, Math.round(s.p.cyc / 1.5));
  return '<div class="watch"><svg viewBox="0 0 300 84" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="60" width="300" height="24" fill="#23363a"/><rect x="120" y="42" width="70" height="18" rx="4" fill="#1f8a4c" stroke="#14633a" stroke-width="2"/><rect x="132" y="47" width="14" height="8" rx="1.5" fill="#1b1f23"/><g fill="#e8c547"><rect x="156" y="46" width="2" height="10"/><rect x="161" y="46" width="2" height="10"/><rect x="166" y="46" width="2" height="10"/></g></svg>' +
    '<div class="hand" style="--n:' + (s.p.decoy ? 1 : retries) + '">✋</div>' +
    '<div class="tt ' + (a.cyc > 29 ? 'bad' : 'ok') + '">⏱ ' + a.cyc + ' s</div><div class="rt">' + (s.p.decoy ? 'smooth, but slow' : s.p.rt) + '</div></div>';
}

/* ---------- screens ---------- */
function screenTitle() {
  el(topbar(true) + '<div class="card">' + benchSvg() +
   '<h3>Chapter 9 · The Hardest Factory Lessons</h3><h1>Watch the <span>Hands</span></h1>' +
   '<p>Every hard-to-assemble product tells you so on the line, and the line report will not. <b>The design is on the line, whether or not anyone writes it down.</b></p>' +
   '<div class="plain"><b>In plain English:</b> when a part is awkward to put together, operators invent workarounds. The workarounds hide inside the station time and the quality numbers, so the report says everything is fine. You find the design flaws by standing at the line and watching hands. And you find them while the tooling is still cheap, or you pay for them for years. <b>Goal:</b> find the real problems, fix each one the right way, and do it before the tools are cut.</div>' +
   '<ul style="margin:0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.55"><li><b>Six stations</b> on a pilot line. You can watch only four.</li><li><b>Fix each one</b>: change the design, build a jig, or retrain. The right fix differs.</li><li><b>Tooling is released soon.</b> After that, a design change costs eight times as much.</li></ul>' +
   '<button class="btn" data-a="start">Walk the pilot line</button><p class="small" style="text-align:center">Best ' + fmt(store.get('best', 0)) + ' · The factory is fictional.</p></div>');
}

function screenBrief() {
  G.phase = 'brief';
  el(topbar(false) + '<div class="card"><h3>' + G.name + ' · pilot build report</h3><h2>"All stations at takt"</h2>' + benchSvg() +
   '<div class="report"><div class="rh">Pilot line report · your product</div><div class="rv"><span>Stations over takt</span><b>0 of 6</b></div><div class="rv"><span>Pilot yield (after rework)</span><b>98.1%</b></div><div class="rv"><span>Operators\' comments</span><b>"fine"</b></div><div class="rv"><span>Tooling release</span><b>in 2 weeks</b></div></div>' +
   '<p>Takt is ' + TAKT + ' seconds. Every station is reported under it, and every operator says the product is fine. That is exactly what operators say when they have already learned the tricks.</p>' +
   '<div class="note"><b>Your plan</b>You have time to <b>watch four</b> of the six stations. Look for wasted motion: re-tries, pries, squints, hunts. Then decide what kind of fix each flaw deserves.</div>' +
   '<button class="btn" data-a="pilot">Walk the line</button></div>');
}

function stnCard(s, phase) {
  var a = actual(s), fixedN = s.fixes.length, ph = phase;
  var head = '<div class="h"><div class="n">' + (s.i + 1) + '</div><b>' + s.p.ic + ' ' + s.p.st + '</b><div class="rp">' + (phase === 'ramp' ? 'cycle <em>' + a.cyc + ' s</em><br>yield ' + a.fpy + '%' : 'reported ' + s.repC + ' s<br>yield ' + s.repF + '%') + '</div></div>';
  var body = '';
  if (s.seen && ph === 'ramp' && fixedN && remain(s, 'ramp') < 0.15) {
    body += '<p class="small" style="color:#d6e4e3">✓ Solved in the pilot. The workaround is gone and the station runs at ' + a.cyc + ' s.</p><div>' + s.fixes.map(function (x) { return '<span class="tag g">' + FIX[x.f].name + ' (' + x.ph + ')</span>'; }).join('') + '</div>';
  } else if (s.seen) {
    body += watchSvg(s) + '<p class="small" style="color:#d6e4e3">' + s.p.watch + '</p>';
    var cur = s.sel, opt = function (f) {
      var c = price(s.p, f, ph), lbl = f === 'd' ? (ph === 'ramp' ? '€' + c + 'k tool change' : '€' + c + 'k') : '€' + c + 'k';
      return '<button data-a="fx" data-i="' + s.i + '" data-f="' + f + '" class="' + (cur === f ? 'on' : '') + '"><i>' + FIX[f].ic + '</i><b>' + FIX[f].name + '</b><span>' + lbl + '</span></button>';
    };
    body += '<div class="fx">' + opt('d') + opt('j') + opt('t') + '</div>';
    if (fixedN) body += '<div>' + s.fixes.map(function (x) { return '<span class="tag g">' + FIX[x.f].name + ' (' + x.ph + ')</span>'; }).join('') + '</div>';
  } else {
    body += '<button class="watchbtn" data-a="watch" data-i="' + s.i + '"' + (G.slots ? '' : ' disabled') + '>👀 Watch the hands · 1 hour</button>';
  }
  return '<div class="stn' + (s.seen ? ' seen' : '') + (fixedN ? ' fixed' : '') + '" id="s' + s.i + '">' + head + body + '</div>';
}
function selCost(phase) {
  var c = 0, anyD = false; G.line.forEach(function (s) { if (s.sel) { c += price(s.p, s.sel, phase); if (s.sel === 'd' && phase === 'ramp') anyD = true; } });
  return c + (anyD ? DELAY : 0);
}
function screenLine(phase) {
  G.phase = phase; var ramp = phase === 'ramp', left = G.slots;
  var total = ramp ? 2 : 4;
  el(topbar(false) + '<div class="card"><h3>' + (ramp ? 'Ramp · tooling released' : 'Pilot line · before tooling release') + '</h3><h2>' + (ramp ? 'The line data is real now' : 'Watch, then decide') + '</h2>' +
   '<div class="tl"><div class="n ' + (ramp ? 'done' : 'cur') + '">Pilot</div><div class="l ' + (ramp ? 'done' : '') + '"></div><div class="n ' + (ramp ? 'cur' : '') + '">Ramp</div><div class="l"></div><div class="n">3 years</div></div>' +
   (ramp ? '<div class="note warn"><b>Late</b>The tools are cut. A design change is now a tool modification: eight times the price, plus a three-week delay. Jigs and training cost the same as before. Fixes from the pilot are already in the numbers below.</div>' : '<div class="note"><b>Before tooling release</b>A design change costs its list price. Watch a station to see what the operator is really doing, then pick a fix. You can only fix what you have watched.</div>') +
   '<div class="pts"><b>Hours to watch</b><div class="pp">' + Array.apply(null, Array(total)).map(function (_, i) { return '<i class="' + (i < left ? '' : 'off') + '"></i>'; }).join('') + '</div><span>' + left + ' left</span></div>' +
   G.line.map(function (s) { return stnCard(s, phase); }).join('') +
   '<div class="stat3"><div><b>' + k$(selCost(phase)) + '</b><span>to spend now</span></div><div><b>' + k$(G.cost.pilot + G.cost.ramp) + '</b><span>spent so far</span></div><div><b>' + G.line.filter(function (s) { return s.seen; }).length + '/6</b><span>watched</span></div></div>' +
   '<button class="btn" data-a="' + (ramp ? 'year' : 'torelease') + '">' + (ramp ? 'Run three years of production' : 'Confirm fixes and release the tooling') + '</button></div>', true);
}

function screenYear() {
  G.phase = 'year'; var sc = scoreOf(G);
  var rows = G.line.map(function (s) { var l = loss(s), full = (s.p.cyc + s.p.def * DEFW) * YEARS; return '<div class="br"><div class="t"><b>' + s.p.ic + ' ' + s.p.st + '</b><span>' + (s.p.decoy ? 'new hire' : s.p.why) + ' · ' + (l < 1 ? 'solved' : k$(l) + ' lost') + '</span></div><div class="tr"><i style="width:' + Math.max(3, Math.min(100, Math.round(100 * l / 75))) + '%;background:' + (l < 1 ? 'var(--green)' : 'var(--amber)') + '"></i></div></div>'; }).join('');
  el(topbar(false) + '<div class="card"><h3>Three years of production</h3><h2>' + (sc.loss < 20 ? 'The line runs the way the design intended' : sc.loss < 80 ? 'A few stations carry the cost' : 'The line pays for the design, every day') + '</h2>' + benchSvg() +
   '<p>Every second of wasted motion and every reworked unit now repeats at volume. These are the costs of what was left in the design, or fixed the wrong way.</p>' +
   '<div class="bars2" id="rws">' + rows + '</div>' +
   '<div class="cost" id="cst">−€0k</div><button class="btn" data-a="result">See the result</button></div>');
  if (sc.loss > 1) { J.sfx('alarm'); J.count($q('#cst'), 0, sc.loss, 900, function (v) { return '−€' + Math.round(v) + 'k'; }); } else { J.sfx('good'); }
  J.stagger($app.querySelectorAll('.br'), 70);
}

function screenResult() {
  G.phase = 'result';
  var sc = scoreOf(G), best = store.get('best', 0), nb = sc.total > best;
  if (nb) store.set('best', sc.total);
  try { HHL.submit(109, sc.total); } catch (e) {}
  var stamp = sc.total >= 800 ? 'pass' : sc.total >= 500 ? 'warn' : 'fail';
  var txt = sc.total >= 800 ? 'THE DESIGN WAS FIXED ON TIME' : sc.total >= 500 ? 'FOUND SOME, TOO LATE' : 'THE HANDS TOLD THE TRUTH';
  var unseen = G.line.filter(function (s) { return !s.seen; }).length, late = 0, wrong = 0, wasted = 0;
  G.line.forEach(function (s) { s.fixes.forEach(function (x) { if (x.ph === 'ramp' && x.f === 'd') late++; if (s.p.e[x.f] === 0) wasted++; else if (s.p.e[x.f] < 0.5 && s.fixes.length === 1) wrong++; }); });
  var best1 = G.line.map(function (s) { return { s:s, fx:['d', 'j', 't'].map(function (f) { return { f:f, v:price(s.p, f, 'pilot') + (1 - s.p.e[f] * (f === 't' ? TRAIN_DECAY : 1)) * (s.p.cyc + s.p.def * DEFW) * YEARS }; }).sort(function (a, b) { return a.v - b.v; })[0] }; });
  var rows = best1.map(function (b) { return '<div class="reveal"><b>' + b.s.p.ic + ' ' + b.s.p.st + '</b><span>' + (b.s.p.decoy ? 'Problem: ' + b.s.p.why : 'Flaw: ' + b.s.p.why) + '. Best fix: <b>' + FIX[b.fx.f].name.toLowerCase() + '</b>' + (b.s.fixes.length ? ' · you chose ' + b.s.fixes.map(function (x) { return FIX[x.f].name.toLowerCase() + (x.ph === 'ramp' ? ' (late)' : ''); }).join(' + ') : (b.s.seen ? ' · you left it' : ' · never watched')) + '</span></div>'; }).join('');
  el(topbar(false) + '<div class="card"><h3>Final accounts</h3><div class="stamp ' + stamp + '" id="stp">' + txt + '</div><div class="bigs" id="bigs">0</div>' +
   (nb ? '<p style="text-align:center;color:var(--acc);font-weight:800" class="j-pulse">New best!</p>' : '<p class="small" style="text-align:center">Best ' + fmt(Math.max(best, sc.total)) + '</p>') +
   '<div class="lines" id="led"><div><span>Fixes before tooling release</span><em class="neg">−' + k$(G.cost.pilot) + '</em></div><div><span>Fixes after release (late)</span><em class="neg">−' + k$(G.cost.ramp) + '</em></div><div><span>Three years of what remained</span><em class="neg">−' + k$(sc.loss) + '</em></div><div><span>Total cost</span><em class="neg">−' + k$(sc.costs) + '</em></div></div>' +
   '<div class="note warn"><b>What the line report hid</b>' + (unseen ? unseen + ' station' + (unseen === 1 ? ' was' : 's were') + ' never watched. ' : 'You watched every station you needed to. ') + (late ? late + ' design change' + (late === 1 ? '' : 's') + ' came after tooling release at eight times the price. ' : '') + (wasted ? wasted + ' fix' + (wasted === 1 ? '' : 'es') + ' did nothing, because the problem was not in the design (or not in the training). ' : '') + (wrong ? wrong + ' problem' + (wrong === 1 ? ' was' : 's were') + ' patched with a fix that only half worked. ' : '') + '</div>' +
   '<h3>The stations, as they really were</h3><div>' + rows + '</div>' +
   '<div class="lesson">The cheapest time to fix a design problem is when you watch the first pilot, before the tools are cut. Go and stand at the line, watch the hands, and ask what each workaround is telling you. A jig fixes a fixture problem, a design change fixes a design problem, and training fixes only people.</div>' +
   HHL.next(109) +
   '<div class="row"><button class="btn" data-a="again">Walk another line</button><button class="btn ghost" data-a="menu">Menu</button></div></div>');
  J.stamp($q('#stp'), stamp); J.count($q('#bigs'), 0, sc.total, 1200);
  later(1300, function () { if (stamp === 'pass') { J.confetti(); J.sfx('win'); } else J.sfx(stamp === 'warn' ? 'ok' : 'lose'); });
  J.stagger($app.querySelectorAll('#led div, .reveal'), 60);
}

/* ---------- events ---------- */
$app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  var a = b.dataset.a;
  switch (a) {
    case 'start': newGame(); screenBrief(); break;
    case 'pilot': G.slots = 4; screenLine('pilot'); break;
    case 'watch': { var s = G.line[Number(b.dataset.i)]; if (!G.slots || s.seen) break; G.slots--; s.seen = true; J.sfx('scan'); screenLine(G.phase); var c = $q('#s' + s.i); if (c) c.scrollIntoView({ block:'nearest' }); break; }
    case 'fx': { var s2 = G.line[Number(b.dataset.i)], f = b.dataset.f; s2.sel = s2.sel === f ? null : f; J.sfx(s2.sel ? 'select' : 'cancel'); screenLine(G.phase); break; }
    case 'torelease': { var r = applySel(G.line, 'pilot'); G.cost.pilot += r.cost; J.sfx('confirm'); G.slots = 2; screenLine('ramp'); break; }
    case 'year': { var r2 = applySel(G.line, 'ramp'); G.cost.ramp += r2.cost; J.sfx('confirm'); screenYear(); break; }
    case 'result': screenResult(); break;
    case 'again': newGame(); screenBrief(); break;
    case 'menu': screenTitle(); break;
  }
});
newGame(); screenTitle();
window.__f9 = { G:function () { return G; }, score:function () { return scoreOf(G); } };
})();
</script>
