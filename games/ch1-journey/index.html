<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hold the Gate">
<meta name="theme-color" content="#14181c">
<title>Hold the Gate</title>
<style>
:root{
  --bg:#14181c; --ink:#eef2f4; --muted:#93a1ab; --panel:#1d2329; --rule:#2d363e;
  --acc:#5ab0ff; --red:#ff5a4e; --green:#3ddc84; --amber:#ff9f43;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.hudbtns{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);display:flex;gap:6px;z-index:5}
.hudbtns button{width:44px;height:44px;border-radius:12px;border:1px solid var(--rule);background:rgba(29,35,41,.88);color:var(--ink);font:600 16px/1 var(--font);display:grid;place-items:center;padding:0;transition:transform .08s}
.hudbtns button:active{transform:scale(.88)}
#ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px);background:rgba(10,13,16,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow-y:auto;touch-action:pan-y}
#ov[hidden]{display:none}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);z-index:11;color:var(--muted);text-decoration:none;font:600 14px/1 var(--font);padding:14px 12px;border-radius:10px}
.back:active{color:var(--ink);background:#1d2329}
.card{width:min(440px,100%);background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:22px 20px 20px;display:grid;gap:14px;animation:pop .32s cubic-bezier(.2,1.4,.4,1) both;margin:auto}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
.card h1{margin:0;font-size:36px;line-height:1.02;letter-spacing:-.01em;font-weight:800}
.card h1 span{color:var(--acc)}
.card h2{margin:0;font-size:24px;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.card p b{color:var(--ink);font-weight:600}
.card a{color:var(--acc)}
.eyebrow{font:700 11px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.from{font-size:13px!important}
.curve{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:96px;padding:0 2px}
.curve div{display:grid;gap:4px;align-items:end;height:100%;grid-template-rows:1fr auto auto}
.curve i{display:block;border-radius:6px 6px 2px 2px;background:var(--acc);transform-origin:bottom;animation:rise .7s cubic-bezier(.2,1.3,.4,1) both;align-self:end}
.curve b{font:800 12px/1 var(--font);text-align:center;color:var(--ink)}
.curve span{font:600 10px/1 var(--font);text-align:center;color:var(--muted)}
@keyframes rise{from{transform:scaleY(0)}}
.btn{appearance:none;border:0;border-radius:14px;padding:16px 18px;font:800 17px/1 var(--font);background:var(--acc);color:#0d1620;width:100%;min-height:50px;transition:transform .08s,filter .08s}
.btn:active{transform:scale(.96);filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:700}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.small{font-size:12.5px!important}
.stamp{justify-self:center;font:900 28px/1 var(--font);letter-spacing:.06em;padding:8px 16px;border:4px solid currentColor;border-radius:8px;transform:rotate(-6deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) .12s both;text-align:center}
.stamp.pass{color:var(--green)} .stamp.fail{color:var(--red)} .stamp.warn{color:var(--amber)}
@keyframes stamp{0%{transform:scale(2.6) rotate(-14deg);opacity:0}60%{transform:scale(.9) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#161b20;border-radius:10px;padding:10px 6px;text-align:center;display:grid;gap:3px}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}
.stat b.bad{color:var(--red)} .stat b.good{color:var(--green)}
.stat span{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.check{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.check li{display:grid;grid-template-columns:20px 1fr;gap:6px;font-size:13px;line-height:1.35;color:var(--muted);animation:pop .3s ease-out both}
.check li em{font-style:normal;font-weight:900;color:var(--green)}
.check li.no em{color:var(--red)}
.check li.no{color:var(--ink)}
.lesson{border-left:3px solid var(--acc);padding:6px 0 6px 12px;font-size:14px!important;color:var(--ink)!important}
.rows{display:grid;gap:6px}
.r{background:#161b20;border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.r b{color:var(--ink)} .r .bad{color:var(--red);font-weight:700} .r .good{color:var(--green);font-weight:700}
.outs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.out{background:#161b20;border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.out em{font-style:normal;font-weight:900;font-size:15px;color:var(--green)}
.out.no em{color:var(--red)} .out.no{color:var(--ink)}
.big{font:900 46px/1 var(--font);font-variant-numeric:tabular-nums;text-align:center}
.newbest{color:var(--acc);text-align:center;font-weight:800;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.foot{text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.hudbtns[hidden]{display:none!important}
#ov{padding-top:calc(env(safe-area-inset-top,0px) + 48px) !important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<div class="hudbtns" id="hudbtns" hidden>
  <button id="btnMute" aria-label="Sound on or off">♪</button>
  <button id="btnPause" aria-label="Pause">❚❚</button>
</div>
<div id="ov"></div>

<script src="../hhl.js?v=8"></script>
<script>
'use strict';
(function () {
// ---------- utilities ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('hhl.ch1.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hhl.ch1.' + k, JSON.stringify(v)); } catch (e) {} }
};
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const FONT = '-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif';
const ACC = '#5ab0ff';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' })[c]);
function fmtE(n) {
  const a = Math.abs(n), s = n < 0 ? '−€' : '€';
  if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + 'M';
  if (a >= 1e3) return s + (a >= 1e4 ? Math.round(a / 1e3) : (Math.round(a / 100) / 10)) + 'k';
  return s + Math.round(a);
}
function nice(v) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, v))) - 1); return Math.round(v / p) * p; }

// ---------- crash guard ----------
let crashed = false;
function crash(msg) {
  if (crashed) return; crashed = true;
  try {
    const ov = $('ov'); ov.hidden = false;
    ov.innerHTML = '<div class="card"><div class="eyebrow">Programme halted</div><h2>Something went wrong</h2><p class="small">' +
      String(msg).replace(/[<>&]/g, '') + '</p><button class="btn" onclick="location.reload()">Restart</button></div>';
  } catch (e) {}
}
window.addEventListener('error', e => crash(e.message || 'Unknown error'));
window.addEventListener('unhandledrejection', e => crash((e.reason && e.reason.message) || 'Unknown error'));

// ---------- sound ----------
const Sfx = {
  ctx: null, master: null, noiseBuf: null, muted: store.get('muted', false), lastTick: 0,
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.5;
        this.master.connect(this.ctx.destination);
        const len = Math.floor(this.ctx.sampleRate * 0.5);
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const s = this.ctx.createBufferSource(); s.buffer = this.ctx.createBuffer(1, 1, 22050); s.connect(this.ctx.destination); s.start(0);
      }
      if (this.ctx.state !== 'running') this.ctx.resume();
    } catch (e) {}
  },
  setMuted(m) { this.muted = m; store.set('muted', m); try { if (this.master) this.master.gain.value = m ? 0 : 0.5; } catch (e) {} },
  ok() { return this.ctx && !this.muted && this.ctx.state === 'running'; },
  tone(f, dur, type, vol, slide, delay) {
    if (!this.ok()) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  },
  noise(dur, vol, freq, delay, type) {
    if (!this.ok()) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
      const f = this.ctx.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq || 1200;
      const g = this.ctx.createGain(); g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.03);
    } catch (e) {}
  },
  whoosh(dir) { this.noise(0.16, 0.16, dir > 0 ? 2600 : 1400, 0, 'bandpass'); this.tone(dir > 0 ? 520 : 300, 0.08, 'triangle', 0.06, dir > 0 ? 780 : 200); },
  fix() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.12, null, i * 0.055)); this.noise(0.2, 0.05, 6000, 0.2); },
  log() { this.tone(180, 0.12, 'square', 0.1, 120); this.noise(0.06, 0.12, 900); },
  land() { this.tone(240, 0.06, 'triangle', 0.08, 160); },
  coin(big) { if (big) { this.tone(160, 0.3, 'sawtooth', 0.12, 60); this.noise(0.25, 0.15, 500); } else { this.tone(1320, 0.05, 'square', 0.05); this.tone(1760, 0.07, 'square', 0.04, null, 0.04); } },
  alarm() { for (let i = 0; i < 3; i++) this.tone(880, 0.09, 'square', 0.09, 660, i * 0.13); this.noise(0.3, 0.12, 700); },
  reveal() { this.tone(660, 0.1, 'triangle', 0.1); this.tone(990, 0.14, 'triangle', 0.1, null, 0.08); },
  stamp() { this.noise(0.14, 0.4, 400); this.tone(90, 0.24, 'sine', 0.35, 50); },
  clean() { [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.26, 'triangle', 0.12, null, i * 0.08)); this.noise(0.4, 0.05, 7000, 0.35); },
  sched() { this.tone(330, 0.2, 'square', 0.08); this.tone(311, 0.32, 'square', 0.08, null, 0.18); },
  tick() { const n = performance.now(); if (n - this.lastTick < 45) return; this.lastTick = n; this.tone(1500, 0.025, 'square', 0.035); },
  click() { this.tone(900, 0.04, 'square', 0.05); },
  deal() { this.noise(0.05, 0.08, 3000, 0, 'highpass'); },
  phase() { this.tone(330, 0.16, 'square', 0.09); this.tone(494, 0.28, 'square', 0.09, null, 0.14); },
  over() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.3, 'square', 0.1, null, i * 0.16)); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.13, null, i * 0.1)); }
};

// ---------- canvas + layout ----------
const cvs = $('game'), ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;
const SAFE = { t: 0, r: 0, b: 0, l: 0 };
const L = {};
function readSafe() {
  try {
    const cs = getComputedStyle($('safe'));
    SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.r = parseFloat(cs.paddingRight) || 0;
    SAFE.b = parseFloat(cs.paddingBottom) || 0; SAFE.l = parseFloat(cs.paddingLeft) || 0;
  } catch (e) {}
}
function resize() {
  readSafe();
  const vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth); H = Math.round(vv ? vv.height : window.innerHeight);
  if (W < 10 || H < 10) { W = window.innerWidth; H = window.innerHeight; }
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  const top = SAFE.t + 8, btnH = 60, pileH = 58;
  L.land = W > H * 1.15;
  if (!L.land) {
    const x = SAFE.l + 12, w = W - SAFE.l - SAFE.r - 24;
    L.hud = { x, y: top, w: w - 100 };
    L.meters = { x, y: top + 54, w, h: 42 };
    L.track = { x, y: top + 104, w, h: 40 };
    L.pile = { x, y: H - SAFE.b - 8 - pileH, w, h: pileH };
    const by = L.pile.y - 12 - btnH;
    const y0 = L.track.y + L.track.h + 16, y1 = by - 14;
    const ch = Math.max(140, Math.min(y1 - y0, 430));
    const cw = Math.min(w, 360, ch * 0.86);
    L.card = { cx: W / 2, cy: y0 + (y1 - y0) / 2, w: cw, h: Math.min(ch, cw * 1.3) };
    const bw = Math.max(cw, Math.min(w, 380));
    L.btnL = { x: W / 2 - bw / 2, y: by, w: bw / 2 - 5, h: btnH };
    L.btnR = { x: W / 2 + 5, y: by, w: bw / 2 - 5, h: btnH };
  } else {
    const x = SAFE.l + 12, colW = Math.min(360, W * 0.42);
    L.hud = { x, y: top, w: colW };
    L.meters = { x, y: top + 50, w: colW, h: 42 };
    L.track = { x, y: top + 100, w: colW, h: 40 };
    L.pile = { x, y: Math.min(top + 156, H - SAFE.b - 8 - pileH), w: colW, h: pileH };
    const rx0 = x + colW + 18, rx1 = W - SAFE.r - 12;
    const by = H - SAFE.b - 8 - btnH;
    const y0 = top + 50, y1 = by - 10;
    const ch = Math.max(120, y1 - y0);
    const cw = Math.min(rx1 - rx0, 400, Math.max(ch * 1.25, 260));
    L.card = { cx: (rx0 + rx1) / 2, cy: (y0 + y1) / 2, w: cw, h: ch };
    const bw = Math.min(rx1 - rx0, 420);
    L.btnL = { x: L.card.cx - bw / 2, y: by, w: bw / 2 - 5, h: btnH };
    L.btnR = { x: L.card.cx + 5, y: by, w: bw / 2 - 5, h: btnH };
  }
  const mw = L.meters.w / 3;
  L.mCash = { x: L.meters.x + mw * 0.5, y: L.meters.y + 10 };
  L.mPat = { x: L.meters.x + mw * 1.5, y: L.meters.y + 10 };
  L.mWeek = { x: L.meters.x + mw * 2.5, y: L.meters.y + 10 };
  wrapCache = {};
}
let resizeTimer = 0;
function scheduleResize() { resize(); clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 250); }
window.addEventListener('resize', scheduleResize);
window.addEventListener('orientationchange', () => setTimeout(resize, 300));
if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);

// ---------- game data (from Chapter 1) ----------
const PH = [
  { key: 'PROTO', short: 'Proto', name: 'Prototyping', dur: '26 to 52 weeks', base: 34, mult: '×1', range: [500, 2000], fixW: 1, gate: 'DFM handoff review' },
  { key: 'SET-UP', short: 'Set-up', name: 'Project Set-up', dur: '4 weeks', base: 4, mult: '×1', range: [500, 2000], fixW: 1, gate: 'Project kickoff meeting' },
  { key: 'EVT', short: 'EVT', name: 'Engineering Validation Test', dur: '12 to 16 weeks', base: 14, mult: '×5–10', range: [5000, 20000], fixW: 2, gate: 'EVT Meeting' },
  { key: 'DVT', short: 'DVT', name: 'Design Validation Test', dur: '8 to 12 weeks', base: 10, mult: '×20–50', range: [50000, 200000], fixW: 3, gate: 'DVT Meeting' },
  { key: 'PVT', short: 'PVT', name: 'Production Validation Test', dur: '6 to 8 weeks', base: 7, mult: '×50–100', range: [100000, 500000], fixW: 4, gate: 'PVT Meeting' },
  { key: 'MP', short: 'MP', name: 'Mass Production', dur: '4 to 6 week ramp', base: 5, mult: '×100–500', range: [500000, 5000000], fixW: 6, gate: '' }
];
const TOTAL_BASE = PH.reduce((a, p) => a + p.base, 0);
const CUM = []; PH.reduce((a, p, i) => (CUM[i] = a + p.base), 0);
const START_CASH = 2000000, BURN = 12000, PLAN20 = 87, PLAN12 = 52;
function costAt(p, sev) { const r = PH[Math.min(5, p)].range; return nice(r[0] * Math.pow(r[1] / r[0], clamp(sev, 0, 1))); }
const nextP = p => p === 0 ? 2 : Math.min(5, p + 1);
function plannedAt(p) { return Math.round(CUM[p] * S.plan / TOTAL_BASE); }

const WHO = {
  HW: { name: 'Hardware lead', col: '#3ddc84' }, SW: { name: 'Software lead', col: '#b48cff' },
  TEST: { name: 'Testing lead', col: '#ffd166' }, MECH: { name: 'Mechanical lead', col: '#ff9f5a' },
  MFG: { name: 'Manufacturing lead', col: '#5ab0ff' }, LAB: { name: 'Certification lab', col: '#7fe3e0' },
  SUP: { name: 'Supply chain', col: '#c8d2d9' }, CEO: { name: 'CEO', col: '#eef2f4' },
  BRD: { name: 'The board', col: '#ff5a4e' }, MKT: { name: 'Marketing', col: '#ff7ac6' },
  FAC: { name: 'Factory', col: '#9be3b3' }, CUS: { name: 'Customers', col: '#ff3b30' }, PM: { name: 'You, programme lead', col: ACC }
};
const KIND = {
  issue: { tag: 'ISSUE', col: '#ff5a4e' }, change: { tag: 'CHANGE REQUEST', col: '#ff7ac6' },
  invest: { tag: 'DECISION', col: ACC }, pressure: { tag: 'PRESSURE', col: '#ff9f43' },
  handoff: { tag: 'HANDOFF', col: '#f5c518' }, plan: { tag: 'PLANNING', col: ACC },
  gate: { tag: 'GATE REVIEW', col: ACC }, surface: { tag: 'IT SURFACED', col: '#ff5a4e' },
  resurface: { tag: 'STILL OPEN', col: '#ff9f43' }, field: { tag: 'FIELD PROBLEM', col: '#ff3b30' }, final: { tag: 'MASS PRODUCTION', col: '#3ddc84' }
};
const OUTS = { eng: 'Validated design', mfg: 'Validated production process', reg: 'Certification package', sup: 'Qualified supply chain' };

const POOL = [
  [ // prototyping
    { name: 'Brown-out on the bench', team: 'HW', out: 'eng', text: 'The prototype resets when the LED hits full brightness. The regulator is undersized.' },
    { name: 'Flash is 90% full', team: 'SW', out: 'eng', text: 'Firmware already fills 90% of the MCU flash. A bigger part means a new footprint.' },

function investFix(keys, base, foundLabel, free) {

function buildDeck(p) {
  const d = [];
  const pool = POOL[p] ? shuffle(POOL[p].slice()) : [];
  if (p === 0) {
    d.push(() => planCard());
    d.push(...shuffle([newIssueCard(pool[0]), newIssueCard(pool[1]), changeCard(pick(CHANGES[0])), () => platformCard()]));
    d.push(handoffCard(0));
  } else if (p === 1) {
    d.push(...shuffle([mechCard(), certCard(), () => criteriaCard()]));
  } else if (p === 2) {
    d.push(...shuffle([newIssueCard(pool[0]), newIssueCard(pool[1]), mfgCard(), interfaceCard(), () => demoCard()]));
    d.push(handoffCard(2));
  } else if (p === 3) {
    const mid = [newIssueCard(S.mechFunded ? pool[0] : FAI), changeCard(pick(CHANGES[3])), () => certSlotCard()];
    S.issues.filter(i => i.state === 'hidden' && i.surf === 3).forEach(i => mid.push(surfaceCard(i)));
    openOf().slice(0, 2).forEach(i => mid.push(resurfaceCard(i)));
    d.push(...shuffle(mid));
  } else if (p === 4) {
    const mid = [bomCard(), () => factoryCard()];
    if (S.gateRes[3] === 'sched') mid.push(newIssueCard(HALT));
    if (!S.mfgJoined) mid.push(newIssueCard(YIELD));
    S.issues.filter(i => i.state === 'hidden' && i.surf === 4).forEach(i => mid.push(surfaceCard(i)));
    openOf().slice(0, 2).forEach(i => mid.push(resurfaceCard(i)));
    d.push(...shuffle(mid));
  } else if (p === 5) {
    S.issues.filter(i => i.state === 'open' || i.state === 'hidden').forEach(i => d.push(fieldCard(i)));
    d.push(finalCard());
    return d;
  }
  d.push(gateCard());
  return d;
}

  else if (c.kind === 'handoff' && !S.seen.handoff) { key = 'handoff'; text = 'Hidden risks only surface if someone writes them down'; }
  else if (c.kind === 'gate' && !S.seen.gate) { key = 'gate'; text = c.single ? 'No open issues: a clean pass' : 'Hold: pay today\'s price. Pass: pay the next one'; }

const inRect = (x, y, r, pad) => x >= r.x - (pad || 0) && x <= r.x + r.w + (pad || 0) && y >= r.y - (pad || 0) && y <= r.y + r.h + (pad || 0);

}

// ---------- card scenes: make the development world visible ----------
function drawLamp(lx, by, s, o) {

function drawScene(c, x, y, w, h) {
