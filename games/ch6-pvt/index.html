<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breaking Point">
<meta name="theme-color" content="#14181c">
<title>Breaking Point</title>
<style>
:root{
  --bg:#14181c; --ink:#eef2f4; --muted:#93a1ab; --panel:#1d2329; --rule:#2d363e;
  --acc:#ff5a8a; --red:#ff5a4e; --green:#3ddc84; --amber:#f5c518; --blue:#5ab0ff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:6}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.hudbtns{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);display:flex;gap:6px;z-index:5}
.hudbtns[hidden]{display:none}
.hudbtns button{width:44px;height:44px;border-radius:12px;border:1px solid var(--rule);background:rgba(29,35,41,.88);color:var(--ink);font:600 16px/1 var(--font);display:grid;place-items:center;padding:0;transition:transform .08s}
.hudbtns button:active{transform:scale(.88)}
#panel{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:4;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:6px calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 18px) calc(env(safe-area-inset-left,0px) + 12px)}
#panel[hidden]{display:none}
#ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px);background:rgba(10,13,16,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow-y:auto;touch-action:pan-y}
#ov[hidden]{display:none}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:calc(env(safe-area-inset-left,0px) + 8px);color:var(--muted);text-decoration:none;font:700 14px/1 var(--font);padding:14px 10px;z-index:11}
.back:active{color:var(--ink)}
.card{width:min(460px,100%);background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:22px 20px 20px;display:grid;gap:14px;animation:pop .32s cubic-bezier(.2,1.4,.4,1) both;margin:auto}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
.card h1{margin:0;font-size:36px;line-height:1.02;letter-spacing:-.01em;font-weight:800}
.card h1 span,.wrap h2 span{color:var(--acc)}
.card h2,.wrap h2{margin:0;font-size:22px;font-weight:800;line-height:1.15}
.card p,.wrap p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.card p b,.wrap p b{color:var(--ink);font-weight:600}
.eyebrow{font:700 11px/1.3 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.btn{appearance:none;border:0;border-radius:14px;padding:16px 18px;min-height:52px;font:800 17px/1.1 var(--font);background:var(--acc);color:#1a0d12;width:100%;transition:transform .08s,filter .08s,opacity .2s}
.btn:active{transform:scale(.96);filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:700}
.btn.off{opacity:.45}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.small{font-size:12.5px!important}
.center{text-align:center}
.stamp{justify-self:center;font:900 28px/1 var(--font);letter-spacing:.05em;padding:8px 16px;border:4px solid currentColor;border-radius:8px;transform:rotate(-6deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) .12s both;text-align:center}
.stamp.pass{color:var(--green)} .stamp.cond{color:var(--amber)} .stamp.hold{color:var(--acc)}
@keyframes stamp{0%{transform:scale(2.6) rotate(-14deg);opacity:0}60%{transform:scale(.9) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.big{font:900 46px/1 var(--font);font-variant-numeric:tabular-nums;text-align:center}
.newbest{color:var(--acc);text-align:center;font-weight:800;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.lesson{border-left:3px solid var(--acc);padding:6px 0 6px 12px;font-size:14px!important;color:var(--ink)!important}
.ledger{display:grid;gap:4px;background:#161b20;border-radius:12px;padding:10px 12px}
.ledger div{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.ledger div b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger div.neg b{color:#ff8fb0}
.ledger div.tot{border-top:1px solid var(--rule);padding-top:6px;margin-top:2px;color:var(--ink);font-weight:700}
.why{display:grid;gap:8px}
.why div{background:#161b20;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.35;color:var(--ink);animation:rise .4s ease-out both}
.why div em{font-style:normal;color:#ff8fb0;font-weight:800;float:right;margin-left:8px}
.why div span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
a{color:var(--acc)}
/* in-game panels */
.wrap{max-width:520px;margin:0 auto;display:grid;gap:10px;padding-bottom:8px}
.wrap.in>*{animation:rise .38s cubic-bezier(.2,1.2,.4,1) both}
.wrap.in>*:nth-child(2){animation-delay:.05s}.wrap.in>*:nth-child(3){animation-delay:.1s}.wrap.in>*:nth-child(4){animation-delay:.15s}.wrap.in>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.ph{display:grid;gap:6px;padding:4px 2px}
.hint{color:var(--acc)!important;font-size:13.5px!important}
.grid7{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (orientation:landscape) and (min-width:620px){.grid7{grid-template-columns:repeat(4,1fr)}.wrap{max-width:860px}}
.chk{appearance:none;text-align:left;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 11px;min-height:104px;display:grid;gap:5px;align-content:start;font-family:var(--font);transition:transform .08s,border-color .2s}
.chk:active{transform:scale(.95)}
.chk b{font-size:13.5px;line-height:1.2}
.chk span{font-size:11.5px;color:var(--muted);line-height:1.3}
.chk.ok{border-color:rgba(61,220,132,.5);background:#18261f}
.chk.fixed{border-color:rgba(255,90,78,.55);background:#2a1b1e}
.chip{justify-self:start;display:inline-block;font:800 10px/1 var(--font);font-style:normal;letter-spacing:.08em;padding:4px 7px;border-radius:6px;text-transform:uppercase;background:#2d363e;color:#a9b5be}
.chip.ok{background:rgba(61,220,132,.15);color:var(--green)}
.chip.gap{background:rgba(255,90,78,.16);color:#ff8a80}
.chip.acc{background:rgba(255,90,138,.16);color:var(--acc)}
.flip{animation:flip .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes flip{0%{transform:perspective(500px) rotateY(80deg) scale(.9);opacity:.3}100%{transform:none;opacity:1}}
.prow,.item,.pv{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:11px 12px;display:grid;gap:7px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.top b{font-size:15px;line-height:1.25}
.top em{font-style:normal;font:900 20px/1 var(--font);color:var(--acc);font-variant-numeric:tabular-nums}
.pbar{height:9px;border-radius:5px;background:var(--acc);transform-origin:left;animation:grow .7s ease-out both}
@keyframes grow{from{transform:scaleX(0)}}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.rc{font-size:13px!important;color:var(--ink)!important;line-height:1.4!important}
.rc b{color:var(--acc)!important}
.mini{appearance:none;border:1px solid var(--acc);background:rgba(255,90,138,.08);color:var(--acc);border-radius:11px;min-height:46px;padding:0 14px;font:800 15px var(--font);transition:transform .08s}
.mini:active{transform:scale(.95);background:rgba(255,90,138,.2)}
.mini.ghost{border-color:var(--rule);color:var(--ink);background:transparent}
.fpy{position:relative;height:12px;background:#262d34;border-radius:6px;margin:4px 0}
.fpy i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transform-origin:left;animation:grow .9s ease-out both}
.fpy b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.pvbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec{position:relative;height:56px;display:flex;align-items:flex-end;gap:2px;background:#161b20;border-radius:8px;padding:4px}
.spec i{flex:1;background:var(--blue);border-radius:2px 2px 0 0;transform-origin:bottom;animation:grow2 .5s ease-out both}
.spec i.over{background:var(--red)}
.spec u{position:absolute;left:0;right:0;top:12px;border-top:2px dashed #ff8fb0;text-decoration:none}
@keyframes grow2{from{transform:scaleY(0)}}
.res{font-weight:800;font-size:14px}
.res.ok{color:var(--green)} .res.bad{color:var(--red)} .res.skip{color:var(--muted)}
.crit{display:grid;gap:4px;background:#161b20;border-radius:12px;padding:10px 12px}
.crit div{font-size:13px;display:flex;gap:8px;align-items:baseline;color:var(--ink)}
.crit div i{font-style:normal;font-weight:900;width:14px;flex:none}
.crit div.y i{color:var(--green)} .crit div.n i{color:var(--red)}
.rule{background:rgba(255,90,138,.08);border:1px solid rgba(255,90,138,.35);border-radius:12px;padding:10px 12px;font-size:13px!important;color:var(--ink)!important}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nums span{background:#161b20;border-radius:8px;padding:6px 4px;text-align:center;font:800 14px/1.1 var(--font);font-variant-numeric:tabular-nums}
.nums span em{display:block;font:700 9.5px/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.nums span.hot{color:#ff8fb0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{appearance:none;min-height:48px;border-radius:11px;border:1px solid var(--rule);background:transparent;color:var(--ink);font:800 15px var(--font);transition:transform .08s,background .15s}
.seg button:active{transform:scale(.95)}
.seg button.on.c{background:var(--amber);color:#1a1608;border-color:var(--amber)}
.seg button.on.h{background:var(--acc);color:#1a0d12;border-color:var(--acc)}
.item.chosen{border-color:#3a434b}
.sum{font-size:13px!important;color:var(--ink)!important;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<div id="panel" hidden></div>
<div class="hudbtns" id="hudbtns" hidden>
  <button id="btnMute" aria-label="Sound on or off">♪</button>
  <button id="btnPause" aria-label="Pause">❚❚</button>
</div>
<canvas id="fx"></canvas>
<div id="ov"></div>

<script src="../hhl.js?v=2"></script>
<script>
'use strict';
(function () {
// ---------- utilities ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('hhl.ch6.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hhl.ch6.' + k, JSON.stringify(v)); } catch (e) {} }
};
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const FONT = '-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function eur(k) { const r = Math.round(k); return (r < 0 ? '−' : '') + '€' + Math.abs(r).toLocaleString('en') + 'k'; }
function dd(d) { const r = Math.round(d * 10) / 10; return (r % 1 ? r.toFixed(1) : String(r)) + ' d'; }
function pct(p) { return Math.round(p * 100) + '%'; }
function wk(w) { return (w % 1 ? w.toFixed(1) : String(w)) + ' wk'; }
const ACC = '#ff5a8a', RED = '#ff5a4e', GREEN = '#3ddc84', AMBER = '#f5c518', BLUE = '#5ab0ff', INK = '#eef2f4', MUTED = '#93a1ab', PINK = '#ff8fb0';

// ---------- crash guard ----------
let crashed = false;
function crash(msg) {
  if (crashed) return; crashed = true;
  try {
    const p = $('panel'); p.hidden = true; p.innerHTML = '';
    const ov = $('ov'); ov.hidden = false;
    ov.innerHTML = '<div class="card"><div class="eyebrow">Line stopped</div><h2>Something went wrong</h2><p class="small">' +
      String(msg).replace(/[<>&]/g, '') + '</p><button class="btn" onclick="location.reload()">Restart</button></div>';
  } catch (e) {}
}
window.addEventListener('error', e => crash(e.message || 'Unknown error'));
window.addEventListener('unhandledrejection', e => crash((e.reason && e.reason.message) || 'Unknown error'));

// ---------- sound ----------
const Sfx = {
  ctx: null, master: null, noiseBuf: null, muted: store.get('muted', false),
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.5;
        this.master.connect(this.ctx.destination);
        const len = Math.floor(this.ctx.sampleRate * 0.8);
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const s = this.ctx.createBufferSource(); s.buffer = this.ctx.createBuffer(1, 1, 22050); s.connect(this.ctx.destination); s.start(0);
      }
      if (this.ctx.state !== 'running') this.ctx.resume();
    } catch (e) {}
  },
  setMuted(m) { this.muted = m; store.set('muted', m); try { if (this.master) this.master.gain.value = m ? 0 : 0.5; } catch (e) {} },
  ok_() { return this.ctx && !this.muted && this.ctx.state === 'running'; },
  tone(f, dur, type, vol, slide, delay) {
    if (!this.ok_()) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  },
  noise(dur, vol, freq, delay) {
    if (!this.ok_()) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
      const g = this.ctx.createGain(); g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.03);
    } catch (e) {}
  },
  click() { this.tone(900, 0.04, 'square', 0.05); },
  flip() { this.noise(0.06, 0.1, 3000); this.tone(520, 0.07, 'triangle', 0.08, 780); },
  ok() { this.tone(660, 0.1, 'triangle', 0.12, null, 0.08); this.tone(990, 0.16, 'triangle', 0.12, null, 0.17); },
  gap() { this.tone(220, 0.3, 'sawtooth', 0.14, 90, 0.06); this.noise(0.15, 0.15, 700, 0.06); this.tone(180, 0.2, 'square', 0.06, null, 0.2); },
  ramp(k) {
    if (k === 'cold') this.tone(900, 0.55, 'sine', 0.09, 420);
    else if (k === 'hot') this.tone(160, 0.55, 'sawtooth', 0.06, 420);
    else { this.noise(0.6, 0.18, 260); this.tone(55, 0.55, 'square', 0.05, 90); }
  },
  pass() { this.tone(1320, 0.06, 'square', 0.06); this.tone(1760, 0.08, 'square', 0.06, null, 0.07); },
  loss() { for (let i = 0; i < 3; i++) { this.tone(880, 0.09, 'square', 0.12, null, i * 0.18); this.tone(660, 0.09, 'square', 0.12, null, i * 0.18 + 0.09); } this.tone(80, 0.4, 'sine', 0.3, 40); },
  boom() { this.noise(0.8, 0.45, 1400); this.noise(0.5, 0.3, 300, 0.05); this.tone(70, 0.7, 'sine', 0.4, 30); this.tone(300, 0.3, 'sawtooth', 0.1, 60, 0.02); },
  stepIn() { this.tone(784, 0.1, 'triangle', 0.1); this.tone(1047, 0.18, 'triangle', 0.1, null, 0.08); },
  logIt() { this.noise(0.07, 0.12, 5000); this.noise(0.07, 0.12, 5000, 0.1); this.tone(1400, 0.03, 'square', 0.05, null, 0.2); },
  alert() { this.tone(660, 0.1, 'triangle', 0.1); this.tone(660, 0.1, 'triangle', 0.1, null, 0.14); },
  unitOk() { this.tone(1800, 0.025, 'sine', 0.025); },
  unitBad() { this.tone(260, 0.08, 'square', 0.05, 180); },
  siren() { for (let i = 0; i < 4; i++) this.tone(i % 2 ? 330 : 440, 0.2, 'square', 0.09, null, i * 0.2); },
  stamp() { this.noise(0.18, 0.4, 500); this.tone(110, 0.25, 'sine', 0.35, 60); },
  phase() { this.tone(330, 0.18, 'square', 0.1); this.tone(494, 0.3, 'square', 0.1, null, 0.16); },
  good() { this.tone(660, 0.1, 'triangle', 0.1); this.tone(880, 0.14, 'triangle', 0.1, null, 0.08); },
  bad() { this.tone(150, 0.35, 'sawtooth', 0.16, 60); this.noise(0.25, 0.2, 500); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.12, null, i * 0.08)); this.noise(0.3, 0.06, 6000, 0.4); },
  over() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.3, 'square', 0.1, null, i * 0.16)); },
  tick() { this.tone(1200, 0.03, 'square', 0.04); },
  coin() { this.tone(1568, 0.05, 'square', 0.05); this.tone(2093, 0.09, 'square', 0.05, null, 0.05); }
};

// ---------- canvas + layout ----------
const cvs = $('game'), ctx = cvs.getContext('2d');
const fxc = $('fx'), fx = fxc.getContext('2d');
const panel = $('panel'), ov = $('ov');
let W = 0, H = 0, DPR = 1;
const SAFE = { t: 0, r: 0, b: 0, l: 0 };
const L = {};
function readSafe() {
  try {
    const cs = getComputedStyle($('safe'));
    SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.r = parseFloat(cs.paddingRight) || 0;
    SAFE.b = parseFloat(cs.paddingBottom) || 0; SAFE.l = parseFloat(cs.paddingLeft) || 0;
  } catch (e) {}
}
function resize() {
  readSafe();
  const vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth); H = Math.round(vv ? vv.height : window.innerHeight);
  if (W < 10 || H < 10) { W = window.innerWidth; H = window.innerHeight; }
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  fxc.width = cvs.width; fxc.height = cvs.height;
  L.land = W > H * 1.15;
  L.top = SAFE.t + 70; L.bot = H - SAFE.b - 12;
  const avail = W - SAFE.l - SAFE.r - 24;
  L.colW = Math.max(200, Math.min(avail, L.land ? 860 : 520));

// ----- HALT -----
function enterHalt() {

    cur: 0, used: 1, res: [null, null, null, null], disp: -1, card: null, cost: 0, dev: 'ok', devT: 0, bump: 0, destroyed: 0, swapT: 0 };
  S.mode = 'halt';
}
function destructP(f, i, a) {
  let p = clamp((f - 0.3) * 0.8, 0, 0.5) + Math.max(0, i - AX[a].dvt) * 0.04;
  if (AX[a].key === 'comb') p *= 1.3;
  return clamp(p, 0, 0.6);
}
function fatigueAdd(i, a) { return (0.04 + 0.028 * Math.max(0, i - AX[a].dvt + 1)) * (AX[a].key === 'comb' ? 1.4 : 1); }
function unitsLeft() { return NUNITS - S.halt.used; }

  const u = h.units[h.cur]; if (!u || u.dead || h.step >= MAXSTEP - 1) return;
  h.target = h.step + 1; h.phase = 'ramp'; h.t = 0;
  Sfx.ramp(AX[h.axis].key);

}
function hResolve() {

  const p = destructP(u.f, i, h.axis);

    Sfx.boom(); addShake(18); hitstop = Math.max(hitstop, 0.22); flash = 0.6; flashColor = '255,90,78';
    burst(cx, cy, ['#ffb347', '#ffffff', '#ff5a4e', AMBER], 50, 520, { long: true, big: true });
    burst(cx, cy, ['#555c63', '#3a434b', '#6b747c'], 20, 120, { g: -60, long: true, big: true });
    floatText(cx, cy - 50, 'DESTROYED', RED, 30, 1.5);
    h.card = { kind: 'dead', at: i };
    return;
  }
  h.step = i;
  if (i >= S.ol[h.axis]) {
    h.dev = 'err'; u.f += 0.08;
    const weak = S.weak[h.axis];
    h.res[h.axis] = { st: 'ol', i, weak };
    Sfx.loss(); addShake(9); hitstop = Math.max(hitstop, 0.16); flash = 0.35; flashColor = '255,90,138';
    floatText(cx, cy - 56, 'FUNCTION LOSS', ACC, 28, 1.5);

    if (weak) {
      setTimeout(() => Sfx.win(), 450);
      burst(cx, cy, [GREEN, '#ffffff', AMBER, ACC], 60, 560, { up: true, long: true, square: true, big: true });
      floatText(cx, cy - 22, 'WEAKNESS FOUND BEFORE THE CUSTOMER', GREEN, 14, 2.0);
    } else burst(cx, cy, [ACC, '#ffffff'], 24, 300, { up: true });
    h.card = { kind: 'ol', at: i, weak };

  }
  u.f += fatigueAdd(i, h.axis); h.bump = 1; Sfx.pass();
  floatText(cx, lay.ch.y + lay.ch.h * 0.35, 'PASS ' + a.lab(a.v(i)), GREEN, 16, 0.8);

}

}

}
function loadFresh() {
