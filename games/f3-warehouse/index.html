<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a1c">
<title>Clear to Build — The Hardest Factory Lessons</title>
<meta name="description" content="A free game: the factory says material is ready. Is it? Check the shelf against the system before the line starts, and see what the warehouse bills you later. From The Hardest Factory Lessons, Chapter 3.">
<link rel="stylesheet" href="../juice.css?v=2">
<style>
:root{
  --bg:#101a1c; --ink:#eaf3f2; --muted:#93a9a8; --panel:#182427; --panel2:#1e2e31; --rule:#2c4043;
  --acc:#3dd6c6; --red:#ff5a4e; --green:#3ddc84; --amber:#ff9f43; --gold:#f5c518;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 28px);overflow-x:hidden}
#app{width:min(480px,100%);margin:0 auto;display:grid;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center}
.back{color:var(--muted);text-decoration:none;font:600 14px/1 var(--font);padding:10px 8px;margin-left:-8px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:18px 16px;display:grid;gap:12px;animation:pop .22s ease both}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
h1{margin:0;font-size:36px;line-height:1.02;font-weight:900;letter-spacing:-.01em} h1 span{color:var(--acc)}
h2{margin:0;font-size:22px;font-weight:800}
h3{margin:0;font:700 11px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.45} p b,li b{color:var(--ink);font-weight:600}
.small{font-size:12.5px} .plain{border-left:3px solid var(--rule);padding:2px 0 2px 10px;font-size:13px;color:#cfdddc}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 16px;font:800 16px/1.1 var(--font);background:var(--acc);color:#07201d;width:100%;min-height:50px;cursor:pointer;box-shadow:0 4px 0 #1f8f85;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f8f85} .btn:disabled{opacity:.35;pointer-events:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:700;box-shadow:none}
.btn.sm{padding:10px 12px;min-height:40px;font-size:14px;border-radius:11px}
.row{display:flex;gap:10px} .row>*{flex:1}
.hud{margin-right:50px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;position:sticky;top:6px;z-index:5}
.hud b{font-size:14px} .pips{display:flex;gap:5px}
.pip{width:100%;max-width:34px;height:14px;border-radius:4px;background:var(--acc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:background .15s,transform .15s}
.pip.off{background:#0e1718;box-shadow:none;transform:scaleY(.7)}
.hud span{font:800 12px/1 var(--font);color:var(--muted)}
.stage{position:relative;height:170px;border-radius:14px;overflow:hidden;background:linear-gradient(#1b2b2e 0 60%,#23363a 60% 100%);border:1px solid var(--rule)}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:40%;background:repeating-linear-gradient(90deg,#26393d 0 26px,#2b4146 26px 52px)}
.pick{display:grid;gap:8px}
.pick button{display:grid;grid-template-columns:40px 1fr;gap:2px 12px;text-align:left;border:1px solid var(--rule);background:var(--panel2);border-radius:14px;padding:12px;color:var(--ink);font:inherit;cursor:pointer;transition:transform .1s,border-color .15s}
.pick button i{grid-row:1/3;font-style:normal;font-size:28px;align-self:center;text-align:center}
.pick button.on{border-color:var(--acc);background:#16363a;transform:scale(1.02)} .pick button b{font-size:15px} .pick button span{font-size:12.5px;color:var(--muted);line-height:1.35}
.slots{display:flex;gap:10px;justify-content:center}
.slot{width:64px;height:64px;border-radius:14px;border:2px dashed var(--rule);display:grid;place-items:center;font-size:30px;background:#0e1718}
.slot.on{border:2px solid var(--acc);background:#16363a}
.rack{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;border-radius:14px;background:#0e1718;border:1px solid var(--rule)}
.bay{display:grid;gap:6px;text-align:center;background:var(--panel2);border:2px solid var(--rule);border-radius:12px;padding:8px 6px;color:var(--ink);font:inherit;cursor:pointer;transition:transform .08s,border-color .15s;position:relative}
.bay:active{transform:scale(.95)} .bay.sel{border-color:var(--acc);background:#16363a}
.bay b{font-size:11px;line-height:1.15;min-height:26px;display:grid;place-items:center}
.stack{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.bx{height:19px;border-radius:3px;background:#a9753f;border:2px solid #7a5230;font:900 8px/15px var(--font);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.bx.ghost{background:transparent;border:2px dashed #5c6f6e;color:transparent}
.bx.old{background:#9a4d3f;border-color:#6b2f26} .bx.new{background:#4f8f4a;border-color:#2f5d2c}
.bx.inc{background:#1e3a52;border:2px dashed var(--acc);color:var(--acc)}
.bx.fix{background:#2f7d4f;border-color:#1f5a38}
.erp{font:900 9px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.bay .flag{position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--red);color:#fff;font-weight:900}
.bay .flag.ok{background:var(--green);color:#07201d}
.detail{display:grid;gap:10px;background:var(--panel2);border:1px solid var(--rule);border-radius:14px;padding:12px;animation:jrise .25s ease both}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font:800 10px/1 var(--font);letter-spacing:.04em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:#0e1718;color:var(--muted)}
.tag.f{color:var(--amber)} .tag.v{color:var(--green)}
.chk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chk button{display:grid;gap:3px;justify-items:center;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 4px;font:700 11px/1.2 var(--font);cursor:pointer;transition:transform .06s}
.chk button i{font-style:normal;font-size:22px} .chk button:active{transform:scale(.93)} .chk button:disabled{opacity:.35;pointer-events:none} .chk button.done{opacity:.55;border-style:dashed}
.res{font-size:13px;line-height:1.4;color:#d6e4e3;background:#0e1718;border-radius:10px;padding:9px 10px;animation:jrise .25s ease both}
.res.bad{color:#ffb4ac;box-shadow:inset 3px 0 0 var(--red)} .res.good{color:#aeeccb;box-shadow:inset 3px 0 0 var(--green)}
.fix{display:flex;gap:8px} .fix button{flex:1;border:1px solid var(--amber);background:transparent;color:var(--amber);border-radius:10px;padding:10px;font:800 13px var(--font);cursor:pointer;transition:transform .06s} .fix button:active{transform:scale(.95)} .fix button.done{border-color:var(--green);color:var(--green);pointer-events:none}
.note{display:grid;gap:3px;background:#0e1718;border-radius:12px;padding:11px 12px;font-size:13.5px;line-height:1.4;color:#d6e4e3}
.note b{color:var(--acc);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.note.warn b{color:var(--amber)} .note.bad b{color:var(--red)} .note.good b{color:var(--green)}
.big{font:900 64px/1 var(--font);text-align:center;color:var(--acc);font-variant-numeric:tabular-nums}
.stamp{justify-self:center;font:900 24px/1 var(--font);letter-spacing:.06em;padding:8px 14px;border:4px solid currentColor;border-radius:8px;transform:rotate(-4deg)}
.stamp.pass{color:var(--green)} .stamp.fail{color:var(--red)} .stamp.warn{color:var(--amber)}
.lines{display:grid;gap:6px} .lines div{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#d6e4e3;padding:7px 0;border-top:1px solid var(--rule)} .lines div:first-child{border-top:0}
.lines em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums} .lines em.pos{color:var(--green)} .lines em.neg{color:var(--red)}
.cost{font:900 34px var(--font);font-variant-numeric:tabular-nums;color:var(--red);text-align:center}
.invoice{display:grid;gap:8px;background:#f4efe3;border-radius:6px;padding:12px;color:#2a2418;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.claim{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:#fffaf0;border:1px solid #d9cfb8;border-radius:6px;padding:9px 10px;text-align:left;color:#2a2418;font:inherit;cursor:pointer;position:relative;overflow:hidden;transition:transform .06s}
.claim:active{transform:scale(.97)} .claim b{font-size:13px} .claim span{font-size:11.5px;color:#6b6252} .claim em{grid-row:1/3;grid-column:2;align-self:center;font:900 15px var(--font);font-style:normal}
.claim.struck{background:#e6f3e8} .claim.struck em{text-decoration:line-through;color:#6b6252} .claim.tried{background:#fbeeda}
.claim .st{position:absolute;right:50px;top:50%;transform:translateY(-50%) rotate(-8deg);font:900 11px var(--font);letter-spacing:.05em;border:2px solid currentColor;padding:2px 5px;border-radius:4px;opacity:.9}
.inv-total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #2a2418;padding-top:8px;font-weight:900} .inv-total em{font-style:normal;font-size:22px;color:#b3261e}
.belt{position:absolute;left:0;right:0;bottom:28px;height:16px;border-radius:4px}
.unit{position:absolute;bottom:44px;width:26px;height:20px;border-radius:5px;background:#cfd8dc;border:2px solid #90a4ae;animation:umove 2.4s linear infinite}
.unit.d1{animation-delay:-.4s}.unit.d2{animation-delay:-.8s}.unit.d3{animation-delay:-1.2s}.unit.d4{animation-delay:-1.6s}.unit.d5{animation-delay:-2s}
@keyframes umove{from{left:-30px}to{left:100%}}
.stopped .unit{animation-play-state:paused !important} .stopped .belt{animation-play-state:paused !important}
.shelfart{position:absolute;bottom:34px;height:78px;width:84px;border:3px solid #52666a;border-bottom:0;background:repeating-linear-gradient(#2b4146 0 24px,#1d2d31 24px 27px)}
a{color:var(--acc)}
</style>
</head>
<body>
<div id="app"></div>
<script src="../hhl.js?v=14"></script>
<script src="../juice.js?v=2"></script>
<script>
(function () {
'use strict';
var $app = document.getElementById('app');
var BUILDS = 3, NLINES = 6, CHECKS = 4;

/* ---------- content ---------- */
var LINES = [
 { n:'MCU module', req:5000 }, { n:'LED driver IC', req:5000 }, { n:'Li-ion cells', req:10000 }, { n:'Main PCB', req:5000 },
 { n:'Enclosure, top', req:5000 }, { n:'Enclosure, bottom', req:5000 }, { n:'Connector, FPC', req:10000 }, { n:'Resistor 10k', req:50000 },
 { n:'Capacitor 100 µF', req:20000 }, { n:'Crystal 32 kHz', req:5000 }, { n:'Screws, M2', req:30000 }, { n:'Foam insert', req:5000 },
 { n:'Printed carton', req:5000 }, { n:'Antenna cable', req:5000 }
];
var DEMANDS = [
 { id:'ctb', ic:'📋', name:'A clear-to-build report, 72 hours before every start', sub:'Physical quantities, not the ERP. Two lines per build are verified for you.' },
 { id:'count', ic:'🔢', name:'A cycle-count programme, with count rights', sub:'Counts are continuous and discrepancies are investigated. The records are closer to the shelf.' },
 { id:'fifo', ic:'🏷️', name:'System-directed picking', sub:'The system names the lot and a scan enforces it. FIFO becomes a constraint.' },
 { id:'exposure', ic:'📊', name:'A monthly inventory exposure report', sub:'Exposure by owner, aged. It is the fuse of the end-of-life bill.' }
];
var STATE = {
  phantom:   { fix:10, gap:true,  label:'Phantom stock' },
  robbed:    { fix:8,  gap:true,  label:'Kit borrowed for another order' },
  misplaced: { fix:3,  gap:true,  label:'Wrong location' },
  receipt:   { fix:12, gap:true,  label:'Receipt not confirmed in time' },
  fifo:      { fix:2,  gap:false, label:'FIFO violation' }
};
var CHECK = { count:'Count the shelf', receipt:'Confirm the receipt', picker:'Ask the picker' };
var CHIC = { count:'🔢', receipt:'📞', picker:'🧑‍🏭' };

function res(kind, st, line) {
  var req = line.req, f = fmt;
  if (kind === 'count') {
    if (st === 'phantom') return ['The system says ' + f(req) + '. The shelf holds ' + f(Math.round(req * 0.4)) + '. The gap is ' + f(Math.round(req * 0.6)) + '.', 'bad'];
    if (st === 'robbed') return ['The kit was borrowed for another customer\'s build last week. ' + f(Math.round(req * 0.35)) + ' are short. "It will be repaid."', 'bad'];
    if (st === 'misplaced') return ['The location is empty. The pallet is in aisle 7 under the wrong address: present in the building, absent from its address.', 'bad'];
    return ['System ' + f(req) + ', shelf ' + f(req) + '. They match.', 'good'];
  }
  if (kind === 'receipt') {
    if (st === 'receipt') return ['The supplier\'s confirmed ship date is Thursday, after the build starts. The ERP plans it for Monday. A probability, treated as a fact.', 'bad'];
    return ['No receipt is involved: this line is covered by stock.', ''];
  }
  if (kind === 'picker') {
    if (st === 'fifo') return ['She would pull "the front one". The front is the newest: this month\'s date code against 22 months for the boxes at the back.', 'bad'];
    if (st === 'robbed') return ['"That one? Somebody borrowed the kit last week." She shrugs. Nobody asked her before.', 'bad'];
    return ['She scans, and the system names the lot. The oldest goes first.', 'good'];
  }
  return ['', ''];
}
function cueFor(st) {
  var cues = { phantom:['Last counted 13 months ago', 'f'], robbed:['Allocations moved last week', 'f'], misplaced:['Put away unscanned to B-14', 'f'], receipt:['Includes a receipt due Tuesday', 'f'], fifo:['3 lots in stock', 'f'] };
  var good = [['Counted 3 weeks ago', 'v'], ['Counted 5 weeks ago', 'v']], g = good[Math.floor(Math.random() * good.length)];
  if (st === 'ok') { if (Math.random() < 0.3) { var k = Object.keys(cues); return [cues[k[Math.floor(Math.random() * k.length)]]]; } return [g]; }
  if (Math.random() < 0.35) return [g];
  return [cues[st]];
}

var G = null;
var store = { get:function (k, d) { try { var v = localStorage.getItem('hhl.ch103.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set:function (k, v) { try { localStorage.setItem('hhl.ch103.' + k, JSON.stringify(v)); } catch (e) {} } };
function fmt(n) { return Number(n).toLocaleString('en'); }
function later(ms, fn) { setTimeout(function () { try { fn(); } catch (e) {} }, J.reduce ? 0 : ms); }
function el(h) { $app.innerHTML = h; window.scrollTo(0, 0); }
function $q(s) { return $app.querySelector(s); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function has(id) { return G.dem.indexOf(id) >= 0; }
function ledger(label, cost) { G.ledger.push({ label:label, cost:cost }); }
function topbar(back) { return '<div class="top">' + (back ? '<a class="back" href="../">← Games</a>' : '<span></span>') + J.muteBtn() + '</div>'; }

function makeBuild(b) {
  var lines = shuffle(LINES).slice(0, NLINES).map(function (l) { return { n:l.n, req:l.req, st:'ok', checks:{}, fixed:false, free:false }; });
  var nprob = [2, 3, 3][b], pool = [];
  ['phantom','robbed','misplaced','receipt','fifo'].forEach(function (s) {
    if (s === 'fifo' && has('fifo')) return;
    var w = s === 'phantom' || s === 'robbed' ? (has('count') ? 1 : 2) : 2; for (var i = 0; i < w; i++) pool.push(s);
  });
  var picks = shuffle([0,1,2,3,4,5]).slice(0, nprob);
  picks.forEach(function (i) { lines[i].st = shuffle(pool)[0]; });
  if (b === 1 && !lines.some(function (l) { return l.st === 'receipt'; })) lines[picks[0]].st = 'receipt';
  lines.forEach(function (l) { l.cues = cueFor(l.st); });
  if (has('ctb')) shuffle([0,1,2,3,4,5]).slice(0, 2).forEach(function (i) { var l = lines[i]; l.free = true; l.checks.count = res('count', l.st, l); l.checks.receipt = res('receipt', l.st, l); if (l.st === 'fifo' || l.st === 'robbed') l.checks.picker = res('picker', l.st, l); });
  return { lines:lines, checks:CHECKS };
}
function newGame() { G = { dem:[], b:0, build:null, sel:-1, ledger:[], results:[], fifoLines:[], phase:'title' }; }

// what a line looks like on the shelf, given only what you have found out so far
function known_state(l) {
  var st = l.st; if (st === 'ok') return null;
  var k = l.checks;
  if (st === 'phantom' || st === 'misplaced') return k.count ? st : null;
  if (st === 'robbed') return (k.count || k.picker) ? st : null;
  if (st === 'receipt') return k.receipt ? st : null;
  if (st === 'fifo') return k.picker ? st : null;
  return null;
}
function bayStack(l) {
  var ks = known_state(l), b = [];
  function push(c, n, t) { for (var i = 0; i < n; i++) b.push('<div class="bx ' + c + '">' + (t || '') + '</div>'); }
  if (l.fixed || l.covered) { push('fix', 6, '✓'); return b.join(''); }
  if (!ks) { push('', 6); return b.join(''); }
  if (ks === 'phantom') { push('', 2); push('ghost', 4); }
  else if (ks === 'robbed') { push('', 3); push('ghost', 3); }
  else if (ks === 'misplaced') { push('ghost', 6); }
  else if (ks === 'receipt') { push('', 2); push('inc', 4, 'THU'); }
  else if (ks === 'fifo') { push('new', 3, '3m'); push('old', 3, '22m'); }
  return b.join('');
}

/* ---------- screens ---------- */
function screenTitle() {
  el(topbar(true) +
   '<div class="card"><div class="stage"><div class="floor"></div>' +
   '<div class="shelfart" style="left:16px"></div><div class="shelfart" style="left:112px"></div><div class="shelfart" style="left:208px"></div>' +
   '<div style="position:absolute;left:24px;bottom:96px;font-size:26px" class="j-float">📦</div><div style="position:absolute;left:218px;bottom:94px;font-size:26px">📦</div>' +
   '<div class="j-drive" style="position:absolute;right:10px;bottom:34px;font-size:44px">🚜</div>' +
   '<div class="j-blink" style="position:absolute;right:14px;top:12px;font:900 11px var(--font);color:var(--green);letter-spacing:.08em">ERP: READY ✓</div></div>' +
   '<h3>Chapter 3 · The Hardest Factory Lessons</h3><h1>Clear to <span>Build</span></h1>' +
   '<p>Nobody tours the warehouse. Its failures are not visible: they are <b>timed</b>. They detonate on Wednesday afternoon, mid-build, as a line down.</p>' +
   '<div class="plain"><b>In plain English:</b> a factory\'s computer says the parts for your build are in stock. The shelf may disagree. <b>Goal:</b> reconcile the system against the physical shelf <i>before</i> the line starts, while a gap can still be fixed cheaply.</div>' +
   '<button class="btn" data-a="start">Start the first build</button>' +
   '<p class="small" style="text-align:center">Best ' + fmt(store.get('best', 0)) + ' · The factory is fictional.</p></div>');
}

function screenDemands() {
  G.phase = 'dem'; var n = G.dem.length;
  el(topbar(false) + '<div class="card"><h3>Standing demands · ' + n + ' of 2</h3><h2>What do you require?</h2>' +
   '<div class="slots">' + [0, 1].map(function (i) { var id = G.dem[i]; var d = id && DEMANDS.filter(function (x) { return x.id === id; })[0]; return '<div class="slot' + (d ? ' on' : '') + '">' + (d ? d.ic : '') + '</div>'; }).join('') + '</div>' +
   '<p>Before the first build you can require <b>two</b> disciplines from the warehouse. A factory that resists tells you where its shortages live.</p>' +
   '<div class="pick">' + DEMANDS.map(function (d) { var on = has(d.id);
     return '<button data-a="dem" data-id="' + d.id + '" class="' + (on ? 'on' : '') + '"><i>' + d.ic + '</i><b>' + d.name + '</b><span>' + d.sub + '</span></button>'; }).join('') + '</div>' +
   '<button class="btn" data-a="build"' + (n !== 2 ? ' disabled' : '') + '>Begin build 1</button></div>');
}

function hud() {
  var pips = ''; for (var i = 0; i < CHECKS; i++) pips += '<div class="pip' + (i < G.build.checks ? '' : ' off') + '"></div>';
  return J.muteBtn() + '<div class="hud"><b>Build ' + (G.b + 1) + '/' + BUILDS + '</b><div class="pips" title="Physical checks left">' + pips + '</div><span>' + G.build.checks + ' checks</span></div>';
}

function detailHtml(i) {
  var B = G.build, l = B.lines[i]; if (!l) return '<div class="note"><b>The ERP says: every line is ready</b>Tap a bay to inspect it. Use your four checks where the cues suggest the system and the shelf disagree.</div>';
  var tags = l.cues.map(function (c) { return '<span class="tag ' + c[1] + '">' + c[0] + '</span>'; }).join('') + (l.free ? '<span class="tag v">verified by report</span>' : '');
  var results = Object.keys(l.checks).map(function (k) { var r = l.checks[k]; return '<div class="res ' + r[1] + '"><b>' + CHECK[k] + ':</b> ' + r[0] + '</div>'; }).join('');
  var st = known_state(l);
  var fixBtn = st ? '<div class="fix"><button data-a="fix" data-i="' + i + '" class="' + (l.fixed ? 'done' : '') + '">' + (l.fixed ? '✓ Fixed' : 'Fix it · −€' + STATE[st].fix + 'k') + '</button></div>' : '';
  var cover = (!st && !l.fixed) ? '<div class="fix"><button data-a="cover" data-i="' + i + '">Cover it anyway · −€15k</button></div>' : '';
  return '<div class="detail"><div class="row" style="align-items:baseline"><b style="font-size:16px">' + l.n + '</b><span class="small" style="text-align:right">Required ' + fmt(l.req) + ' · System ' + fmt(Math.round(l.req * 1.2)) + '</span></div>' +
    '<div class="tags">' + tags + '</div>' + results +
    '<div class="chk">' + ['count', 'receipt', 'picker'].map(function (k) { var done = l.checks[k]; return '<button data-a="chk" data-i="' + i + '" data-k="' + k + '" class="' + (done ? 'done' : '') + '"' + (done || B.checks <= 0 ? ' disabled' : '') + '><i>' + CHIC[k] + '</i>' + CHECK[k] + '</button>'; }).join('') + '</div>' +
    fixBtn + (l.fixed ? '' : cover) + '</div>';
}

function screenBuild(msg) {
  G.phase = 'build';
  var B = G.build, i = G.sel;
  el(hud() + '<div class="card"><h3>72 hours before the line starts</h3><h2>The ERP says: ready</h2>' +
   (has('ctb') ? '<div class="note good"><b>Clear-to-build report</b>The factory physically verified two lines for you.</div>' : '') +
   (msg ? '<div class="note"><b>Just now</b>' + msg + '</div>' : '') +
   '<div class="rack">' + B.lines.map(function (l, k) {
     var ks = known_state(l), flag = (l.fixed || l.covered) ? '<div class="flag ok">✓</div>' : ks ? '<div class="flag">!</div>' : '';
     return '<button class="bay' + (k === i ? ' sel' : '') + '" data-a="bay" data-i="' + k + '">' + flag + '<b>' + l.n + '</b><div class="stack">' + bayStack(l) + '</div><div class="erp">ERP ✓ ready</div></button>'; }).join('') + '</div>' +
   '<div id="detail">' + detailHtml(i) + '</div>' +
   '<button class="btn" data-a="start-line">Start the line</button></div>');
}

function selectBay(i) {
  G.sel = i;
  var bays = $app.querySelectorAll('.bay'); Array.prototype.forEach.call(bays, function (b, k) { b.classList.toggle('sel', k === i); });
  var d = $q('#detail'); if (d) d.innerHTML = detailHtml(i);
  J.sfx('select'); if (bays[i]) J.pop(bays[i], 1.1);
}

function doCheck(i, k) {
  var B = G.build, l = B.lines[i]; if (B.checks <= 0 || l.checks[k]) return;
  B.checks--; l.checks[k] = res(k, l.st, l); G.sel = i; screenBuild();
  var bay = $app.querySelectorAll('.bay')[i], r = l.checks[k];
  J.sfx(k === 'count' ? 'scan' : k === 'receipt' ? 'phone' : 'select');
  later(220, function () { if (r[1] === 'bad') { J.hit(bay, 'bad', 'med'); J.floatAt(bay, 'MISMATCH', '#ff5a4e', 16); } else if (r[1] === 'good') J.hit(bay, 'good', 'small'); else J.pop(bay, 1.1); });
}
function doFix(i) {
  var l = G.build.lines[i], st = known_state(l); if (!st || l.fixed) return;
  l.fixed = true; ledger('Fixed before the build: ' + l.n + ' (' + STATE[st].label + ')', STATE[st].fix); G.sel = i;
  screenBuild();
  var bay = $app.querySelectorAll('.bay')[i];
  J.sfx('coin'); J.hit(bay, 'good', 'small'); J.floatAt(bay, '−€' + STATE[st].fix + 'k', '#f5c518', 18);
}
function doCover(i) {
  var l = G.build.lines[i]; if (l.fixed) return;
  l.fixed = true; l.covered = true; ledger('Covered anyway: ' + l.n + (l.st === 'ok' ? ' (nothing was wrong)' : ''), 15); G.sel = i;
  screenBuild(l.st === 'ok' ? 'You covered ' + l.n + ', and it did not need it.' : 'Covered ' + l.n + ' with an expedite, to be safe.');
  var bay = $app.querySelectorAll('.bay')[i];
  J.sfx('cash'); J.floatAt(bay, '−€15k', '#ff9f43', 18);
}

function lineScene(stopped) {
  var units = ''; for (var k = 0; k < 6; k++) units += '<div class="unit d' + k + '"></div>';
  return '<div class="stage ' + (stopped ? 'stopped j-siren' : '') + '" id="stage"><div class="floor"></div><div class="belt j-belt"></div>' + units +
    '<div style="position:absolute;left:12px;top:12px;font:900 11px var(--font);letter-spacing:.08em;color:' + (stopped ? 'var(--red)' : 'var(--green)') + '" class="' + (stopped ? 'j-blink' : '') + '">' + (stopped ? 'LINE STOPPED' : 'LINE RUNNING') + '</div>' +
    (stopped ? '<div class="j-blink" style="position:absolute;right:14px;top:8px;font-size:34px">🚨</div>' : '<div style="position:absolute;right:14px;top:8px;font-size:30px">🏭</div>') + '</div>';
}

function startLine() {
  var B = G.build, stops = [], tails = [];
  B.lines.forEach(function (l) {
    var gap = STATE[l.st] && STATE[l.st].gap;
    if (gap && !l.fixed) stops.push(l);
    if (l.st === 'fifo' && (!l.fixed || l.covered)) tails.push(l);
  });
  var cost = 0; stops.forEach(function (l, i) { var c = i === 0 ? 90 : 50; cost += c; ledger('Line stopped mid-build: ' + l.n + ' (' + STATE[l.st].label + ')', c); });
  tails.forEach(function (l) { G.fifoLines.push(l.n); });
  var found = B.lines.filter(function (l) { return l.st !== 'ok'; }).length;
  G.results.push({ b:G.b, stops:stops.length, tails:tails.length, problems:found });
  var story = stops.length
    ? '<div class="note bad"><b>Wednesday afternoon</b>"Production is paused. ' + stops.map(function (l) { return l.n; }).join(' and ') + ' ' + (stops.length > 1 ? 'are' : 'is') + ' short. Replacement stock is being expedited. Revised completion date to follow." The factory did not discover this on Wednesday. The line did.</div>'
    : '<div class="note good"><b>The line runs</b>Wednesday passes without an email. Every shortage was found, and fixed, while it was still cheap.</div>';
  el(J.muteBtn() + '<div class="card"><h3>Build ' + (G.b + 1) + ' · the line starts</h3><h2>' + (stops.length ? 'The line stopped' : 'The build ran') + '</h2>' + lineScene(stops.length > 0) + story +
   (tails.length ? '<div class="note warn"><b>The quiet part</b>' + tails.map(function (l) { return l.n; }).join(', ') + ' ran on the oldest stock in the building, all in one lot, because the front of the shelf was empty. You will hear about it later.</div>' : '') +
   (cost ? '<div class="cost" id="cst">−€0k</div>' : '') +
   '<button class="btn" data-a="' + (G.b + 1 >= BUILDS ? 'later' : 'next') + '">' + (G.b + 1 >= BUILDS ? 'Fast-forward two years' : 'Next build') + '</button></div>');
  var st = $q('#stage');
  if (stops.length) { J.sfx('alarm'); J.hit(st, 'bad', stops.length > 1 ? 'big' : 'med'); J.count($q('#cst'), 0, cost, 800, function (n) { return '−€' + Math.round(n) + 'k'; }); }
  else { J.sfx('belt'); later(300, function () { J.sfx('good'); J.burstAt(st, { n:26, pal:'good', speed:300, up:true }); J.vibe(J.FEEL.vibe.small); }); }
}

/* ---------- E&O ---------- */
var CLAIM = [
 { n:'MOQ remainder: cells (reel of 10,000, 3,000 used)', v:18, ok:true },
 { n:'Forecast decay: enclosure parts bought on an optimistic forecast', v:26, ok:true },
 { n:'ECO stranded: connector v1 after the change', v:14, ok:false },
 { n:'Reorder of material the building already owned (phantom stock)', v:22, ok:false },
 { n:'Buyer rounded up "to be safe"', v:17, ok:false }
];
function screenLater() {
  G.phase = 'later';
  var tails = G.fifoLines.length;
  if (tails) ledger('Field-failure tail from old stock clustered in builds (' + G.fifoLines.slice(0, 3).join(', ') + ')', 60 * Math.min(tails, 2));
  el(J.muteBtn() + '<div class="card"><h3>Two years later</h3><h2>' + (tails ? 'The tail arrives' : 'End of life') + '</h2>' +
   (tails ? '<div class="stage j-siren" id="stage"><div class="floor"></div><div style="position:absolute;inset:0;display:grid;place-items:center;font-size:64px" class="j-drop">📦</div><div class="j-blink" style="position:absolute;top:10px;right:14px;font-size:30px">⚠️</div></div><div class="note bad"><b>Intermittent field failures</b>Solderability had decayed on the oldest reels, and FIFO violations cluster old parts into the builds that ran in a shortage. That is how a statistical nuisance becomes a recallable event. Cost €' + (60 * Math.min(tails, 2)) + 'k.</div>' : '<div class="note good"><b>Clean ageing</b>No old stock clustered into a build.</div>') +
   '<p>The product is reaching end of life. Then a spreadsheet arrives from the factory: <b>excess and obsolete</b> material, priced and payable. It was assembled slowly, and much earlier than its discovery date.</p>' +
   '<button class="btn" data-a="eo">Open the claim</button></div>');
  if (tails) { J.sfx('alarm'); J.hit($q('#stage'), 'bad', 'med'); }
}
function screenEo() {
  G.phase = 'eo'; if (!G.eo) { G.eo = { struck:{}, tried:{}, left:2 }; }
  var rep = has('exposure'), scale = rep ? 0.65 : 1;
  var total = 0; CLAIM.forEach(function (c, i) { if (!G.eo.struck[i]) total += Math.round(c.v * scale); });
  G.eoTotal = total;
  el(J.muteBtn() + '<div class="card"><h3>The claim · ' + G.eo.left + ' dispute' + (G.eo.left === 1 ? '' : 's') + ' left</h3><h2>Excess and obsolete</h2>' +
   (rep ? '<div class="note good"><b>You have been watching</b>The monthly exposure report kept the pile smaller, and shows whether each line has a purchase trail against your demand signal.</div>' : '<div class="note warn"><b>No exposure report</b>You see amounts and origins only. An unsubstantiated line is a withdrawn line, but you cannot see which ones are.</div>') +
   '<div class="invoice"><div style="font:900 11px var(--font);letter-spacing:.1em;text-transform:uppercase;color:#6b6252">Invoice · material held against your product</div>' +
   CLAIM.map(function (c, i) { var s = G.eo.struck[i], t = G.eo.tried[i];
     return '<button class="claim' + (s ? ' struck' : t ? ' tried' : '') + '" data-a="dispute" data-i="' + i + '"' + (s || t || G.eo.left <= 0 ? ' disabled' : '') + '><b>' + c.n + '</b><span>' + (s ? 'Struck: unsubstantiated' : t ? 'Disputed: the purchase trail holds, so it stands' : rep ? (c.ok ? 'Purchase trail matches your forecast' : 'No purchase trail against your demand signal') : 'Tap to dispute') + '</span><em>€' + Math.round(c.v * scale) + 'k</em>' + (s ? '<div class="st" style="color:#1f7a3a">VOID</div>' : t ? '<div class="st" style="color:#a45a00">STANDS</div>' : '') + '</button>'; }).join('') +
   '<div class="inv-total"><span>Claim total</span><em id="tot">€' + total + 'k</em></div></div>' +
   '<button class="btn" data-a="pay">Settle the claim</button></div>');
  if (G.eo.flash) { var which = G.eo.flash; G.eo.flash = null; var node = $app.querySelectorAll('.claim')[which.i]; if (which.good) { J.sfx('coin'); J.hit(node, 'good', 'med'); J.floatAt(node, 'VOID', '#3ddc84', 20); } else { J.sfx('bad'); J.hit(node, 'neutral', 'small'); J.floatAt(node, 'STANDS', '#ff9f43', 18); } }
}
function doDispute(i) {
  if (G.eo.left <= 0 || G.eo.struck[i] || G.eo.tried[i]) return; G.eo.left--;
  if (!CLAIM[i].ok) { G.eo.struck[i] = true; G.eo.flash = { i:i, good:true }; } else { G.eo.tried[i] = true; G.eo.flash = { i:i, good:false }; }
  screenEo();
}
function score() {
  var costs = 0; G.ledger.forEach(function (x) { costs += x.cost; });
  var rows = []; var base = Math.max(0, Math.round(1000 - costs * 1.25));
  rows.push(['Total cost: €' + costs + 'k', base]);
  return { rows:rows, total:base, costs:costs };
}
function screenResult() {
  G.phase = 'result';
  ledger('Excess and obsolete claim', G.eoTotal);
  var sc = score(), best = store.get('best', 0), nb = sc.total > best;
  if (nb) store.set('best', sc.total);
  try { HHL.submit(103, sc.total); } catch (e) {}
  var stamp = sc.total >= 700 ? 'pass' : sc.total >= 400 ? 'warn' : 'fail';
  var txt = sc.total >= 700 ? 'THE SHELF MATCHED' : sc.total >= 400 ? 'WEDNESDAY HURT' : 'THE SYSTEM LIED';
  var stops = 0; G.results.forEach(function (r) { stops += r.stops; });
  el(J.muteBtn() + '<div class="card"><h3>Two-year result</h3><div class="stamp ' + stamp + '" id="stp">' + txt + '</div><div class="big" id="bigs">0</div>' +
   (nb ? '<p style="text-align:center;color:var(--acc);font-weight:800" class="j-pulse">New best!</p>' : '<p class="small" style="text-align:center">Best ' + fmt(Math.max(best, sc.total)) + '</p>') +
   '<div class="lines">' + sc.rows.map(function (r) { return '<div><span>' + r[0] + '</span><em class="pos">' + r[1] + '</em></div>'; }).join('') + '</div>' +
   '<h3>Where the money went</h3><div class="lines" id="led">' + G.ledger.map(function (x) { return '<div><span>' + x.label + '</span><em class="neg">−€' + x.cost + 'k</em></div>'; }).join('') + '</div>' +
   '<div class="note"><b>What the shelf held</b>Across three builds, ' + G.results.reduce(function (a, r) { return a + r.problems; }, 0) + ' lines had a problem behind a green status. The line stopped ' + stops + ' time' + (stops === 1 ? '' : 's') + '.</div>' +
   (!has('ctb') ? '<div class="note warn"><b>No clear-to-build</b>A factory that produces one without friction shows its material house is in order. Without it, you discover the gap on Wednesday.</div>' : '') +
   (!has('count') ? '<div class="note warn"><b>No cycle counting</b>An annual count is the least informative count in the industry. Records drift between counts.</div>' : '') +
   (!has('fifo') ? '<div class="note warn"><b>FIFO by honour</b>The front is where everyone\'s hands are, and the front is the newest.</div>' : '') +
   (!has('exposure') ? '<div class="note warn"><b>No exposure report</b>The monthly report is boring for a year, and is the fuse of the final bill.</div>' : '') +
   HHL.next(103) +
   '<div class="row"><button class="btn" data-a="again">Another factory</button><button class="btn ghost" data-a="menu">Menu</button></div></div>');
  J.stamp($q('#stp'), stamp); J.count($q('#bigs'), 0, sc.total, 1200);
  later(1300, function () { if (stamp === 'pass') { J.confetti(); J.sfx('win'); } else J.sfx(stamp === 'warn' ? 'ok' : 'lose'); });
  J.stagger($app.querySelectorAll('#led div'), 50);
}

/* ---------- events ---------- */
$app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  var a = b.dataset.a, id = b.dataset.id;
  switch (a) {
    case 'start': newGame(); screenDemands(); break;
    case 'dem': { var i = G.dem.indexOf(id); if (i >= 0) G.dem.splice(i, 1); else if (G.dem.length < 2) { G.dem.push(id); J.sfx('confirm'); } screenDemands(); if (i < 0) { var sl = $app.querySelectorAll('.slot.on'); if (sl.length) { J.pop(sl[sl.length - 1], 1.3); J.burstAt(sl[sl.length - 1], { n:10, pal:'acc', speed:160 }); } } break; }
    case 'build': G.b = 0; G.sel = -1; G.build = makeBuild(0); screenBuild(); break;
    case 'bay': selectBay(Number(b.dataset.i)); break;
    case 'chk': doCheck(Number(b.dataset.i), b.dataset.k); break;
    case 'fix': doFix(Number(b.dataset.i)); break;
    case 'cover': doCover(Number(b.dataset.i)); break;
    case 'start-line': startLine(); break;
    case 'next': G.b++; G.sel = -1; G.build = makeBuild(G.b); screenBuild(); break;
    case 'later': screenLater(); break;
    case 'eo': screenEo(); break;
    case 'dispute': doDispute(Number(b.dataset.i)); break;
    case 'pay': screenResult(); break;
    case 'again': newGame(); screenDemands(); break;
    case 'menu': screenTitle(); break;
  }
});
newGame(); screenTitle();
window.__f3 = { G:function () { return G; }, score:score };
})();
</script>
</body>
